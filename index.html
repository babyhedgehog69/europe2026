<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Europe 2026</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#12150F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Cormorant+Garamond:ital,wght@1,300;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#12150F;--fg:#F0E9D8;--mute:#8A8878;--wash:#1C201A;--edge:#F0E9D8;
  --p1:#F0E9D8;--p2:#F0E9D8;
  --pad:16px;--lead:32px;--gap:12px;
  --dp:"Archivo",system-ui,sans-serif;
  --sr:"Cormorant Garamond",Georgia,serif;
  --mn:"Space Mono",ui-monospace,monospace;
}
body.light{--bg:#F0E9D8;--fg:#16190F;--mute:#7C7A6A;--wash:#E4DBC6;--edge:#16190F}
body.light .pnl>.ph .lbl,
body.light .pnl>.ph .lbl.city,
body.light .hd .lbl,
body.light .plan .when,
body.light .fld .k,
body.light .addrow,
body.light .locbar.on,
body.light #datebtn u,
body.light .wxline.tap,
body.light .wxin .temp em{color:var(--fg)}
body.light .wxin .temp em,
body.light .plans .add,
body.light .pnl>.ph .tw{border-color:var(--fg);color:var(--fg)}
body.light .pnl.open>.ph .tw{background:var(--fg);color:var(--bg)}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--fg);font-family:var(--dp);font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
}
a{color:inherit}
button,a,input,select{touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left;-webkit-user-select:none;user-select:none}
:focus-visible{outline:2px solid var(--p2);outline-offset:2px}
input,select{font:inherit;color:inherit;background:var(--wash);border:1.5px solid var(--edge);padding:13px;width:100%;font-family:var(--mn);font-size:16px;border-radius:0}
select{appearance:none}
input[type=time]{min-height:42px}
.phone{max-width:520px;margin:0 auto;padding:0 var(--pad) calc(34px + env(safe-area-inset-bottom))}
.lbl{font-family:var(--mn);font-size:12.5px;font-weight:700;letter-spacing:.15em;text-transform:uppercase}

.flag{display:block;background:var(--fg);box-shadow:0 0 0 1px var(--mute)}
.flag.es{background:linear-gradient(#C60B1E 0 25%,#FFC400 25% 75%,#C60B1E 75%)}
.flag.de{background:linear-gradient(#0F0F0F 0 33.4%,#DD0000 33.4% 66.7%,#FFCE00 66.7%)}
.flag.ie{background:linear-gradient(90deg,#169B62 0 33.4%,#FFF 33.4% 66.7%,#FF883E 66.7%)}
.flag.se{background-color:#006AA7;background-image:linear-gradient(90deg,transparent 0 30%,#FECC00 30% 46%,transparent 46%),linear-gradient(0deg,transparent 0 38%,#FECC00 38% 62%,transparent 62%)}
.flag.us{background:linear-gradient(#3C3B6E,#3C3B6E) 0 0/40% 54% no-repeat,repeating-linear-gradient(#B22234 0 7.7%,#FFF 7.7% 15.4%)}
.flag.xx{background:repeating-linear-gradient(45deg,var(--fg) 0 4px,var(--bg) 4px 8px)}

#lock{min-height:100dvh;display:flex;flex-direction:column;justify-content:center}
.lock-mark{font-family:var(--sr);font-style:italic;font-weight:300;font-size:clamp(52px,17vw,74px);line-height:.92;letter-spacing:-.01em}
.lock-sub{color:var(--mute);font-size:14.5px;margin-top:14px;max-width:30ch;border-top:1.5px solid var(--edge);padding-top:13px}
.lock-form{margin-top:24px;display:flex;flex-direction:column;gap:8px}
#pass{text-align:center;font-size:17px}
#unlock{padding:15px;background:var(--fg);color:var(--bg);font-weight:800;font-stretch:118%;font-size:15px;text-transform:uppercase;text-align:center;letter-spacing:.04em}
#unlock:disabled{opacity:.45}
.lock-msg{min-height:18px;font-family:var(--mn);font-size:13px;color:#FF6B60}

#app{display:none}
#app.on{display:block}

.mast{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:22px 0 13px;border-bottom:1.5px solid var(--edge)}
.mast b{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:26px;font-weight:800;font-stretch:122%;letter-spacing:-.04em;text-transform:uppercase;line-height:1;color:var(--mc,var(--fg));letter-spacing:-.01em}
.mast .grp{flex:0 0 auto;display:flex;align-items:center;gap:7px;line-height:1;font-family:var(--mn);font-size:12.5px;color:var(--mute);letter-spacing:.04em}
#wxmode{width:34px;height:34px;flex:0 0 auto;border:1.5px solid var(--edge);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--fg);padding:0}
#units{width:30px;height:30px;flex:0 0 auto;border:1.5px solid var(--edge);border-radius:50%;font-family:var(--mn);font-size:11.5px;display:flex;align-items:center;justify-content:center;color:var(--fg);padding:0}
#home{width:30px;height:30px;flex:0 0 auto;border:1.5px solid var(--edge);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--fg);text-decoration:none}
#home.off{opacity:.35;pointer-events:none}
#clk{width:30px;height:30px;flex:0 0 auto;border:1.5px solid var(--edge);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--fg);padding:0}
#clk.on{background:var(--fg);color:var(--bg)}
#fx{width:30px;height:30px;flex:0 0 auto;border:1.5px solid var(--edge);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--fg);padding:0;font-family:var(--mn);font-size:13.5px}
#fx.on{background:var(--fg);color:var(--bg)}
.fxpanel{border:1.5px solid var(--edge);border-top:0;padding:14px var(--pad)}
.fxrow{display:flex;align-items:center;gap:7px}
.fxrow input{flex:1 1 0;text-align:right;font-size:17px;padding:9px}
.fxrow span{font-family:var(--mn);font-size:13px;color:var(--mute);width:34px}
.fxrate{font-family:var(--mn);font-size:12.5px;color:var(--mute);margin-top:8px;letter-spacing:.06em}
#invert{width:30px;height:30px;flex:0 0 auto;border:1.5px solid var(--edge);border-radius:50%;background:linear-gradient(90deg,var(--fg) 0 50%,var(--bg) 50%)}

.cal{border:1.5px solid var(--edge);border-top:0}
.cal-head{display:flex;align-items:baseline;justify-content:space-between;padding:15px var(--pad)}
.cal-head b{font-size:17px;font-weight:800;font-stretch:112%;text-transform:uppercase;letter-spacing:-.02em}
.cal-head span{font-family:var(--mn);font-size:12.5px;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--edge)}
.dow{font-family:var(--mn);font-size:11px;color:var(--mute);text-align:center;padding:9px 0;border-right:1px solid var(--edge);border-bottom:1px solid var(--edge)}
.dow:nth-child(7n){border-right:0}
.cell{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;border-right:1px solid var(--edge);border-bottom:1px solid var(--edge);background:var(--bg);position:relative;padding:0}
.cell.trip{background:color-mix(in srgb,var(--cc) 78%,var(--bg));color:#12150F}
.cell.trip.split{background:linear-gradient(135deg,color-mix(in srgb,var(--cc) 78%,var(--bg)) 0 50%,color-mix(in srgb,var(--cc2) 78%,var(--bg)) 50% 100%)}
.cell.past.trip{background:color-mix(in srgb,var(--cc) 30%,var(--bg));color:var(--mute)}
.cell.past.trip.split{background:linear-gradient(135deg,color-mix(in srgb,var(--cc) 30%,var(--bg)) 0 50%,color-mix(in srgb,var(--cc2) 30%,var(--bg)) 50% 100%)}
.cnum{position:absolute;top:5px;right:7px;font-family:var(--mn);font-size:14px;line-height:1;opacity:.8}
.cell.trip .cnum{opacity:.9}
.cell:nth-child(7n){border-right:0}

.cell.out{color:color-mix(in srgb,var(--mute) 42%,var(--bg))}
.cell.out .ctmp{display:none}



.cell.sel{box-shadow:inset 0 0 0 3px var(--fg)}


.cell.dot::after{content:"";position:absolute;width:4px;height:4px;background:currentColor;border-radius:50%;top:7px;left:7px;opacity:.85}
.cell.now::before{content:"";position:absolute;left:7px;bottom:6px;width:5px;height:5px;border-radius:50%;background:currentColor}
.tabs{display:flex;border:1.5px solid var(--edge);border-top:0}
.tabs button{flex:1 1 0;padding:15px;text-align:center;font-family:var(--mn);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);border-right:1.5px solid var(--edge)}
.tabs button:last-child{border-right:0}
.tabs button.on{background:var(--fg);color:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:13px var(--pad);border:1.5px solid var(--edge);border-top:0}
.chips button{display:flex;align-items:center;gap:6px;font-family:var(--mn);font-size:13px;text-transform:uppercase;letter-spacing:.06em;border:1.5px solid var(--edge);padding:6px 8px;color:var(--mute)}
.chips button.on{background:var(--fg);color:var(--bg)}
.chips .flag{width:15px;height:9px}
.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:9px 16px;padding:14px var(--pad);border-top:1px solid var(--edge)}
.legend span{display:flex;align-items:center;gap:5px;font-family:var(--mn);font-size:12.5px;color:var(--mute)}
.legend i{width:13px;height:8px;display:block}

.nav{border:1.5px solid var(--edge);border-top:0}
.navrow{display:flex;align-items:center;gap:var(--gap);padding:12px var(--pad)}
.wxrow{padding:0 var(--pad) 16px}
.nav .arw{width:44px;height:44px;flex:0 0 44px;font-size:15px;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--edge);border-radius:50%}
.nav .arw:disabled{opacity:.28}
#datebtn{flex:1 1 auto;min-width:0;text-align:center;padding:2px 0}
#datebtn b{display:block;font-size:19px;font-weight:800;font-stretch:112%;text-transform:uppercase;letter-spacing:-.025em;line-height:1.1}
#datebtn span{display:block;font-family:var(--mn);font-size:13px;color:var(--mute);letter-spacing:.1em;margin-top:2px}
#datebtn u{text-decoration:none;color:var(--p2)}
.past-day{opacity:.52}




.hotel{font-size:25px;font-weight:800;font-stretch:122%;text-transform:uppercase;letter-spacing:-.035em;line-height:1;color:var(--fg);margin-top:9px}
.place .top .flags{display:flex;align-items:center;gap:5px;flex:0 0 auto}
.place .top .flags em{font-style:normal;font-family:var(--mn);font-size:13px;color:var(--mute)}


#screen>div>div:first-child{border-top:1.5px solid var(--edge)}
.hd{display:flex;align-items:center;gap:9px}
.hd .lbl{color:var(--p2);white-space:nowrap}
.hd .rule{flex:1 1 auto;height:1.5px;background:var(--edge)}
.hd .n{font-family:var(--mn);font-size:12.5px;color:var(--mute);white-space:nowrap}

.leg{display:flex;align-items:flex-start;gap:8px;margin-top:12px}
.leg b{display:block;font-size:31px;font-weight:800;font-stretch:122%;line-height:.85;letter-spacing:-.04em}
.leg a{text-decoration:none;display:block}
.leg a b{color:var(--ac)}
.leg .t{display:block;font-family:var(--mn);font-size:14px;font-weight:700;margin-top:5px}
.leg em{display:block;font-style:normal;font-family:var(--mn);font-size:12.5px;color:var(--mute);margin-top:2px;text-transform:uppercase}
.leg .to{text-align:right}
.leg .end{flex:1 1 0;min-width:0}
.leg .mid{flex:1.5 1 0;min-width:0;padding-top:2px;padding-bottom:0;text-align:center}
.leg .mid .air{display:block;font-family:var(--mn);font-size:12.5px;color:var(--fg);margin-bottom:5px;line-height:1.3}
.leg .mid i{display:block;height:1.5px;background:var(--edge)}
.leg .mid .dur{display:block;font-family:var(--mn);font-size:13px;color:var(--mute);margin-top:5px;line-height:1.3}
.plus{display:inline!important;margin:0!important;font-size:13px!important;background:var(--p2);color:#12150F!important;padding:0 3px}

.title{font-size:22px;font-weight:800;font-stretch:118%;text-transform:uppercase;letter-spacing:-.03em;line-height:1;margin-top:9px}
.sub{font-family:var(--mn);font-size:13px;color:var(--mute);margin-top:5px;text-transform:uppercase}

.codes{display:flex;flex-wrap:wrap;gap:7px;margin-top:13px}
.code{border:1.5px solid var(--edge);padding:9px 11px;background:transparent}
.code .l{display:block;font-family:var(--mn);font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.code .v{display:block;font-family:var(--mn);font-size:15px;font-weight:700;margin-top:1px}
.code.info{border-color:var(--mute)}
.code.info .v{font-size:13.5px;font-weight:400}
.code.done{background:var(--p1);border-color:var(--p1);color:#12150F}
.code.done .l{color:rgba(0,0,0,.55)}




.low{display:flex;align-items:center;gap:7px;margin-top:10px;padding-top:10px;border-top:1px solid var(--edge)}
.low .who{flex:1 1 auto;min-width:0;font-family:var(--mn);font-size:13px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ico{width:44px;height:44px;flex:0 0 auto;border:1.5px solid var(--edge);border-radius:50%;display:flex;align-items:center;justify-content:center}
.ico svg{width:19px;height:19px;stroke:var(--fg);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg.mini{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-2px;margin-right:4px}
.leave{font-family:var(--mn);font-size:13px;color:var(--mute);text-transform:uppercase;letter-spacing:.08em;padding-bottom:9px;margin-bottom:10px;border-bottom:1px solid var(--edge)}
.leave b{color:var(--fg);font-weight:700}
.checkin{font-family:var(--mn);font-size:13px;color:var(--fg);margin-top:8px;letter-spacing:.06em}
.xfer{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.xfer span{font-family:var(--mn);font-size:13px;color:var(--fg);border:1.5px solid var(--mute);padding:5px 8px;display:inline-flex;align-items:center}
.xfer .src{border:0;color:var(--mute);padding-left:0}
.place h2 i{font-style:normal;color:var(--mute);font-weight:400;font-family:var(--mn);font-size:13px;text-transform:none;letter-spacing:.06em}
.notes{margin-top:11px;padding-top:10px;border-top:1px solid var(--edge);font-family:var(--mn);font-size:13px;color:var(--mute);line-height:1.6}
.notes p+p{margin-top:2px}

.pnl{border:1.5px solid var(--edge);border-top:0}
.pnl>.ph{display:flex;align-items:center;gap:var(--gap);padding:15px var(--pad);width:100%;min-height:62px}
.pnl>.ph .phmain{flex:1 1 auto;display:flex;align-items:center;gap:var(--gap);min-width:0;padding:0}
.pnl>.ph .locbtn{flex:0 0 var(--lead);width:var(--lead);height:var(--lead);border:1.5px solid var(--mute);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--mute);padding:0}
.pnl>.ph .locbtn.on{border-color:var(--p2);color:var(--p2)}
.pnl>.ph .locbtn svg{margin:0;width:16px;height:16px}
.pnl>.ph .flag{width:var(--lead);height:21px;flex:0 0 var(--lead)}
.pnl>.ph .lbl{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--dp);font-size:19px;font-weight:800;font-stretch:122%;letter-spacing:-.03em;text-transform:uppercase;color:var(--p1);line-height:1}

.pnl>.ph .meta{display:flex;align-items:center;font-family:var(--mn);font-size:13px;color:var(--mute);white-space:nowrap}
.pnl>.ph .meta svg{stroke:currentColor;fill:none;stroke-width:1.8;width:14px;height:14px}
.pnl>.ph .tw{flex:0 0 var(--lead);width:var(--lead);height:var(--lead);border:1.5px solid var(--p2);color:var(--p2);display:flex;align-items:center;justify-content:center;font-family:var(--mn);font-size:16px;line-height:1;padding-bottom:2px}
.pnl.open>.ph .tw{background:var(--p2);color:var(--bg)}
.pnl>.pb{padding:0 var(--pad) 18px}
.spot{display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--edge)}
.spot:last-of-type{border-bottom:0}
.spot a{flex:1 1 auto;min-width:0;text-decoration:none}
.spot b{display:block;font-size:16px;font-weight:800;font-stretch:112%;text-transform:uppercase;letter-spacing:-.02em;line-height:1.15}
.spot span{display:block;font-family:var(--mn);font-size:13px;color:var(--mute);margin-top:2px}

.wxload{font-family:var(--mn);font-size:13px;color:var(--mute);letter-spacing:.08em;text-transform:uppercase}
.wxtop{display:flex;align-items:flex-start;gap:10px}
.wxin .temp{display:flex;align-items:baseline;gap:6px;padding:0}
.wxin .temp b{font-size:31px;font-weight:800;font-stretch:122%;letter-spacing:-.04em;line-height:.9}
.wxin .temp span{font-size:19px;font-weight:800;font-stretch:122%;color:var(--mute);line-height:.9}
.wxin .temp em{font-style:normal;font-family:var(--mn);font-size:13px;color:var(--p2);border:1.5px solid var(--p2);padding:1px 3px;margin-left:2px}
.wxin .at{font-family:var(--mn);font-size:13px;color:var(--mute);line-height:1.5}
.wxin .pill{margin-left:auto;font-family:var(--mn);font-size:13px;border:1.5px solid var(--mute);padding:5px 7px;white-space:nowrap}
.wxline{display:flex;align-items:center;gap:8px;width:100%;font-family:var(--mn);font-size:13px;color:var(--mute);margin-top:10px;padding-top:9px;border-top:1px solid var(--edge);line-height:1.5;text-align:left}
.wxline b{color:var(--fg);font-weight:700}
.wxline.tap{color:var(--fg)}
.wxline .chev{font-style:normal;margin-left:auto;color:var(--mute);font-size:17px;line-height:1}
.picker .locbar{border:1.5px solid var(--mute);border-top:1.5px solid var(--mute);margin:0}
.locbar{display:flex;align-items:center;justify-content:center;width:100%;border:1.5px solid var(--edge);border-top:0;padding:14px var(--pad);font-family:var(--mn);font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.locbar.on{color:var(--p2);border-color:var(--p2)}
.far{flex:0 0 auto;text-align:right;text-decoration:none;font-family:var(--mn);font-size:13px;color:var(--fg);border:1.5px solid var(--mute);padding:5px 7px;line-height:1.35}
.far span{display:block;white-space:nowrap}
.far span:last-child{color:var(--mute)}
.sinfo{flex:1 1 auto;min-width:0}
.sinfo b{display:block;font-size:18px;font-weight:800;font-stretch:112%;text-transform:uppercase;letter-spacing:-.02em;line-height:1.15}
.sinfo span{display:block;font-family:var(--mn);font-size:13px;color:var(--mute);margin-top:4px;line-height:1.5}
.l2{display:block;font-style:normal;margin-top:2px}
.shut{font-style:normal;color:#FF6B60}
.sacts{flex:0 0 auto;display:flex;align-items:center;gap:7px}
.spot.gone{opacity:.45}
.spot.gone b{text-decoration:line-through}
.spot .note{display:block;font-family:var(--mn);font-size:13px;color:var(--mute);margin-top:3px;line-height:1.45;text-decoration:none}
.seenbar{width:100%;font-family:var(--mn);font-size:13px;color:var(--mute);letter-spacing:.1em;text-transform:uppercase;padding:14px 0 4px;border-top:1px solid var(--edge);margin-top:4px}
.paste{margin-top:10px;padding-top:11px;border-top:1.5px solid var(--edge);display:flex;flex-direction:column;gap:9px}
.bigadd{width:100%;background:var(--fg);color:var(--bg);padding:17px;text-align:center;font-weight:800;font-stretch:118%;font-size:15px;text-transform:uppercase;letter-spacing:.04em;margin-top:14px}
.addrow{font-family:var(--mn);font-size:13px;color:var(--p2);letter-spacing:.1em;text-transform:uppercase;padding:9px 0 0;border-top:1px solid var(--edge);margin-top:2px;width:100%}
.paste textarea{padding:13px;font-family:var(--mn);font-size:15px;background:var(--wash);color:var(--fg);border:1.5px solid var(--edge);padding:10px;width:100%;min-height:74px;resize:vertical;border-radius:0}
.paste .hint{font-family:var(--mn);font-size:13px;color:var(--mute);line-height:1.5}
.plans .add{width:24px;height:24px;flex:0 0 auto;border:1.5px solid var(--p2);border-radius:50%;color:var(--p2);display:flex;align-items:center;justify-content:center;font-size:16px;line-height:1;padding-bottom:2px}
.plan{padding:15px 0;border-bottom:1px solid var(--edge)}
.plan:last-of-type{border-bottom:0}
.ptop{display:flex;align-items:baseline;gap:10px}

function migratePlans(){
  let hit=false;

const nkey=(sp)=>(sp.name||"").toLowerCase().replace(/[^a-z0-9]/g,"");
function seedSpots(trip){
  let hit=false;
  Object.keys(SPOTS).forEach((city)=>{
    const seen={},out=[];

  });

}

const b64=(s)=>Uint8Array.from(atob(s),(c)=>c.charCodeAt(0));
const tob64=(b)=>btoa(String.fromCharCode(...new Uint8Array(b)));
let CKEY=null;
async function decrypt(blob,pass){
  const bk=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]);
  const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(blob.salt),iterations:blob.iterations||250000,hash:"SHA-256"},bk,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
  const out=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(blob.iv)},k,b64(blob.data))));
  CKEY=k; return out;
}
async function seal(obj){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  return tob64(iv)+"."+tob64(await crypto.subtle.encrypt({name:"AES-GCM",iv},CKEY,new TextEncoder().encode(JSON.stringify(obj))));
}
async function open_(str){
  const [iv,ct]=str.split(".");
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(iv)},CKEY,b64(ct))));
}

function guessSec(url,name){
  let hay="";
  const m=(url||"").match(/!15s([^!?]+)/);
  if(m){ try{ const b=m[1].replace(/-/g,"+").replace(/_/g,"/"); hay=atob(b+"=".repeat((4-b.length%4)%4)); }catch{} }
  hay+=" "+(name||"");
  for(const [re,sec] of CATMAP) if(re.test(hay)) return sec;
  return "Food and Drink";
}

function parseSpot(text){
  text=(text||"").trim();
  const url=(text.match(/https?:\/\/\S+/)||[])[0]||"";
  let name="";
  const m=url.match(/\/maps\/place\/([^\/@?]+)/);
  if(m){ try{ name=decodeURIComponent(m[1].replace(/\+/g," ")); }catch{ name=m[1].replace(/\+/g," "); } }
  if(!name){
    const lines=text.split(/\n+/).map((l)=>l.trim()).filter((l)=>l&&!/^https?:/i.test(l));
    if(lines.length) name=lines[0];
  }
  name=name.replace(/\s*[·|]\s*[\d.]+\s*★.*$/,"").replace(/^["'“]|["'”]$/g,"").trim();
  let lat=null,lng=null;
  const c=url.match(/!3d(-?[\d.]+)!4d(-?[\d.]+)/)||url.match(/@(-?[\d.]+),(-?[\d.]+)/);
  if(c){ lat=parseFloat(c[1]); lng=parseFloat(c[2]); }
  return {name,url,lat,lng,sec:guessSec(url,name)};
}

function build(trip){
  const out=[];
  const home=trip.meta.home||{city:"Home",country:"",flag:"xx",pop:"#4A6CF7"};
  for(let t=d(trip.meta.start);iso(t)<=trip.meta.end;t.setDate(t.getDate()+1)){
    const date=iso(t);
    const flights=trip.flights.filter((f)=>f.date===date);
    const stay=trip.stays.find((s)=>s.checkIn<=date&&date<s.checkOut);
    const arriving=trip.stays.filter((s)=>s.checkIn===date);
    const leaving=trip.stays.filter((s)=>s.checkOut===date&&s.checkOutTime);
    const cars=(trip.cars||[]).map((c)=>{
      if(c.pickup&&c.pickup.date===date) return {...c,leg:"pickup"};
      if(c.dropoff&&c.dropoff.date===date) return {...c,leg:"dropoff"};
      return null;
    }).filter(Boolean);
    const src=stay||arriving[0]||null;
    out.push({date,flights,stay,arriving,leaving,cars,
      city:src?src.city:home.city,country:src?src.country:home.country,
      flag:src?src.flag:home.flag,p1:src?src.pop1:home.pop,p2:src?src.pop2:home.pop});
  }
  return out;
}

const R=6371;
function km(a,b,c,d){
  const t=(v)=>v*Math.PI/180, dLat=t(c-a), dLon=t(d-b);
  const h=Math.sin(dLat/2)**2+Math.cos(t(a))*Math.cos(t(c))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
const fmtKm=(k)=>k<1?Math.round(k*1000)+" m":k.toFixed(k<10?1:0)+" km";
const driveMin=(k)=>Math.max(2,Math.round(k*1.3/28*60));
const walkMin=(k)=>Math.round(k*1.25/4.8*60);

function far(sp){
  if(!ME||sp.lat==null) return "";
  const k=km(ME.lat,ME.lng,sp.lat,sp.lng);
  const dir=`https://www.google.com/maps/dir/?api=1&destination=${sp.lat},${sp.lng}`;
  const legs=k<=2
    ? `${WALK}~${walkMin(k)} min`
    : `${CAR}~${driveMin(k)} min`;
  return `<a class="far" href="${dir}" target="_blank" rel="noopener"><span>${fmtKm(k)}</span><span>${legs}</span></a>`;
}

function T(t){
  if(!clock12||!t) return t||"";
  const m=String(t).match(/^(\d{1,2}):(\d{2})/);
  if(!m) return t;
  let h=+m[1]; const mi=m[2], ap=h>=12&&h<24?"pm":"am";
  h=h%12; if(h===0)h=12;
  return h+":"+mi+" "+ap;
}

function geoFor(x){
  const s=x.arriving[0]||x.stay;
  if(s&&s.lat!=null) return {lat:s.lat,lng:s.lng,city:s.city};
  const i=DAYS.indexOf(x);
  for(let j=i+1;j<DAYS.length;j++){
    const n=DAYS[j].arriving[0]||DAYS[j].stay;
    if(n&&n.lat!=null) return {lat:n.lat,lng:n.lng,city:n.city};
  }
  return null;
}

async function getWx(x){
  const g=geoFor(x); if(!g)return;
  const key=g.city+"|"+x.date;
  if(WX[key]!==undefined) return;
  WX[key]=null;
  try{
    const u=`https://api.open-meteo.com/v1/forecast?latitude=${g.lat}&longitude=${g.lng}`
      +`&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,weather_code`
      +`&daily=weather_code&hourly=temperature_2m,precipitation_probability,uv_index&timezone=auto`
      +`&start_date=${x.date}&end_date=${x.date}`;
    const r=await fetch(u);
    if(!r.ok)throw 0;
    const j=await r.json();
    if(!j.daily||j.daily.time.length===0)throw 0;
    const hrs=j.hourly.time.map((t,i)=>({h:t.slice(11,16),temp:j.hourly.temperature_2m[i],pop:j.hourly.precipitation_probability[i],uv:j.hourly.uv_index[i]}))
      .filter((z)=>z.temp!=null);
    if(!hrs.length) throw 0;
    const temps=hrs.map((z)=>z.temp);
    const hi=j.daily.temperature_2m_max[0]!=null?j.daily.temperature_2m_max[0]:Math.max(...temps);
    const lo=j.daily.temperature_2m_min[0]!=null?j.daily.temperature_2m_min[0]:Math.min(...temps);
    const near=(v)=>hrs.reduce((a,b)=>Math.abs(b.temp-v)<Math.abs(a.temp-v)?b:a).h;
    const over=hrs.filter((z)=>z.uv>2);
    WX[key]={
      hi,lo,
      hiAt:near(hi),loAt:near(lo),
      pop:j.daily.precipitation_probability_max[0]||0,
      code:(j.daily.weather_code||[])[0],
      uvMax:Math.max(0,...hrs.map((z)=>z.uv||0)),
      uvFrom:over.length?over[0].h:null, uvTo:over.length?over[over.length-1].h:null,
      hrs
    };
  }catch{ WX[key]=false; }
  drawDay();
}

}

function condIcon(c){
  if(c==null) return {i:SUN,t:"Clear"};
  if(c===0) return {i:SUN,t:"Clear"};
  if(c<=3) return {i:CLOUD,t:c===1?"Mostly clear":c===2?"Partly cloudy":"Cloudy"};
  if(c<=48) return {i:CLOUD,t:"Fog"};
  if(c<=67||(c>=80&&c<=82)) return {i:RAINY,t:"Rain"};
  if(c<=77) return {i:CLOUD,t:"Snow"};
  return {i:RAINY,t:"Storms"};
}



function weatherBox(x){

  const SC=units==="C"?{min:0,max:42}:{min:32,max:108};

  const pos=(c)=>Math.max(0,Math.min(100,(val(c)-SC.min)/(SC.max-SC.min)*100));
  const L=pos(w.lo), R=pos(w.hi);
  const cond=condIcon(w.code);
  return `<div class="wxin">
    <div class="wxrow2">
      <span class="tlo">${tC(w.lo)}</span>
      <span class="tbar"><i style="left:${pos(w.lo)}%;width:${Math.max(4,pos(w.hi)-pos(w.lo))}%;background:linear-gradient(90deg,#4FA3D1,#E8C64A,#E2703A)"></i></span>
      <span class="thi">${tC(w.hi)}</span>
    </div>
  </div>`;
}

const CUR={USD:"$",EUR:"\u20AC",SEK:"kr",GBP:"\u00A3"};
function localCur(x){
  const s=x.arriving[0]||x.stay;
  if(s&&s.currency) return s.currency;
  if(x.flights.length){
    const to=x.flights[x.flights.length-1].to.code;
    const d=TRIP.stays.find((y)=>y.arrCode===to);
    if(d&&d.currency) return d.currency;
  }
  return (TRIP.meta.home&&TRIP.meta.home.currency)||"USD";
}
async function getFX(){
  try{
    const c=JSON.parse(localStorage.getItem("eu26.fx")||"null");
    if(c&&Date.now()-c.t<864e5){ FX=c.r; return; }
  }catch{}
  try{
    const r=await fetch("https://open.er-api.com/v6/latest/USD");
    const j=await r.json();
    if(j&&j.rates){ FX=j.rates; try{localStorage.setItem("eu26.fx",JSON.stringify({t:Date.now(),r:FX}))}catch{} }
  }catch{ FX=null; }
  drawFx();
}
function drawFx(){
  const el=$("#fxbox"); if(!el)return;
  if(!fxOpen){ el.innerHTML=""; return; }
  const x=DAYS[cur], code=localCur(x);
  if(!FX){ el.innerHTML=`<div class="fxpanel"><p class="fxrate">Fetching rates</p></div>`; getFX(); return; }
  const rate=FX[code]||1;
  el.innerHTML=`<div class="fxpanel">
    <div class="fxrow"><span>${esc(code)}</span><input id="fx-loc" inputmode="decimal" value="10"><span>${esc(CUR[code]||code)}</span></div>
    <div class="fxrow" style="margin-top:6px"><span>USD</span><input id="fx-usd" inputmode="decimal" value="${(10/rate).toFixed(2)}"><span>${esc(CUR.USD)}</span></div>
    <p class="fxrate">1 ${esc(code)} = ${(1/rate).toFixed(3)} USD &middot; updated daily</p>
  </div>`;
  const u=$("#fx-usd"), l=$("#fx-loc");
  u.addEventListener("input",()=>{ const v=parseFloat(u.value); l.value=isNaN(v)?"":(v*rate).toFixed(2); });
  l.addEventListener("input",()=>{ const v=parseFloat(l.value); u.value=isNaN(v)?"":(v/rate).toFixed(2); });
}

function askLoc(){
  if(!navigator.geolocation){ toast("No location on this device"); return; }
  toast("Locating");
  navigator.geolocation.getCurrentPosition(
    (p)=>{ ME={lat:p.coords.latitude,lng:p.coords.longitude}; drawDay(); },
    ()=>toast("Location denied"),
    {enableHighAccuracy:false,timeout:8000,maximumAge:120000}
  );
}

const tabs=()=>`<div class="tabs">
    <button class="${calTab==="cal"?"on":""}" data-tab="cal">Calendar</button>
    <button class="${calTab==="places"?"on":""}" data-tab="places">All places</button>
  </div>`;

function cityList(){
  const out=[]; TRIP.stays.forEach((s)=>{if(!out.some((x)=>x.city===s.city))out.push(s)}); return out;
}

function placeRow(sp,i,city,date,hidden){
  return `<div class="swipe">
    <div class="swipe-actions">
      <button class="sa" data-sw-sarch="${esc(city)}|${i}" aria-label="${hidden?"Unhide":"Archive"}">${ARCH}</button>

function drawPlaces(){
  const x=DAYS[cur];
  const cities=cityList();
  if(!pickCity) pickCity=x.city;

  const body=cities.map((c)=>{
    const list=SPOTS[c.city]||[];
    const live=list.map((sp,i)=>({sp,i})).filter(({sp})=>!sp.done);
    const hid=list.map((sp,i)=>({sp,i})).filter(({sp})=>sp.done);
    const id="city:"+c.city;
    const adding=pasting===id;
    const parsed=adding?parseSpot(pasteText):{sec:null};
    const inner=`
      ${live.length?SECTIONS.map((sec)=>{
        const items=sortList(live.filter(({sp})=>sp.sec===sec),(o)=>o.sp);
        if(!items.length) return "";
        const k=c.city+"|"+sec, open=openSec.has(k);
        return `<button class="pgh${open?" on":""}" data-pgh="${esc(k)}"><span class="l">${esc(sec)}</span><span class="n">${items.length}</span><span class="tw">${open?"&minus;":"+"}</span></button>
          ${open?items.map((o)=>placeRow(o.sp,o.i,c.city,x.date)).join(""):""}`;
      }).join(""):`<p class="empty">Nothing saved yet.</p>`}
      ${hid.length?`<button class="seenbar" data-seen="${esc(id)}">${seenOpen.has(id)?"&minus;":"+"} ${hid.length} hidden</button>
        ${seenOpen.has(id)?hid.map((o)=>placeRow(o.sp,o.i,c.city,x.date,true)).join(""):""}`:""}
      ${adding?`<div class="picker">
        <input id="s-paste" value="${esc(pasteText)}" placeholder="Paste a Google Maps link, or type a name" autocomplete="off" autocorrect="off" spellcheck="false">
        <div class="chips sec">${SECTIONS.map((k)=>`<button class="${(pick&&pick.sec||parsed.sec||SECTIONS[1])===k?"on":""}" data-psec="${esc(k)}">${esc(k)}</button>`).join("")}</div>
        <button class="save" id="s-save">Add to ${esc(c.city)}</button>
        <button class="cancel" id="s-cancel">Cancel</button>
      </div>`:`<button class="addrow" data-add="${esc(id)}">+ Add a place</button>`}`;
    return `<div style="--p1:${c.pop1};--p2:${c.pop2}">${panel(id,esc(c.city),live.length||"",inner,{flag:c.flag,city:1})}</div>`;
  }).join("");

  $("#screen").innerHTML=`<div style="--p1:${x.p1};--p2:${x.p2}">
    <button class="locbar${ME?" on":""}" id="loc">${LOC}${ME?"Distances on &middot; tap to refresh":"Show how far things are"}</button>
    ${body}
    ${tabs()}
  </div>`;

  wireTabs();
  if($("#loc")) $("#loc").addEventListener("click",askLoc);
  $("#screen").querySelectorAll("[data-sort]").forEach((b)=>b.addEventListener("click",()=>{
    sortMode=b.dataset.sort;
    try{localStorage.setItem("eu26.sort",sortMode)}catch{}
    if(sortMode==="KM"&&!ME) askLoc(); else draw();
  }));
  $("#screen").querySelectorAll("[data-pnl]").forEach((b)=>b.addEventListener("click",()=>{
    const k=b.dataset.pnl;
    openPanel=openPanel===k?null:k;
    if(pasting&&pasting!==k)pasting=null;
    draw();
  }));
  $("#screen").querySelectorAll("[data-seen]").forEach((b)=>b.addEventListener("click",()=>{
    const k=b.dataset.seen; seenOpen.has(k)?seenOpen.delete(k):seenOpen.add(k); draw();
  }));
  $("#screen").querySelectorAll("[data-pgh]").forEach((b)=>b.addEventListener("click",()=>{
    const k=b.dataset.pgh; openSec.has(k)?openSec.delete(k):openSec.add(k); draw();
  }));
  $("#screen").querySelectorAll("[data-add]").forEach((b)=>b.addEventListener("click",()=>{
    pasting=b.dataset.add; pasteText=""; pick={sec:null}; openPanel=b.dataset.add; draw();
  }));
  wireSpotActions(()=>draw());
  wireSwipe(DAYS[cur]);
  if(pasting&&pasting.indexOf("city:")===0){
    const city=pasting.slice(5);
    const inp=$("#s-paste");
    inp.addEventListener("input",()=>{ pasteText=inp.value; });
    inp.addEventListener("paste",()=>setTimeout(()=>{pasteText=inp.value;pick={sec:null};draw()},0));
    $("#s-cancel").addEventListener("click",()=>{pasting=null;pasteText="";draw()});
    $("#screen").querySelectorAll("[data-psec]").forEach((b)=>b.addEventListener("click",()=>{
      pasteText=$("#s-paste").value; pick={sec:b.dataset.psec}; draw();
    }));
    $("#s-save").addEventListener("click",()=>{
      const txt=$("#s-paste").value;
      const pr=parseSpot(txt);
      const name=pr.name||txt.trim();
      if(!name){ toast("Needs a name or a link"); return; }
      (SPOTS[city]=SPOTS[city]||[]).push({name,url:pr.url||"",sec:(pick&&pick.sec)||pr.sec,lat:pr.lat,lng:pr.lng});
      saveSpots(); pasting=null; pasteText=""; draw(); push("spots:"+city); toast("Added to "+city);
    });
  }
}

function wireTabs(){
  $("#screen").querySelectorAll("[data-tab]").forEach((b)=>b.addEventListener("click",()=>{calTab=b.dataset.tab;pasting=null;draw()}));
}

function paintMast(x){
  const c=$("#mastcity"); if(!c)return;
  c.textContent=x.flights.length&&!x.stay&&!x.arriving.length?x.city:x.city;
  c.style.setProperty("--mc",(x.arriving[0]||x.stay)?x.p1:"var(--fg)");
  const s=x.arriving[0]||x.stay;
  const h=$("#home");
  if(s&&s.address){
    h.href="https://maps.google.com/?q="+encodeURIComponent(s.name+", "+s.address);
    h.target="_blank"; h.rel="noopener"; h.classList.remove("off");
  }else{ h.removeAttribute("href"); h.classList.add("off"); }
}

function drawDay(){
  const x=DAYS[cur],t=d(x.date);
  let html="";
  const def=x.flights.length?"fl0":"plans";
  if(openPanel===undefined) openPanel=def;
  if(x.flights.length){
    x.flights.forEach((f,i)=>{html+=flightHero(f,i)});
    (x.cars||[]).forEach((c,i)=>{html+=carCard(c,i)});
    if(x.arriving.length) html+=placeCard(x);
  }else{
    (x.cars||[]).forEach((c,i)=>{html+=carCard(c,i)});
    if(x.arriving.length) html+=placeCard(x);
  }
  html+=plansBlock(x);

  $("#screen").innerHTML=`
    <div class="nav" style="--p1:${x.p1};--p2:${x.p2}">
      <div class="navrow">
        <button class="arw" id="prev" ${cur===0?"disabled":""} aria-label="Previous day">&larr;</button>
        <button id="datebtn"><b>${DOW[t.getDay()]} ${t.getDate()} ${MON[t.getMonth()]}</b><span>${x.date<iso(new Date())?"DONE &middot; ":""}DAY ${cur+1} / ${DAYS.length}${wxSummary(x)?" &middot; "+esc(wxSummary(x)):""}</span></button>
        <button class="arw" id="next" ${cur===DAYS.length-1?"disabled":""} aria-label="Next day">&rarr;</button>
      </div>
      <div class="wxrow">${weatherBox(x)}</div>
    </div>
    <div class="${x.date<iso(new Date())?"past-day":""}" style="--p1:${x.p1};--p2:${x.p2}">${html}</div>`;

  paintMast(x);
  $("#prev").addEventListener("click",()=>go(cur-1));
  $("#next").addEventListener("click",()=>go(cur+1));
  $("#datebtn").addEventListener("click",()=>{view="cal";draw()});
  $("#screen").querySelectorAll("[data-pnl]").forEach((b)=>b.addEventListener("click",()=>{
    const k=b.dataset.pnl;
    openPanel=openPanel===k?null:k;
    if(k!=="plans")editing=null;
    if(!k.startsWith("sec:"))pasting=null;
    drawDay();
  }));
  if($("#loc")) $("#loc").addEventListener("click",askLoc);
  $("#screen").querySelectorAll("[data-sort]").forEach((b)=>b.addEventListener("click",()=>{
    sortMode=b.dataset.sort;
    try{localStorage.setItem("eu26.sort",sortMode)}catch{}
    if(sortMode==="KM"&&!ME) askLoc(); else draw();
  }));
  wirePlans(x);
  $("#screen").querySelectorAll(".code[data-copy]").forEach((el)=>el.addEventListener("click",async()=>{
    try{
      await navigator.clipboard.writeText(el.dataset.copy);
      el.classList.add("done"); toast("Copied "+el.dataset.copy);
      setTimeout(()=>el.classList.remove("done"),600);
    }catch{ toast("Long-press to select"); }
  }));
}



const port=(code)=>`<a href="https://maps.google.com/?q=${encodeURIComponent(code+" airport")}" target="_blank" rel="noopener" style="--ac:${PORT[code]||"var(--fg)"}"><b>${esc(code)}</b></a>`;

function byeLine(x){
  const s=x.arriving[0]||x.stay;
  const out=x.leaving.find((l)=>!s||l.name!==s.name);
  return out?`<p class="leave">Check out <b>${esc(out.name)}</b> by <b>${esc(T(out.checkOutTime))}</b></p>`:"";
}

function stayBody(s,arriving){
  const t=s.transfer;
  if(s.pending||s.informal) return `<p class="hotel">${esc(s.name)}</p><p class="sub">${esc(s.kind)}</p>`;
  return `<p class="hotel">${esc(s.name)}</p>
    ${arriving?`<p class="sub">${esc(s.room)}</p>
      <p class="checkin">Check in ${esc(T(s.checkInTime||"15:00"))}</p>
      ${t?`<div class="xfer"><span class="src">from ${esc(t.from)}</span><span>${CAR}${esc(t.car)}</span><span>${RAIL}${esc(t.transit)} ${esc(t.transitKind)}</span></div>`:""}
      ${codes(s.codes)}`:""}
    <div class="low">
      <span class="who">${esc(s.address||"")}</span>
      ${s.address?`<a class="ico" href="https://maps.google.com/?q=${encodeURIComponent(s.name+", "+s.address)}" target="_blank" rel="noopener" aria-label="Open in Maps">${PIN}</a>`:""}
      ${s.phone?`<a class="ico" href="tel:${esc(s.phone)}" aria-label="Call">${TEL}</a>`:""}
    </div>`;
}

function carCard(c,i){
  const pick=c.leg==="pickup";
  const leg=pick?c.pickup:c.dropoff;
  const other=pick?c.dropoff:c.pickup;
  const word=pick?"Pick up":"Drop off";
  return panel("car"+i,"Car",`${CARICON}${word} ${esc(T(leg.time))}`,
    `<p class="hotel">${esc(c.vehicle)}</p>
     <p class="sub">${esc(c.company)}</p>
     <p class="checkin">${word} ${esc(T(leg.time))} &middot; ${esc(leg.place)}</p>
     ${codes(c.codes)}
     <div class="low">
       <span class="who">${pick?"Back":"Collected"} ${esc(fmtShort(other.date))} ${esc(T(other.time))}</span>
       <a class="ico" href="https://maps.google.com/?q=${encodeURIComponent(leg.place)}" target="_blank" rel="noopener" aria-label="Open in Maps">${PIN}</a>
     </div>`);
}

function placeCard(x){
  const arriving=!!x.arriving.length;
  const s=x.arriving[0]||x.stay;
  if(!s) return panel("place","Hotel",esc(x.country),`<p class="sub">Travelling</p>`,{city:1});
  const tot=nights(s.checkIn,s.checkOut),n=arriving?1:nights(s.checkIn,x.date)+1;
  return panel("place","Hotel",`${MOON}${n} / ${tot}`,`${byeLine(x)}${stayBody(s,arriving)}`,{city:1});
}

function hoursFor(sp,date){
  if(!sp.hours||!sp.hours.some(Boolean)) return "";
  const h=sp.hours[d(date).getDay()];
  return h?(h==="Open 24h"?h:Trange(h)):"Closed today";
}

function closedDays(sp){
  if(!sp.hours||!sp.hours.some(Boolean)) return "";
  const on=sp.hours.map((h,i)=>h?DOW[i]:null).filter(Boolean);
  const off=sp.hours.map((h,i)=>h?null:DOW[i]).filter(Boolean);
  if(!off.length) return "";
  return on.length<=2?on.join(" and ")+" only":"closed "+off.join(", ");
}

function metaLine(sp,date){
  const a=[];
  if(sp.type) a.push(esc(sp.type));
  if(sp.price) a.push(esc(sp.price));
  if(sp.meals) a.push(esc(sp.meals));
  if(ME&&sp.lat!=null) a.push(fmtKm(km(ME.lat,ME.lng,sp.lat,sp.lng)));

  const b=[];
  const h=hoursFor(sp,date);
  if(h) b.push(h==="Closed today"?`<em class="shut">Closed today</em>`:esc(h));
  const c=closedDays(sp);
  if(c) b.push(esc(c));
  if(sp.note) b.push(esc(sp.note));

  return a.join(" &middot; ")+(b.length?`<em class="l2">${b.join(" &middot; ")}</em>`:"");
}

function travelRow(sp){
  if(sp.lat==null||!ME) return "";
  const k=km(ME.lat,ME.lng,sp.lat,sp.lng);
  const dir=(m)=>`https://www.google.com/maps/dir/?api=1&destination=${sp.lat},${sp.lng}&travelmode=${m}`;
  return `<div class="trav">
    <a href="${dir("walking")}" target="_blank" rel="noopener">${WALK}${walkMin(k)} min</a>
    <a href="${dir("transit")}" target="_blank" rel="noopener">${RAIL}Transit</a>
    <a href="${dir("driving")}" target="_blank" rel="noopener">${CAR}${driveMin(k)} min</a>
  </div>`;
}

function links(sp){
  const out=[];
  const dest=sp.lat!=null?`https://www.google.com/maps/dir/?api=1&destination=${sp.lat},${sp.lng}`:sp.url;
  if(dest) out.push(`<a class="lk" href="${esc(dest)}" target="_blank" rel="noopener" aria-label="Map">${PIN}</a>`);
  if(sp.web) out.push(`<a class="lk" href="${esc(sp.web)}" target="_blank" rel="noopener" aria-label="Website">${GLOBE}</a>`);
  if(sp.phone) out.push(`<a class="lk" href="tel:${esc(sp.phone)}" aria-label="Call">${TEL}</a>`);
  return out.length?`<span class="lks">${out.join("")}</span>`:"";
}

function plannedMap(){
  const m={};
  Object.keys(PLANS).forEach((dt)=>PLANS[dt].forEach((p)=>{
    const k=(p.url||p.title||"").toLowerCase();
    if(k) m[k]=dt;
  }));
  return m;
}

function planRow(p,i,date){
  const t=p.time?(p.end?`${esc(T(p.time))} &ndash; ${esc(T(p.end))}`:esc(T(p.time))):"TBD";
  const head=p.what||p.where||"Plan";
  const sub=[];
  if(p.what&&p.where) sub.push(esc(p.where));
  const m=metaLine(p,date); if(m) sub.push(m);
  return `<div class="swipe${p.done?" arch":""}">
    <div class="swipe-actions">
      <button class="sa" data-sw-edit="${i}" aria-label="Edit">${PENCIL}</button>
      <button class="sa" data-sw-arch="${i}" aria-label="Archive">${ARCH}</button>
      <button class="sa del" data-sw-del="${i}" aria-label="Delete">${XMARK}</button>
    </div>
    <div class="swipe-body"><div class="plan">
    <div class="ptop"><b>${esc(head)}</b></div>
    ${sub.length?`<p class="pmeta">${sub.join(" &middot; ")}</p>`:""}
    <div class="prow"><span class="tbox${p.time?"":" tbd"}">${t}</span>${links(p)}${(ME&&p.lat!=null)?`<button class="goq" data-trav="${i}">${NEAR}</button>`:""}</div>
    ${travOpen===i?travelRow(p):""}
    ${p.note?`<p class="pnote">${esc(p.note)}</p>`:""}
    ${editing===i?planEditor(p,i):""}
  </div></div></div>`;
}

const fmtShort=(dt)=>{const t=new Date(dt+"T00:00:00");return DOW[t.getDay()]+" "+t.getDate();};

function picker(x){
  const q=(pick.q||"").trim();
  const parsed=parseSpot(pick.q);
  const isLink=!!parsed.url;
  const city=x.city;
  const done=plannedMap();
  const key=(sp)=>(sp.url||sp.name||"").toLowerCase();
  const pool=(SPOTS[city]||[]).map((sp,i)=>({sp,i})).filter(({sp})=>!sp.done);

  const row=(o,dim)=>`<div class="optwrap">
      <button class="opt${dim?" dim":""}" data-pickspot="${o.i}">
        <b>${esc(o.sp.name)}</b>
        <span>${metaLine(o.sp,x.date)}${dim?" &middot; planned "+esc(fmtShort(done[key(o.sp)])):""}</span>
      </button>
      ${(ME&&o.sp.lat!=null)?`<button class="goq opt-go" data-travspot="${o.i}">${NEAR}</button>`:""}
      ${travOpen==="s"+o.i?travelRow(o.sp):""}
    </div>`;

  const listOf=(arr)=>{
    const a=sortList(arr,(o)=>o.sp);
    const fresh=a.filter(({sp})=>!done[key(sp)]);
    const used=a.filter(({sp})=>done[key(sp)]);
    return fresh.map((o)=>row(o)).join("")+used.map((o)=>row(o,true)).join("");
  };

  let body;
  if(isLink){
    body=`<div class="chips sec">${SECTIONS.map((k)=>`<button class="${(pick.sec||parsed.sec)===k?"on":""}" data-psec="${esc(k)}">${esc(k)}</button>`).join("")}</div>
      <button class="save" id="pk-new">Add ${esc(parsed.name||"this place")}</button>`;
  }else if(q){
    const hits=pool.filter(({sp})=>(sp.name+" "+(sp.type||"")).toLowerCase().includes(q.toLowerCase()));
    const exact=pool.some(({sp})=>sp.name.toLowerCase()===q.toLowerCase());
    body=`${exact?"":`<button class="save" id="pk-new">Add &ldquo;${esc(q)}&rdquo;</button>`}
      <div class="opts">${hits.length?listOf(hits):`<p class="empty">Nothing matches.</p>`}</div>`;
  }else if(pick.cat){
    const items=pick.cat==="__near"
      ? pool.filter(({sp})=>sp.lat!=null&&ME&&walkMin(km(ME.lat,ME.lng,sp.lat,sp.lng))<=15)
      : pool.filter(({sp})=>sp.sec===pick.cat);
    const ttl=pick.cat==="__near"?"Nearby":pick.cat;
    body=`<div class="cathead"><button class="cback" id="pk-back">&larr;</button><b>${esc(ttl)}</b><span>${items.length}</span></div>
      ${sortCtrl(false)}
      <div class="opts">${items.length?listOf(items):`<p class="empty">${pick.cat==="__near"?(ME?"Nothing within a 15 minute walk.":"Turn on location to see what is close."):"Nothing here yet."}</p>`}</div>`;
  }else{
    const near=ME?pool.filter(({sp})=>sp.lat!=null&&walkMin(km(ME.lat,ME.lng,sp.lat,sp.lng))<=15).length:null;
    body=`<div class="cats">
      <button class="cat near" data-cat="__near"><b>${NEAR}Nearby</b><span>${near==null?"15 min walk":near}</span></button>
      ${SECTIONS.map((sec)=>{
        const n=pool.filter(({sp})=>sp.sec===sec).length;
        return `<button class="cat" data-cat="${esc(sec)}"><b>${esc(sec)}</b><span>${n}</span></button>`;
      }).join("")}</div>`;
  }

  return `<div class="picker">
    <input id="pk-q" value="${esc(pick.q||"")}" placeholder="Search, type a new one, or paste a link" autocomplete="off" autocorrect="off" spellcheck="false">
    ${body}
    <button class="cancel" id="pk-cancel">Cancel</button>
  </div>`;
}

function planEditor(p,i){
  return `<div class="form">
    <div class="fld"><span class="k">What</span><input id="e-what" value="${esc(p.what||"")}" placeholder="Optional" autocomplete="off"></div>
    <div class="fld"><span class="k">Where</span><input id="e-where" value="${esc(p.where||"")}" placeholder="Place" autocomplete="off"></div>
    <div class="fld"><span class="k">When</span><div class="two">
      <input id="e-time" type="time" value="${esc(p.time||"")}"><span>to</span><input id="e-end" type="time" value="${esc(p.end||"")}">
    </div></div>
    <div class="fld"><span class="k">Note</span><input id="e-note" value="${esc(p.note||"")}" placeholder="Optional" autocomplete="off"></div>
    <button class="save" id="e-save">Save</button>
    <div class="row2"><button class="cancel" id="e-cancel">Cancel</button><button class="kill" id="e-kill">Delete</button></div>
  </div>`;
}

const distOf=(o)=>(ME&&o.lat!=null)?km(ME.lat,ME.lng,o.lat,o.lng):Infinity;
const nameOf=(o)=>(o.what||o.where||o.name||"").toLowerCase();

function sortList(arr,getter){
  const a=arr.slice();
  if(sortMode==="ABC") a.sort((x,y)=>nameOf(getter(x)).localeCompare(nameOf(getter(y))));
  else if(sortMode==="KM") a.sort((x,y)=>distOf(getter(x))-distOf(getter(y)));
  return a;
}

function sortCtrl(withTime){
  const opts=withTime?[["123",CLOCK2+"Time"],["ABC","A\u2013Z"],["KM",NEAR+"Near"]]
                     :[["ABC","A\u2013Z"],["KM",NEAR+"Near"]];
  return `<div class="ctrl"><div class="seg">${opts.map(([k,lbl])=>
      `<button class="${sortMode===k?"on":""}" data-sort="${k}">${lbl}</button>`).join("")}</div>
    <button class="locbtn${ME?" on":""}" id="loc" aria-label="Sync location">${LOC}</button></div>`;
}

function geoPlans(x){
  const list=PLANS[x.date]||[];
  const rows=list.map((p,i)=>({p,i})).filter(({p})=>p.lat!=null&&!p.done);
  rows.sort((a,b)=>(a.p.time||"99").localeCompare(b.p.time||"99"));
  return rows.map((o)=>o.p);
}

function routeUrl(x){
  const g=geoPlans(x);
  if(!g.length) return "";
  const pt=(p)=>`${p.lat},${p.lng}`;
  const origin=ME?`${ME.lat},${ME.lng}`:pt(g[0]);
  const rest=ME?g:g.slice(1);
  if(!rest.length) return "";
  const dest=rest[rest.length-1], mids=rest.slice(0,-1);
  let u=`https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${pt(dest)}&travelmode=walking`;
  if(mids.length) u+=`&waypoints=${mids.map(pt).join("|")}`;
  return u;
}

function miniMap(x){
  const g=geoPlans(x);
  const noLoc=(PLANS[x.date]||[]).filter((p)=>p.lat==null&&!p.done).length;
  if(!g.length) return `<div class="mapwrap"><p class="empty">No plans with a location yet.</p></div>`;
  const pts=g.map((p)=>({x:p.lng*Math.cos(p.lat*Math.PI/180),y:-p.lat,p}));
  if(ME) pts.push({x:ME.lng*Math.cos(ME.lat*Math.PI/180),y:-ME.lat,me:1});
  const xs=pts.map((q)=>q.x),ys=pts.map((q)=>q.y);
  const W=320,H=170,PAD=26;
  let x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  let dx=x1-x0,dy=y1-y0;
  const span=Math.max(dx,dy,0.0008);
  const cx=(x0+x1)/2, cy=(y0+y1)/2;
  x0=cx-span/2; x1=cx+span/2; y0=cy-span/2; y1=cy+span/2;
  const sx=(v)=>PAD+((v-x0)/(x1-x0))*(W-2*PAD);
  const sy=(v)=>PAD+((v-y0)/(y1-y0))*(H-2*PAD);
  const path=g.map((p,i)=>{const q=pts[i];return `${i?"L":"M"}${sx(q.x).toFixed(1)} ${sy(q.y).toFixed(1)}`;}).join(" ");
  const kmPerDeg=111.32*Math.cos((-cy)*Math.PI/180);
  const barKm=(()=>{const total=span*kmPerDeg;const nice=[0.2,0.5,1,2,5,10,20,50,100];return nice.find((n)=>n>=total/3)||100;})();
  const barPx=(barKm/(span*kmPerDeg))*(W-2*PAD);
  return `<div class="mapwrap">
    <svg viewBox="0 0 ${W} ${H}" class="mmap" aria-hidden="true">
      ${g.length>1?`<path d="${path}" fill="none" stroke="var(--mute)" stroke-width="1.4" stroke-dasharray="4 3"/>`:""}
      ${ME?`<circle cx="${sx(pts[pts.length-1].x).toFixed(1)}" cy="${sy(pts[pts.length-1].y).toFixed(1)}" r="5" fill="none" stroke="var(--p2)" stroke-width="1.6"/>`:""}
      ${g.map((p,i)=>{const q=pts[i];return `<g><circle cx="${sx(q.x).toFixed(1)}" cy="${sy(q.y).toFixed(1)}" r="9" fill="var(--fg)"/><text x="${sx(q.x).toFixed(1)}" y="${(sy(q.y)+3.6).toFixed(1)}" text-anchor="middle" font-size="10" font-family="monospace" fill="var(--bg)">${i+1}</text></g>`;}).join("")}
      <line x1="${PAD}" y1="${H-10}" x2="${PAD+barPx.toFixed(1)}" y2="${H-10}" stroke="var(--mute)" stroke-width="1.4"/>
      <text x="${PAD+barPx/2}" y="${H-15}" text-anchor="middle" font-size="9" font-family="monospace" fill="var(--mute)">${barKm<1?barKm*1000+" m":barKm+" km"}</text>
    </svg>
    <p class="mapkey">${g.map((p,i)=>`${i+1} ${esc(p.what||p.where||"")}`).join("  &middot;  ")}${noLoc?` &middot; ${noLoc} without a location`:""}</p>
  </div>`;
}

function plansBlock(x){
  const list=PLANS[x.date]||[];
  let rows=list.map((p,i)=>({p,i}));
  if(sortMode==="123"){
    const timed=rows.filter(({p})=>p.time).sort((a,b)=>a.p.time.localeCompare(b.p.time));
    rows=timed.concat(rows.filter(({p})=>!p.time));
  }else{
    rows=sortList(rows,(o)=>o.p);
  }
  rows=rows.filter(({p})=>!p.done).concat(rows.filter(({p})=>p.done));
  let body="";
  if(list.length) body=rows.map(({p,i})=>planRow(p,i,x.date)).join("");
  const lead="";
  const gp=geoPlans(x), ru=routeUrl(x);
  const tail=`<button class="hbtn${mapOpen?" on":""}${gp.length?"":" off"}" id="mapbtn" aria-label="Map">${MAPICON}</button>`
    +(ru?`<a class="hbtn" href="${esc(ru)}" target="_blank" rel="noopener" aria-label="Route">${ROUTE}</a>`
        :`<span class="hbtn off" aria-hidden="true">${ROUTE}</span>`);
  const ctrl=sortCtrl(true);
  if(pick) return panel("plans","Add a plan","",picker(x));
  if(editing===null) body+=`<button class="bigadd" id="p-add">+ New plan</button>`;
  return panel("plans","Plans",list.length||"",(mapOpen?miniMap(x):"")+(list.length>1?ctrl:"")+body,{tail});
}

function wirePlans(x){
  const add=$("#p-add");
  if(add) add.addEventListener("click",()=>{pick={q:"",sec:null,cat:null};editing=null;drawDay()});

  $("#screen").querySelectorAll("[data-trav]").forEach((b)=>b.addEventListener("click",(e)=>{
    e.stopPropagation();
    travOpen=travOpen===+b.dataset.trav?null:+b.dataset.trav; drawDay();
  }));
  if($("#mapbtn")) $("#mapbtn").addEventListener("click",(e)=>{e.stopPropagation();mapOpen=!mapOpen;drawDay();});
  wireSwipe(x);
  $("#screen").querySelectorAll("[data-editplan]").forEach((b)=>b.addEventListener("click",()=>{
    editing=+b.dataset.editplan; pick=null; drawDay();
  }));

  if(pick){
    const q=$("#pk-q");
    const sync=()=>{ pick.q=q.value; };
    q.addEventListener("input",()=>{
      const caret=q.selectionStart, wasLink=!!parseSpot(pick.q).url;
      pick.q=q.value;
      if(wasLink!==!!parseSpot(pick.q).url) pick.sec=null;
      drawDay();
      const n=$("#pk-q"); if(n){ n.focus(); try{n.setSelectionRange(caret,caret)}catch{} }
    });
    q.addEventListener("paste",()=>setTimeout(()=>{pick.q=q.value;pick.sec=null;drawDay();$("#pk-q").focus();},0));
    $("#pk-cancel").addEventListener("click",()=>{pick=null;drawDay()});
    $("#screen").querySelectorAll("[data-travspot]").forEach((b)=>b.addEventListener("click",(e)=>{
      e.stopPropagation();
      const k="s"+b.dataset.travspot;
      travOpen=travOpen===k?null:k; drawDay();
    }));
    $("#screen").querySelectorAll("[data-cat]").forEach((b)=>b.addEventListener("click",()=>{
      pick.cat=b.dataset.cat;
      if(b.dataset.cat==="__near"&&!ME){ askLoc(); return; }
      drawDay();
    }));
    if($("#pk-back")) $("#pk-back").addEventListener("click",()=>{pick.cat=null;drawDay()});
    $("#screen").querySelectorAll("[data-psec]").forEach((b)=>b.addEventListener("click",()=>{sync();pick.sec=b.dataset.psec;drawDay()}));

    $("#screen").querySelectorAll("[data-pickspot]").forEach((b)=>b.addEventListener("click",()=>{
      sync();
      const sp=(SPOTS[x.city]||[])[+b.dataset.pickspot];
      addPlan(x,{where:sp.name,type:sp.type||"",price:sp.price||"",meals:sp.meals||"",url:sp.url,lat:sp.lat,lng:sp.lng,phone:sp.phone||"",hours:sp.hours||null});
    }));

    const nw=$("#pk-new");
    if(nw) nw.addEventListener("click",()=>{
      sync();
      const p=parseSpot(pick.q);
      const title=p.url?(p.name||"New place"):pick.q.trim();
      if(!title) return;
      if(p.url){
        const sec=pick.sec||p.sec;
        (SPOTS[x.city]=SPOTS[x.city]||[]).push({name:title,url:p.url,sec,lat:p.lat,lng:p.lng});
        saveSpots(); push("spots:"+x.city);
      }
      addPlan(x,{where:title,url:p.url||"",lat:p.lat,lng:p.lng});
    });
  }

  if(typeof editing==="number"){
    $("#e-cancel").addEventListener("click",()=>{editing=null;drawDay()});
    $("#e-kill").addEventListener("click",()=>{
      PLANS[x.date].splice(editing,1);
      if(!PLANS[x.date].length)delete PLANS[x.date];
      savePlans(); editing=null; drawDay(); push(x.date); toast("Deleted");
    });
    $("#e-save").addEventListener("click",()=>{
      const p=PLANS[x.date][editing];
      p.what=$("#e-what").value.trim();
      p.where=$("#e-where").value.trim()||p.where;
      p.time=$("#e-time").value; p.end=$("#e-end").value; p.note=$("#e-note").value.trim();
      savePlans(); editing=null; drawDay(); push(x.date); toast("Saved");
    });
  }
}

function wireSwipe(x){
  $("#screen").querySelectorAll(".swipe").forEach((el)=>{
    const body=el.querySelector(".swipe-body");
    const W=el.querySelector(".swipe-actions").children.length*56;
    let x0=null,y0=null,dx=0,lock=null,open=el.classList.contains("open");
    const set=(v)=>{body.style.transform=`translateX(${v}px)`;};
    el.addEventListener("touchstart",(e)=>{const t=e.touches[0];x0=t.clientX;y0=t.clientY;lock=null;dx=open?-W:0;body.style.transition="";},{passive:true});
    el.addEventListener("touchmove",(e)=>{
      if(x0==null)return; const t=e.touches[0];
      const ax=t.clientX-x0, ay=t.clientY-y0;
      if(lock===null) lock=Math.abs(ax)>Math.abs(ay)+6?"x":"y";
      if(lock!=="x")return;
      dx=Math.max(-W,Math.min(0,(open?-W:0)+ax));
      set(dx);
    },{passive:true});
    el.addEventListener("touchend",()=>{
      if(lock!=="x"){x0=null;return;}
      body.style.transition="transform .2s ease";
      open=dx<-W/2;
      set(open?-W:0);
      el.classList.toggle("open",open);
      x0=null;
    });
  });

  $("#screen").querySelectorAll("[data-sw-edit]").forEach((b)=>b.addEventListener("click",()=>{
    editing=+b.dataset.swEdit; pick=null; drawDay();
  }));
  $("#screen").querySelectorAll("[data-sw-arch]").forEach((b)=>b.addEventListener("click",()=>{
    const p=PLANS[x.date][+b.dataset.swArch]; p.done=!p.done;
    savePlans(); drawDay(); push(x.date);
  }));
  $("#screen").querySelectorAll("[data-sw-del]").forEach((b)=>b.addEventListener("click",()=>{
    PLANS[x.date].splice(+b.dataset.swDel,1);
    if(!PLANS[x.date].length)delete PLANS[x.date];
    savePlans(); editing=null; drawDay(); push(x.date); toast("Deleted");
  }));
  $("#screen").querySelectorAll("[data-sw-sarch]").forEach((b)=>b.addEventListener("click",()=>{
    const [c,i]=b.dataset.swSarch.split("|");
    SPOTS[c][+i].done=!SPOTS[c][+i].done; saveSpots(); draw(); push("spots:"+c);
  }));
  $("#screen").querySelectorAll("[data-sw-sdel]").forEach((b)=>b.addEventListener("click",()=>{
    const [c,i]=b.dataset.swSdel.split("|");
    SPOTS[c].splice(+i,1); if(!SPOTS[c].length)delete SPOTS[c];
    saveSpots(); draw(); push("spots:"+c); toast("Removed");
  }));
}

function addPlan(x,p){
  const list=PLANS[x.date]=PLANS[x.date]||[];
  list.push({what:"",...p,time:"",end:""});
  savePlans(); pick=null; editing=list.length-1; drawDay(); push(x.date);
}


const codes=(l)=>!l?"":`<div class="codes">${l.map((c)=>
  `<button class="code" data-copy="${esc(c.value)}"><span class="l">${esc(c.label)}</span><span class="v">${esc(c.value)}</span></button>`).join("")}</div>`;
const notes=(l)=>!l||!l.length?"":`<div class="notes">${l.map((n)=>`<p>${esc(n)}</p>`).join("")}</div>`;

let tt;
function toast(m){const e=$("#toast");e.textContent=m;e.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>e.classList.remove("on"),1400)}

try{if(localStorage.getItem("eu26.light")==="1")document.body.classList.add("light")}catch{}
boot();
</script>
