<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Europe 2026</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#12150F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Cormorant+Garamond:ital,wght@1,300;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#12150F;--fg:#F0E9D8;--mute:#8A8878;--wash:#1C201A;--edge:#F0E9D8;
  --p1:#F0E9D8;--p2:#F0E9D8;
  --pad:16px;--lead:32px;--gap:12px;
  --dp:"Archivo",system-ui,sans-serif;
  --sr:"Cormorant Garamond",Georgia,serif;
  --mn:"Space Mono",ui-monospace,monospace;
}
body.light{--bg:#F0E9D8;--fg:#16190F;--mute:#7C7A6A;--wash:#E4DBC6;--edge:#16190F}
body.light .pnl>.ph .lbl,
body.light .pnl>.ph .lbl.city,
body.light .hd .lbl,
body.light .plan .when,
body.light .fld .k,
body.light .addrow,
body.light .locbar.on,
body.light #datebtn u,
body.light .wxline.tap,
body.light .wxin .temp em{color:var(--fg)}
body.light .wxin .temp em,
body.light .plans .add,
body.light .pnl>.ph .tw{border-color:var(--fg);color:var(--fg)}
body.light .pnl.open>.ph .tw{background:var(--fg);color:var(--bg)}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--fg);font-family:var(--dp);font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
}
a{color:inherit}
button,a,input,select{touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left;-webkit-user-select:none;user-select:none}
:focus-visible{outline:2px solid var(--p2);outline-offset:2px}
input,select{font:inherit;color:inherit;background:var(--wash);border:1.5px solid var(--edge);padding:13px;width:100%;font-family:var(--mn);font-size:16px;border-radius:0}
select{appearance:none}
input[type=time]{min-height:42px}
.phone{max-width:520px;margin:0 auto;padding:0 var(--pad) calc(34px + env(safe-area-inset-bottom))}
.lbl{font-family:var(--mn);font-size:12.5px;font-weight:700;letter-spacing:.15em;text-transform:uppercase}

.flag{display:block;background:var(--fg);box-shadow:0 0 0 1px var(--mute)}
.flag.es{background:linear-gradient(#C60B1E 0 25%,#FFC400 25% 75%,#C60B1E 75%)}
.flag.de{background:linear-gradient(#0F0F0F 0 33.4%,#DD0000 33.4% 66.7%,#FFCE00 66.7%)}
.flag.ie{background:linear-gradient(90deg,#169B62 0 33.4%,#FFF 33.4% 66.7%,#FF883E 66.7%)}
.flag.se{background-color:#006AA7;background-image:linear-gradient(90deg,transparent 0 30%,#FECC00 30% 46%,transparent 46%),linear-gradient(0deg,transparent 0 38%,#FECC00 38% 62%,transparent 62%)}
.flag.us{background:linear-gradient(#3C3B6E,#3C3B6E) 0 0/40% 54% no-repeat,repeating-linear-gradient(#B22234 0 7.7%,#FFF 7.7% 15.4%)}
.flag.xx{background:repeating-linear-gradient(45deg,var(--fg) 0 4px,var(--bg) 4px 8px)}

#lock{min-height:100dvh;display:flex;flex-direction:column;justify-content:center}
.lock-mark{font-family:var(--sr);font-style:italic;font-weight:300;font-size:clamp(52px,17vw,74px);line-height:.92;letter-spacing:-.01em}
.lock-sub{color:var(--mute);font-size:14.5px;margin-top:14px;max-width:30ch;border-top:1.5px solid var(--edge);padding-top:13px}
.lock-form{margin-top:24px;display:flex;flex-direction:column;gap:8px}
#pass{text-align:center;font-size:17px}
#unlock{padding:15px;background:var(--fg);color:var(--bg);font-weight:800;font-stretch:118%;font-size:15px;text-transform:uppercase;text-align:center;letter-spacing:.04em}
#unlock:disabled{opacity:.45}
.lock-msg{min-height:18px;font-family:var(--mn);font-size:13px;color:#FF6B60}

#app{display:none}
#app.on{display:block}

.mast{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:24px 0 14px;border-bottom:1.5px solid var(--edge)}
.mast b{font-family:var(--sr);font-style:italic;font-weight:400;font-size:31px;line-height:1;display:block;letter-spacing:-.01em}
.mast .grp{display:flex;align-items:center;gap:9px;line-height:1;font-family:var(--mn);font-size:12.5px;color:var(--mute);letter-spacing:.04em}
#clk{width:34px;height:34px;flex:0 0 auto;border:1.5px solid var(--edge);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--fg);padding:0}
#clk.on{background:var(--fg);color:var(--bg)}
#fx{width:34px;height:34px;flex:0 0 auto;border:1.5px solid var(--edge);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--fg);padding:0}
#fx.on{background:var(--fg);color:var(--bg)}
.fxpanel{border:1.5px solid var(--edge);border-top:0;padding:14px var(--pad)}
.fxrow{display:flex;align-items:center;gap:7px}
.fxrow input{flex:1 1 0;text-align:right;font-size:17px;padding:9px}
.fxrow span{font-family:var(--mn);font-size:13px;color:var(--mute);width:34px}
.fxrate{font-family:var(--mn);font-size:12.5px;color:var(--mute);margin-top:8px;letter-spacing:.06em}
#invert{width:34px;height:34px;flex:0 0 auto;border:1.5px solid var(--edge);border-radius:50%;background:linear-gradient(90deg,var(--fg) 0 50%,var(--bg) 50%)}

.cal{border:1.5px solid var(--edge);border-top:0}
.cal-head{display:flex;align-items:baseline;justify-content:space-between;padding:15px var(--pad)}
.cal-head b{font-size:17px;font-weight:800;font-stretch:112%;text-transform:uppercase;letter-spacing:-.02em}
.cal-head span{font-family:var(--mn);font-size:12.5px;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--edge)}
.dow{font-family:var(--mn);font-size:13px;color:var(--mute);text-align:center;padding:9px 0;border-right:1px solid var(--edge);border-bottom:1px solid var(--edge)}
.dow:nth-child(7n){border-right:0}
.cell{aspect-ratio:1/1.02;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-family:var(--mn);font-size:13.5px;color:var(--mute);border-right:1px solid var(--edge);border-bottom:1px solid var(--edge);background:var(--bg);position:relative}
.cell:nth-child(7n){border-right:0}
.cell.trip{color:var(--fg)}
.cell.out{color:color-mix(in srgb,var(--mute) 42%,var(--bg))}
.cell.past{color:color-mix(in srgb,var(--mute) 78%,var(--bg))}
.cell.past .flag{opacity:.3}
.cell .flag{width:13px;height:8px}
.cell.out .flag{visibility:hidden}
.cell.sel{background:var(--fg);color:var(--bg);font-weight:700}
.cell.past.sel{background:var(--mute);color:var(--bg)}
.cell.past.sel .flag{opacity:1}
.cell.dot::after{content:"";position:absolute;width:4px;height:4px;background:currentColor;border-radius:50%;top:4px;right:5px}
.cell.now{box-shadow:inset 0 0 0 2px var(--fg)}
.tabs{display:flex;border:1.5px solid var(--edge);border-top:0}
.tabs button{flex:1 1 0;padding:15px;text-align:center;font-family:var(--mn);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);border-right:1.5px solid var(--edge)}
.tabs button:last-child{border-right:0}
.tabs button.on{background:var(--fg);color:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:13px var(--pad);border:1.5px solid var(--edge);border-top:0}
.chips button{display:flex;align-items:center;gap:6px;font-family:var(--mn);font-size:13px;text-transform:uppercase;letter-spacing:.06em;border:1.5px solid var(--edge);padding:6px 8px;color:var(--mute)}
.chips button.on{background:var(--fg);color:var(--bg)}
.chips .flag{width:15px;height:9px}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;padding:13px var(--pad);border-top:1px solid var(--edge)}
.legend span{display:flex;align-items:center;gap:5px;font-family:var(--mn);font-size:12.5px;color:var(--mute)}
.legend i{width:13px;height:8px;display:block}

.nav{border:1.5px solid var(--edge);border-top:0}
.navrow{display:flex;align-items:center;gap:var(--gap);padding:12px var(--pad)}
.wxrow{padding:0 var(--pad) 16px}
.nav .arw{width:44px;height:44px;flex:0 0 44px;font-size:15px;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--edge);border-radius:50%}
.nav .arw:disabled{opacity:.28}
#datebtn{flex:1 1 auto;min-width:0;text-align:center;padding:2px 0}
#datebtn b{display:block;font-size:19px;font-weight:800;font-stretch:112%;text-transform:uppercase;letter-spacing:-.025em;line-height:1.1}
#datebtn span{display:block;font-family:var(--mn);font-size:13px;color:var(--mute);letter-spacing:.1em;margin-top:2px}
#datebtn u{text-decoration:none;color:var(--p2)}
.past-day{opacity:.52}




.place .top{display:flex;align-items:center;gap:9px}
.place .flag{width:26px;height:17px;flex:0 0 auto}
.place h2{flex:1 1 auto;min-width:0;line-height:1;color:var(--p1)}
.place .n{font-family:var(--mn);font-size:12.5px;color:var(--mute);white-space:nowrap;text-transform:uppercase}
.hotel{font-size:25px;font-weight:800;font-stretch:122%;text-transform:uppercase;letter-spacing:-.035em;line-height:1;color:var(--fg);margin-top:9px}
.place h2{font-size:22px;font-weight:800;font-stretch:122%;text-transform:uppercase;letter-spacing:-.03em}
.place .top .flags{display:flex;align-items:center;gap:5px;flex:0 0 auto}
.place .top .flags em{font-style:normal;font-family:var(--mn);font-size:13px;color:var(--mute)}


.card{border:1.5px solid var(--edge);border-top:0;padding:15px var(--pad)}
#screen>div>div:first-child{border-top:1.5px solid var(--edge)}
.hd{display:flex;align-items:center;gap:9px}
.hd .lbl{color:var(--p2);white-space:nowrap}
.hd .rule{flex:1 1 auto;height:1.5px;background:var(--edge)}
.hd .n{font-family:var(--mn);font-size:12.5px;color:var(--mute);white-space:nowrap}

.leg{display:flex;align-items:flex-end;gap:8px;margin-top:11px}
.leg b{display:block;font-size:31px;font-weight:800;font-stretch:122%;line-height:.85;letter-spacing:-.04em}
.leg a{text-decoration:none;display:block}
.leg a b{color:var(--ac)}
.leg .t{display:block;font-family:var(--mn);font-size:14px;font-weight:700;margin-top:5px}
.leg em{display:block;font-style:normal;font-family:var(--mn);font-size:12.5px;color:var(--mute);margin-top:2px;text-transform:uppercase}
.leg .to{text-align:right;margin-left:auto}
.leg .mid{flex:1 1 auto;padding-bottom:6px;text-align:center;min-width:60px}
.leg .mid .air{display:block;font-family:var(--mn);font-size:12.5px;color:var(--fg);margin-bottom:5px;line-height:1.3}
.leg .mid i{display:block;height:1.5px;background:var(--edge)}
.leg .mid .dur{display:block;font-family:var(--mn);font-size:13px;color:var(--mute);margin-top:5px;line-height:1.3}
.plus{display:inline!important;margin:0!important;font-size:13px!important;background:var(--p2);color:#12150F!important;padding:0 3px}

.title{font-size:22px;font-weight:800;font-stretch:118%;text-transform:uppercase;letter-spacing:-.03em;line-height:1;margin-top:9px}
.sub{font-family:var(--mn);font-size:13px;color:var(--mute);margin-top:5px;text-transform:uppercase}

.codes{display:flex;flex-wrap:wrap;gap:7px;margin-top:13px}
.code{border:1.5px solid var(--edge);padding:9px 11px;background:transparent}
.code .l{display:block;font-family:var(--mn);font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.code .v{display:block;font-family:var(--mn);font-size:15px;font-weight:700;margin-top:1px}
.code.info{border-color:var(--mute)}
.code.info .v{font-size:13.5px;font-weight:400}
.code.done{background:var(--p1);border-color:var(--p1);color:#12150F}
.code.done .l{color:rgba(0,0,0,.55)}




.low{display:flex;align-items:center;gap:7px;margin-top:10px;padding-top:10px;border-top:1px solid var(--edge)}
.low .who{flex:1 1 auto;min-width:0;font-family:var(--mn);font-size:13px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ico{width:44px;height:44px;flex:0 0 auto;border:1.5px solid var(--edge);border-radius:50%;display:flex;align-items:center;justify-content:center}
.ico svg{width:19px;height:19px;stroke:var(--fg);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg.mini{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-2px;margin-right:4px}
.leave{font-family:var(--mn);font-size:13px;color:var(--mute);text-transform:uppercase;letter-spacing:.08em;padding-bottom:9px;margin-bottom:10px;border-bottom:1px solid var(--edge)}
.leave b{color:var(--fg);font-weight:700}
.checkin{font-family:var(--mn);font-size:13px;color:var(--fg);margin-top:8px;letter-spacing:.06em}
.xfer{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.xfer span{font-family:var(--mn);font-size:13px;color:var(--fg);border:1.5px solid var(--mute);padding:5px 8px;display:inline-flex;align-items:center}
.xfer .src{border:0;color:var(--mute);padding-left:0}
.place h2 i{font-style:normal;color:var(--mute);font-weight:400;font-family:var(--mn);font-size:13px;text-transform:none;letter-spacing:.06em}
.notes{margin-top:11px;padding-top:10px;border-top:1px solid var(--edge);font-family:var(--mn);font-size:13px;color:var(--mute);line-height:1.6}
.notes p+p{margin-top:2px}

.place h2 button{font:inherit;color:inherit;background:none;border:0;padding:0;text-align:left;width:100%}
.place h2 .chev{font-family:var(--mn);font-size:13px;color:var(--mute);margin-left:6px;letter-spacing:0}
.pnl{border:1.5px solid var(--edge);border-top:0}
.pnl>.ph{display:flex;align-items:center;gap:var(--gap);padding:15px var(--pad);width:100%;min-height:62px}
.pnl>.ph .phmain{flex:1 1 auto;display:flex;align-items:center;gap:var(--gap);min-width:0;padding:0}
.pnl>.ph .locbtn{flex:0 0 var(--lead);width:var(--lead);height:var(--lead);border:1.5px solid var(--mute);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--mute);padding:0}
.pnl>.ph .locbtn.on{border-color:var(--p2);color:var(--p2)}
.pnl>.ph .locbtn svg{margin:0;width:16px;height:16px}
.pnl>.ph .flag{width:var(--lead);height:21px;flex:0 0 var(--lead)}
.pnl>.ph .lbl{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--dp);font-size:19px;font-weight:800;font-stretch:122%;letter-spacing:-.03em;text-transform:uppercase;color:var(--p1);line-height:1}

.pnl>.ph .meta{display:flex;align-items:center;font-family:var(--mn);font-size:13px;color:var(--mute);white-space:nowrap}
.pnl>.ph .meta svg{stroke:currentColor;fill:none;stroke-width:1.8;width:14px;height:14px}
.pnl>.ph .tw{flex:0 0 var(--lead);width:var(--lead);height:var(--lead);border:1.5px solid var(--p2);color:var(--p2);display:flex;align-items:center;justify-content:center;font-family:var(--mn);font-size:16px;line-height:1;padding-bottom:2px}
.pnl.open>.ph .tw{background:var(--p2);color:var(--bg)}
.pnl>.pb{padding:0 var(--pad) 18px}
.spot{display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--edge)}
.spot:last-of-type{border-bottom:0}
.spot a{flex:1 1 auto;min-width:0;text-decoration:none}
.spot b{display:block;font-size:16px;font-weight:800;font-stretch:112%;text-transform:uppercase;letter-spacing:-.02em;line-height:1.15}
.spot span{display:block;font-family:var(--mn);font-size:13px;color:var(--mute);margin-top:2px}

.wxload{font-family:var(--mn);font-size:13px;color:var(--mute);letter-spacing:.08em;text-transform:uppercase}
.wxtop{display:flex;align-items:flex-start;gap:10px}
.wxin .temp{display:flex;align-items:baseline;gap:6px;padding:0}
.wxin .temp b{font-size:31px;font-weight:800;font-stretch:122%;letter-spacing:-.04em;line-height:.9}
.wxin .temp span{font-size:19px;font-weight:800;font-stretch:122%;color:var(--mute);line-height:.9}
.wxin .temp em{font-style:normal;font-family:var(--mn);font-size:13px;color:var(--p2);border:1.5px solid var(--p2);padding:1px 3px;margin-left:2px}
.wxin .at{font-family:var(--mn);font-size:13px;color:var(--mute);line-height:1.5}
.wxin .pill{margin-left:auto;font-family:var(--mn);font-size:13px;border:1.5px solid var(--mute);padding:5px 7px;white-space:nowrap}
.wxline{display:block;width:100%;font-family:var(--mn);font-size:13px;color:var(--mute);margin-top:10px;padding-top:9px;border-top:1px solid var(--edge);line-height:1.5;text-align:left}
.wxline b{color:var(--fg);font-weight:700}
.wxline.tap{color:var(--p2)}
.wxbar{display:flex;align-items:center;justify-content:space-between;width:100%;padding-bottom:4px}
.wxbar .x{font-family:var(--mn);font-size:13px;color:var(--mute);letter-spacing:.08em;text-transform:uppercase}
.wxin .strip{display:flex;align-items:flex-end;gap:2px;height:38px;margin-top:8px}
.wxin .strip i{flex:1 1 0;background:var(--mute);opacity:.32;display:block}
.wxin .strip i.hi{opacity:1;background:var(--p2)}
.wxin .hrs{display:flex;justify-content:space-between;font-family:var(--mn);font-size:12.5px;color:var(--mute);margin-top:4px}
.picker .locbar{border:1.5px solid var(--mute);border-top:1.5px solid var(--mute);margin:0}
.locbar{display:flex;align-items:center;justify-content:center;width:100%;border:1.5px solid var(--edge);border-top:0;padding:14px var(--pad);font-family:var(--mn);font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.locbar.on{color:var(--p2);border-color:var(--p2)}
.far{flex:0 0 auto;text-align:right;text-decoration:none;font-family:var(--mn);font-size:13px;color:var(--fg);border:1.5px solid var(--mute);padding:5px 7px;line-height:1.35}
.far span{display:block;white-space:nowrap}
.far span:last-child{color:var(--mute)}
.sinfo{flex:1 1 auto;min-width:0}
.sinfo b{display:block;font-size:18px;font-weight:800;font-stretch:112%;text-transform:uppercase;letter-spacing:-.02em;line-height:1.15}
.sinfo span{display:block;font-family:var(--mn);font-size:13px;color:var(--mute);margin-top:4px;line-height:1.5}
.sacts{flex:0 0 auto;display:flex;align-items:center;gap:7px}
.eye{width:42px;height:38px;border:1.5px solid var(--edge);display:flex;align-items:center;justify-content:center;color:var(--mute);padding:0}
.eye svg{margin:0}
.spot .acts{flex:0 0 auto;display:flex;flex-direction:column;gap:3px}
.spot .acts button{font-family:var(--mn);color:var(--mute);border:1.5px solid var(--edge);width:42px;height:38px;display:flex;align-items:center;justify-content:center;padding:0}
.spot.gone{opacity:.45}
.spot.gone b{text-decoration:line-through}
.spot .note{display:block;font-family:var(--mn);font-size:13px;color:var(--mute);margin-top:3px;line-height:1.45;text-decoration:none}
.seenbar{width:100%;font-family:var(--mn);font-size:13px;color:var(--mute);letter-spacing:.1em;text-transform:uppercase;padding:14px 0 4px;border-top:1px solid var(--edge);margin-top:4px}
.paste{margin-top:10px;padding-top:11px;border-top:1.5px solid var(--edge);display:flex;flex-direction:column;gap:9px}
.bigadd{width:100%;background:var(--fg);color:var(--bg);padding:17px;text-align:center;font-weight:800;font-stretch:118%;font-size:15px;text-transform:uppercase;letter-spacing:.04em;margin-top:14px}
.addrow{font-family:var(--mn);font-size:13px;color:var(--p2);letter-spacing:.1em;text-transform:uppercase;padding:9px 0 0;border-top:1px solid var(--edge);margin-top:2px;width:100%}
.paste textarea{padding:13px;font-family:var(--mn);font-size:15px;background:var(--wash);color:var(--fg);border:1.5px solid var(--edge);padding:10px;width:100%;min-height:74px;resize:vertical;border-radius:0}
.paste .hint{font-family:var(--mn);font-size:13px;color:var(--mute);line-height:1.5}

<body>

<div id="lock" class="phone">
  <p class="lock-mark">Europe<br>2026</p>
  <p class="lock-sub">Locked. Everything here is encrypted until you type the passphrase.</p>
  <div class="lock-form">
    <input id="pass" type="password" placeholder="PASSPHRASE" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false">
    <button id="unlock">Unlock</button>
    <p class="lock-msg" id="lockmsg"></p>
  </div>
</div>

<div id="app" class="phone"></div>
<div id="toast"></div>

<script>
const KEY="eu26.pass",PKEY="eu26.plans",SKEY="eu26.spots",$=(s)=>document.querySelector(s);
const MONTH=["January","February","March","April","May","June","July","August","September","October","November","December"];
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const KINDS=["Breakfast","Lunch","Dinner","Coffee","Drinks","Dancing","Tour","Beach","Show","Museum","Shopping","Other"];
const SECTIONS=["Bars and Clubs","Food and Drink","History and Art","Nature and Beauty","Shopping"];
const SECMAP={"Food":"Food and Drink","Art & History":"History and Art","Nature & Beauty":"Nature and Beauty","Misc":"Shopping"};
function migratePlans(){
  let hit=false;
  Object.keys(PLANS).forEach((d)=>PLANS[d].forEach((p)=>{
    if(p.title!==undefined){ p.where=p.where||p.title; delete p.title; hit=true; }
    if(p.kind!==undefined){ p.where=p.where||p.kind; delete p.kind; hit=true; }
    if(p.who!==undefined){ if(p.who) p.note=(p.note?p.note+" ":"")+"with "+p.who; delete p.who; hit=true; }
    if(p.what===undefined){ p.what=""; hit=true; }
  }));
  if(hit) savePlans();
}

const nkey=(sp)=>(sp.name||"").toLowerCase().replace(/[^a-z0-9]/g,"");
function seedSpots(trip){
  let hit=false;
  Object.keys(SPOTS).forEach((city)=>{
    const seen={},out=[];
    SPOTS[city].forEach((sp)=>{
      const k=nkey(sp);
      if(seen[k]!==undefined){
        const prev=out[seen[k]];
        if((sp.lat!=null&&prev.lat==null)||(sp.hours&&!prev.hours)) out[seen[k]]={...prev,...sp,done:prev.done||sp.done};
        hit=true;
      } else { seen[k]=out.length; out.push(sp); }
    });
    SPOTS[city]=out;
  });
  if(trip.spots) Object.keys(trip.spots).forEach((city)=>{
    const have=SPOTS[city]=SPOTS[city]||[];
    trip.spots[city].forEach((sp)=>{
      const i=have.findIndex((y)=>nkey(y)===nkey(sp));
      if(i<0){ have.push({...sp,seed:true}); hit=true; }
      else if(!have[i].seed){ have[i]={...sp,...{done:have[i].done},seed:true}; hit=true; }
    });
    if(!have.length) delete SPOTS[city];
  });
  if(hit) saveSpots();
}

function migrate(){
  let hit=false;
  Object.keys(SPOTS).forEach((c)=>SPOTS[c].forEach((sp)=>{
    if(SECMAP[sp.sec]){ sp.sec=SECMAP[sp.sec]; hit=true; }
    else if(!SECTIONS.includes(sp.sec)){ sp.sec=SECTIONS[1]; hit=true; }
  }));
  if(hit) saveSpots();
}

const d=(s)=>{const[y,m,x]=s.split("-").map(Number);return new Date(y,m-1,x)};
const iso=(t)=>`${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}-${String(t.getDate()).padStart(2,"0")}`;
const esc=(s)=>String(s).replace(/[&<>"]/g,(c)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nights=(a,b)=>Math.round((d(b)-d(a))/864e5);

const MOON=`<svg class="mini" viewBox="0 0 24 24" style="margin-right:5px"><path d="M20.5 14.8A8.6 8.6 0 0 1 9.2 3.5a8.6 8.6 0 1 0 11.3 11.3Z"/></svg>`;
const CLOCK=`<svg viewBox="0 0 24 24" style="width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>`;
const SWAP=`<svg viewBox="0 0 24 24" style="width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M4 8h15l-3.5-3.5M20 16H5l3.5 3.5"/></svg>`;
const EYE=`<svg class="mini" viewBox="0 0 24 24" style="margin:0"><path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6-10-6-10-6Z"/><circle cx="12" cy="12" r="2.6"/></svg>`;
const EYEOFF=`<svg class="mini" viewBox="0 0 24 24" style="margin:0"><path d="M4 4l16 16"/><path d="M9.5 9.6A2.6 2.6 0 0 0 12 14.6"/><path d="M6.6 6.8C3.9 8.4 2 12 2 12s3.6 6 10 6c1.7 0 3.2-.4 4.5-1"/><path d="M19.5 15.2C21.2 13.8 22 12 22 12s-3.6-6-10-6c-.9 0-1.7.1-2.5.3"/></svg>`;
const WALK=`<svg class="mini" viewBox="0 0 24 24"><circle cx="13" cy="4" r="1.6"/><path d="M11 21l2-6-3-3 1-5 3 3 3 1"/><path d="M10 12l-2 4"/><path d="M13 15l3 2 1 4"/></svg>`;
const LOC=`<svg class="mini" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>`;
const PIN=`<svg viewBox="0 0 24 24"><path d="M12 21s7-5.5 7-11a7 7 0 1 0-14 0c0 5.5 7 11 7 11Z"/><circle cx="12" cy="10" r="2.5"/></svg>`;
const TEL=`<svg viewBox="0 0 24 24"><path d="M5 3h4l2 5-2.5 1.5a12 12 0 0 0 6 6L16 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 5a2 2 0 0 1 2-2Z"/></svg>`;
const SEAT=`<svg class="mini" viewBox="0 0 24 24"><path d="M7 4v9a3 3 0 0 0 3 3h7"/><path d="M17 16v4"/><path d="M4 20h13"/><path d="M7 8h4"/></svg>`;
const CAR=`<svg class="mini" viewBox="0 0 24 24"><path d="M4 15v-3l2-5h12l2 5v3"/><path d="M3 15h18v3H3z"/><circle cx="7.5" cy="18.5" r="1.5"/><circle cx="16.5" cy="18.5" r="1.5"/></svg>`;
const RAIL=`<svg class="mini" viewBox="0 0 24 24"><rect x="6" y="3" width="12" height="13" rx="2"/><path d="M6 10h12"/><path d="M9 20l-2 2M15 20l2 2"/><circle cx="9.5" cy="13" r=".8"/><circle cx="14.5" cy="13" r=".8"/></svg>`;

const b64=(s)=>Uint8Array.from(atob(s),(c)=>c.charCodeAt(0));
const tob64=(b)=>btoa(String.fromCharCode(...new Uint8Array(b)));
let CKEY=null;
async function decrypt(blob,pass){
  const bk=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]);
  const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(blob.salt),iterations:blob.iterations||250000,hash:"SHA-256"},bk,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
  const out=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(blob.iv)},k,b64(blob.data))));
  CKEY=k; return out;
}
async function seal(obj){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  return tob64(iv)+"."+tob64(await crypto.subtle.encrypt({name:"AES-GCM",iv},CKEY,new TextEncoder().encode(JSON.stringify(obj))));
}
async function open_(str){
  const [iv,ct]=str.split(".");
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(iv)},CKEY,b64(ct))));
}

let ME=null,pick=null,pasteText="",calTab="cal",pickCity=null,openPanel=undefined,seenOpen=new Set(),WX={},wxView=null,units="C",FX=null,fxOpen=false;
let blob=null,TRIP=null,DAYS=[],cur=0,view="day",editing=null,PLANS={},SPOTS={},pasting=null,openSec=new Set(),SYNC=null,STATUS="local",PORT={},CITY={};

const loadPlans=()=>{
  try{PLANS=JSON.parse(localStorage.getItem(PKEY)||"{}")}catch{PLANS={}}
  try{SPOTS=JSON.parse(localStorage.getItem(SKEY)||"{}")}catch{SPOTS={}}
};
const savePlans=()=>{try{localStorage.setItem(PKEY,JSON.stringify(PLANS))}catch{toast("Can't save here")}};
const saveSpots=()=>{try{localStorage.setItem(SKEY,JSON.stringify(SPOTS))}catch{toast("Can't save here")}};

const CATMAP=[
  [/(night_?club|nightclub|\bpub\b|cocktail|brewery|\bbar\b|beer_|wine_bar|discoteca)/i,"Bars and Clubs"],
  [/(restaurant|cafe|caf\u00e9|bakery|\bfood\b|pizza|sushi|ramen|bistro|brunch|coffee|deli|eatery|steak|taco|diner|patisserie|ice_cream|breakfast)/i,"Food and Drink"],
  [/(museum|gallery|monument|historical|church|cathedral|castle|palace|landmark|memorial|theatre|theater|library|\bart\b|tourist_attraction)/i,"History and Art"],
  [/(\bpark\b|beach|garden|viewpoint|hiking|trail|nature|\blake\b|forest|mountain|botanical|\bzoo\b|scenic)/i,"Nature and Beauty"],
  [/(\bstore\b|\bshop\b|boutique|market|shopping|clothing|book|record|vintage|jewel)/i,"Shopping"]
];
function guessSec(url,name){
  let hay="";
  const m=(url||"").match(/!15s([^!?]+)/);
  if(m){ try{ const b=m[1].replace(/-/g,"+").replace(/_/g,"/"); hay=atob(b+"=".repeat((4-b.length%4)%4)); }catch{} }
  hay+=" "+(name||"");
  for(const [re,sec] of CATMAP) if(re.test(hay)) return sec;
  return "Food and Drink";
}

function parseSpot(text){
  text=(text||"").trim();
  const url=(text.match(/https?:\/\/\S+/)||[])[0]||"";
  let name="";
  const m=url.match(/\/maps\/place\/([^\/@?]+)/);
  if(m){ try{ name=decodeURIComponent(m[1].replace(/\+/g," ")); }catch{ name=m[1].replace(/\+/g," "); } }
  if(!name){
    const lines=text.split(/\n+/).map((l)=>l.trim()).filter((l)=>l&&!/^https?:/i.test(l));
    if(lines.length) name=lines[0];
  }
  name=name.replace(/\s*[·|]\s*[\d.]+\s*★.*$/,"").replace(/^["'“]|["'”]$/g,"").trim();
  let lat=null,lng=null;
  const c=url.match(/!3d(-?[\d.]+)!4d(-?[\d.]+)/)||url.match(/@(-?[\d.]+),(-?[\d.]+)/);
  if(c){ lat=parseFloat(c[1]); lng=parseFloat(c[2]); }
  return {name,url,lat,lng,sec:guessSec(url,name)};
}

const api=(path,opts={})=>fetch(SYNC.url+"/rest/v1/"+path,{...opts,headers:{apikey:SYNC.key,Authorization:"Bearer "+SYNC.key,"Content-Type":"application/json",...(opts.headers||{})}});

async function pull(){
  if(!SYNC)return;
  try{
    const r=await api("plans?select=day,payload");
    if(!r.ok)throw 0;
    for(const row of await r.json()){
      try{
        const l=await open_(row.payload);
        const k=row.day;
        if(k.startsWith("spots:")){ const c=k.slice(6); if(l&&l.length)SPOTS[c]=l; else delete SPOTS[c]; }
        else if(l&&l.length)PLANS[k]=l; else delete PLANS[k];
      }catch{}
    }
    savePlans(); saveSpots(); STATUS="synced";
  }catch{ STATUS="offline"; }
  paintStatus();
}
async function push(day){
  if(!SYNC){STATUS="local";paintStatus();return;}
  try{
    const r=await api("plans",{method:"POST",headers:{Prefer:"resolution=merge-duplicates"},body:JSON.stringify({day,payload:await seal(day.startsWith("spots:")?(SPOTS[day.slice(6)]||[]):(PLANS[day]||[])),updated_at:new Date().toISOString()})});
    if(!r.ok)throw 0;
    STATUS="synced";
  }catch{ STATUS="pending"; }
  paintStatus();
}
function paintStatus(){
  const el=$("#sync"); if(!el)return;
  el.textContent={synced:"SYNCED",offline:"OFFLINE",pending:"NOT SAVED",local:"THIS PHONE ONLY"}[STATUS]||"";
}

async function boot(){
  try{ blob=await(await fetch("trip.enc.json",{cache:"no-store"})).json(); }
  catch{ $("#lockmsg").textContent="Can't load trip.enc.json"; return; }
  let saved=null; try{saved=localStorage.getItem(KEY)}catch{}
  if(saved){ try{ start(await decrypt(blob,saved)); return; }catch{ try{localStorage.removeItem(KEY)}catch{} } }
  if($("#pass"))$("#pass").focus();
}
async function attempt(){
  const p=$("#pass").value; if(!p)return;
  const b=$("#unlock"); b.disabled=true; b.textContent="Unlocking"; $("#lockmsg").textContent="";
  try{ const t=await decrypt(blob,p); try{localStorage.setItem(KEY,p)}catch{} start(t); }
  catch{ $("#lockmsg").textContent="WRONG PASSPHRASE"; $("#pass").select(); }
  finally{ b.disabled=false; b.textContent="Unlock"; }
}
if($("#unlock"))$("#unlock").addEventListener("click",attempt);
if($("#pass"))$("#pass").addEventListener("keydown",(e)=>{if(e.key==="Enter")attempt()});

function build(trip){
  const out=[];
  const home=trip.meta.home||{city:"Home",country:"",flag:"xx",pop:"#4A6CF7"};
  for(let t=d(trip.meta.start);iso(t)<=trip.meta.end;t.setDate(t.getDate()+1)){
    const date=iso(t);
    const flights=trip.flights.filter((f)=>f.date===date);
    const stay=trip.stays.find((s)=>s.checkIn<=date&&date<s.checkOut);
    const arriving=trip.stays.filter((s)=>s.checkIn===date);
    const leaving=trip.stays.filter((s)=>s.checkOut===date&&s.checkOutTime);
    const src=stay||arriving[0]||null;
    out.push({date,flights,stay,arriving,leaving,
      city:src?src.city:home.city,country:src?src.country:home.country,
      flag:src?src.flag:home.flag,p1:src?src.pop1:home.pop,p2:src?src.pop2:home.pop});
  }
  return out;
}

function start(trip){
  TRIP=trip; DAYS=build(trip); loadPlans();
  seedSpots(trip);
  migrate(); migratePlans();
  PORT={}; CITY={};
  trip.stays.forEach((s)=>{if(s.arrCode){PORT[s.arrCode]=s.pop1;CITY[s.arrCode]={name:s.city,flag:s.flag}}});
  if(trip.meta.home&&trip.meta.home.code){PORT[trip.meta.home.code]=trip.meta.home.pop;CITY[trip.meta.home.code]={name:trip.meta.home.city,flag:trip.meta.home.flag}}
  if($("#lock"))$("#lock").style.display="none";
  $("#app").classList.add("on");
  const today=iso(new Date());
  const i=DAYS.findIndex((x)=>x.date===today);
  cur=i>=0?i:(today>TRIP.meta.end?DAYS.length-1:0);
  $("#app").innerHTML=`
    <div class="mast"><b>Europe 2026</b>
      <span class="grp"><button id="clk" aria-label="Time format">${CLOCK}</button><button id="fx" aria-label="Currency">${SWAP}</button><button id="invert" aria-label="Invert colours"></button></span></div>
    <div id="fxbox"></div>
    <div id="screen"></div>
    <div class="foot"><span id="sync">…</span><span class="fbtns"><button id="clearplans">CLEAR PLANS</button><button id="forget">LOCK THIS DEVICE</button></span></div>`;
  let armed=false,armT;
  $("#clearplans").addEventListener("click",async()=>{
    const b=$("#clearplans");
    if(!armed){
      armed=true; b.classList.add("arm"); b.textContent="TAP AGAIN TO CLEAR";
      clearTimeout(armT); armT=setTimeout(()=>{armed=false;b.classList.remove("arm");b.textContent="CLEAR PLANS"},4000);
      return;
    }
    clearTimeout(armT); armed=false; b.classList.remove("arm"); b.textContent="CLEARING";
    const days=Object.keys(PLANS);
    PLANS={}; savePlans();
    for(const dt of days){ await push(dt); }
    b.textContent="CLEAR PLANS";
    editing=null; pick=null; draw();
    toast(days.length?"Cleared "+days.length+" days":"Nothing to clear");
  });
  $("#forget").addEventListener("click",()=>{try{localStorage.removeItem(KEY)}catch{};location.reload()});
  $("#clk").classList.toggle("on",clock12);
  $("#clk").addEventListener("click",()=>{
    clock12=!clock12;
    try{localStorage.setItem("eu26.clock",clock12?"12":"24")}catch{}
    $("#clk").classList.toggle("on",clock12);
    draw();
  });
  $("#fx").addEventListener("click",()=>{
    fxOpen=!fxOpen; $("#fx").classList.toggle("on",fxOpen); drawFx();
  });
  $("#invert").addEventListener("click",()=>{
    const on=document.body.classList.toggle("light");
    try{localStorage.setItem("eu26.light",on?"1":"0")}catch{}
    document.querySelector('meta[name=theme-color]').setAttribute("content",on?"#F0E9D8":"#12150F");
  });
  document.addEventListener("keydown",(e)=>{
    if(view!=="day"||editing!==null)return;
    if(e.key==="ArrowLeft")go(cur-1);
    if(e.key==="ArrowRight")go(cur+1);
  });
  draw();
  if(fxOpen)drawFx();
  SYNC=trip.sync&&trip.sync.url?trip.sync:null;
  STATUS=SYNC?"offline":"local"; paintStatus();
  if(SYNC){ pull().then(draw); document.addEventListener("visibilitychange",()=>{if(!document.hidden)pull().then(draw)}); }
}

function countdown(){
  const today=iso(new Date()), s=TRIP.meta.start, e=TRIP.meta.end;
  const days=(a,b)=>Math.round((d(b)-d(a))/864e5);
  if(today<s){ const n=days(today,s); return n===1?"1 DAY UNTIL THE TRIP":`${n} DAYS UNTIL THE TRIP`; }
  if(today>e) return "THAT WAS EUROPE";
  const n=days(today,e);
  return n===0?"LAST DAY":n===1?"1 DAY REMAINING":`${n} DAYS REMAINING`;
}

function go(i){
  if(i<0||i>=DAYS.length)return;
  cur=i; editing=null; view="day"; calTab="cal"; pickCity=null; wxView=null; openPanel=undefined; pasting=null;
  history.replaceState(null,"","#d="+DAYS[cur].date);
  draw(); if(fxOpen)drawFx();
}
function draw(){ view==="cal"?(calTab==="places"?drawPlaces():drawCal()):drawDay(); }

function drawCal(){
  const first=d(TRIP.meta.start),y=first.getFullYear(),m=first.getMonth();
  const lead=new Date(y,m,1).getDay(),len=new Date(y,m+1,0).getDate(),today=iso(new Date());
  let cells="";
  for(let i=0;i<lead;i++) cells+=`<div class="cell out"><span></span><span class="flag"></span></div>`;
  for(let n=1;n<=len;n++){
    const date=iso(new Date(y,m,n)),day=DAYS.find((x)=>x.date===date),cls=["cell"];
    if(day){cls.push("trip"); if(date<today)cls.push("past"); if((PLANS[date]||[]).length)cls.push("dot");} else cls.push("out");
    if(day&&DAYS[cur].date===date)cls.push("sel");
    if(date===today)cls.push("now");
    cells+=`<button class="${cls.join(" ")}" ${day?`data-go="${DAYS.indexOf(day)}"`:"disabled"} aria-label="${esc(date)}"><span>${n}</span><span class="flag ${day?day.flag:""}"></span></button>`;
  }
  const seen=[]; TRIP.stays.forEach((s)=>{if(!seen.some((x)=>x.city===s.city))seen.push(s)});
  $("#screen").innerHTML=`<div class="cal">
    <div class="cal-head"><b>${MONTH[m]} ${y}</b><span>TAP A DAY</span></div>
    <div class="grid">${DOW.map((x)=>`<div class="dow">${x[0]}</div>`).join("")}${cells}</div>
    <div class="legend">${seen.map((s)=>`<span><i class="flag ${s.flag}"></i>${esc(s.city)}</span>`).join("")}</div>
  </div>
  ${tabs()}`;
  $("#screen").querySelectorAll("[data-go]").forEach((b)=>b.addEventListener("click",()=>go(+b.dataset.go)));
  wireTabs();
}

const R=6371;
function km(a,b,c,d){
  const t=(v)=>v*Math.PI/180, dLat=t(c-a), dLon=t(d-b);
  const h=Math.sin(dLat/2)**2+Math.cos(t(a))*Math.cos(t(c))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
const fmtKm=(k)=>k<1?Math.round(k*1000)+" m":k.toFixed(k<10?1:0)+" km";
const driveMin=(k)=>Math.max(2,Math.round(k*1.3/28*60));
const walkMin=(k)=>Math.round(k*1.25/4.8*60);

function far(sp){
  if(!ME||sp.lat==null) return "";
  const k=km(ME.lat,ME.lng,sp.lat,sp.lng);
  const dir=`https://www.google.com/maps/dir/?api=1&destination=${sp.lat},${sp.lng}`;
  const legs=k<=2
    ? `${WALK}~${walkMin(k)} min`
    : `${CAR}~${driveMin(k)} min`;
  return `<a class="far" href="${dir}" target="_blank" rel="noopener"><span>${fmtKm(k)}</span><span>${legs}</span></a>`;
}

function locBar(){
  if(ME) return `<button class="locbar on" id="loc">${LOC}Distances from where you are &middot; tap to refresh</button>`;
  return `<button class="locbar" id="loc">${LOC}Show how far things are</button>`;
}

function wireSpotActions(redraw){
  $("#screen").querySelectorAll("[data-rm]").forEach((b)=>b.addEventListener("click",()=>{
    const [c,i]=b.dataset.rm.split("|");
    SPOTS[c].splice(+i,1); if(!SPOTS[c].length)delete SPOTS[c];
    saveSpots(); redraw(); push("spots:"+c);
  }));
  $("#screen").querySelectorAll("[data-seenflip]").forEach((b)=>b.addEventListener("click",()=>{
    const [c,i]=b.dataset.seenflip.split("|");
    SPOTS[c][+i].done=!SPOTS[c][+i].done;
    saveSpots(); redraw(); push("spots:"+c);
  }));
}

const WKEY="eu26.units";
try{units=localStorage.getItem(WKEY)||"C"}catch{}
let clock12=false;
try{clock12=localStorage.getItem("eu26.clock")==="12"}catch{}
function T(t){
  if(!clock12||!t) return t||"";
  const m=String(t).match(/^(\d{1,2}):(\d{2})/);
  if(!m) return t;
  let h=+m[1]; const mi=m[2], ap=h>=12&&h<24?"pm":"am";
  h=h%12; if(h===0)h=12;
  return h+":"+mi+" "+ap;
}
const Trange=(str)=>String(str).replace(/(\d{1,2}:\d{2})/g,(m)=>T(m));
const tC=(c)=>units==="C"?Math.round(c)+"\u00B0":Math.round(c*9/5+32)+"\u00B0";

function geoFor(x){
  const s=x.arriving[0]||x.stay;
  if(s&&s.lat!=null) return {lat:s.lat,lng:s.lng,city:s.city};
  const h=TRIP.meta.home;
  return {lat:h.lat,lng:h.lng,city:h.city};
}

async function getWx(x){
  const g=geoFor(x), key=g.city+"|"+x.date;
  if(WX[key]!==undefined) return;
  WX[key]=null;
  try{
    const u=`https://api.open-meteo.com/v1/forecast?latitude=${g.lat}&longitude=${g.lng}`
      +`&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max`
      +`&hourly=temperature_2m,precipitation_probability,uv_index&timezone=auto`
      +`&start_date=${x.date}&end_date=${x.date}`;
    const r=await fetch(u);
    if(!r.ok)throw 0;
    const j=await r.json();
    if(!j.daily||j.daily.time.length===0)throw 0;
    const hrs=j.hourly.time.map((t,i)=>({h:t.slice(11,16),temp:j.hourly.temperature_2m[i],pop:j.hourly.precipitation_probability[i],uv:j.hourly.uv_index[i]}));
    const hi=Math.max(...hrs.map((z)=>z.temp)), lo=Math.min(...hrs.map((z)=>z.temp));
    const over=hrs.filter((z)=>z.uv>2);
    WX[key]={
      hi,lo,
      hiAt:(hrs.find((z)=>z.temp===hi)||{}).h,loAt:(hrs.find((z)=>z.temp===lo)||{}).h,
      pop:j.daily.precipitation_probability_max[0],
      uvMax:Math.max(...hrs.map((z)=>z.uv||0)),
      uvFrom:over.length?over[0].h:null, uvTo:over.length?over[over.length-1].h:null,
      hrs
    };
  }catch{ WX[key]=false; }
  drawDay();
}

function bars(hrs,pick,max,hot){
  const win=hrs.filter((z)=>+z.h.slice(0,2)>=6&&+z.h.slice(0,2)<=21);
  return `<div class="strip">${win.map((z)=>{
      const v=pick(z)||0, pc=Math.max(3,Math.round(v/max*100));
      return `<i class="${v>hot?"hi":""}" style="height:${pc}%"></i>`;
    }).join("")}</div>
    <div class="hrs"><span>06</span><span>11</span><span>16</span><span>21</span></div>`;
}

function wxSummary(x){
  const g=geoFor(x), w=WX[g.city+"|"+x.date];
  if(w===undefined||w===false||w==null) return "";
  return `${tC(w.hi)} / ${tC(w.lo)}`;
}

function weatherBox(x){
  const g=geoFor(x), w=WX[g.city+"|"+x.date];
  if(w===undefined){ getWx(x); return `<p class="wxload">Loading weather</p>`; }
  if(w===false||w==null) return `<p class="wxload">Forecast opens up about two weeks out</p>`;

  if(wxView==="uv"){
    return `<div class="wxin">
      <button class="wxbar" data-wx=""><span class="lbl">UV index</span><span class="x">&larr; back</span></button>
      ${bars(w.hrs,(z)=>z.uv,Math.max(3,w.uvMax),2)}
      <p class="wxline">${w.uvFrom?`Wear sunscreen from <b>${T(w.uvFrom)}</b> to <b>${T(w.uvTo)}</b>`:"UV stays under 2 all day"} &middot; peak ${w.uvMax.toFixed(1)}</p>
    </div>`;
  }
  if(wxView==="pop"){
    return `<div class="wxin">
      <button class="wxbar" data-wx=""><span class="lbl">Rain chance</span><span class="x">&larr; back</span></button>
      ${bars(w.hrs,(z)=>z.pop,100,50)}
      <p class="wxline">Peak <b>${w.pop}%</b> chance today</p>
    </div>`;
  }

  return `<div class="wxin">
    <div class="wxtop">
      <button class="temp" id="wx-units"><b>${tC(w.hi)}</b><span>${tC(w.lo)}</span><em>${units==="C"?"\u00B0C":"\u00B0F"}</em></button>
      <span class="at">HIGH ${esc(T(w.hiAt||""))}<br>LOW ${esc(T(w.loAt||""))}</span>
      <button class="pill" data-wx="pop">${w.pop}% rain</button>
    </div>
    <button class="wxline tap" data-wx="uv">${w.uvFrom?`Wear sunscreen from <b>${T(w.uvFrom)}</b> to <b>${T(w.uvTo)}</b>`:"No sunscreen needed today"}</button>
  </div>`;
}

const CUR={USD:"$",EUR:"\u20AC",SEK:"kr",GBP:"\u00A3"};
function localCur(x){
  const s=x.arriving[0]||x.stay;
  if(s&&s.currency) return s.currency;
  if(x.flights.length){
    const to=x.flights[x.flights.length-1].to.code;
    const d=TRIP.stays.find((y)=>y.arrCode===to);
    if(d&&d.currency) return d.currency;
  }
  return (TRIP.meta.home&&TRIP.meta.home.currency)||"USD";
}
async function getFX(){
  try{
    const c=JSON.parse(localStorage.getItem("eu26.fx")||"null");
    if(c&&Date.now()-c.t<864e5){ FX=c.r; return; }
  }catch{}
  try{
    const r=await fetch("https://open.er-api.com/v6/latest/USD");
    const j=await r.json();
    if(j&&j.rates){ FX=j.rates; try{localStorage.setItem("eu26.fx",JSON.stringify({t:Date.now(),r:FX}))}catch{} }
  }catch{ FX=null; }
  drawFx();
}
function drawFx(){
  const el=$("#fxbox"); if(!el)return;
  if(!fxOpen){ el.innerHTML=""; return; }
  const x=DAYS[cur], code=localCur(x);
  if(!FX){ el.innerHTML=`<div class="fxpanel"><p class="fxrate">Fetching rates</p></div>`; getFX(); return; }
  const rate=FX[code]||1;
  el.innerHTML=`<div class="fxpanel">
    <div class="fxrow"><span>${esc(code)}</span><input id="fx-loc" inputmode="decimal" value="10"><span>${esc(CUR[code]||code)}</span></div>
    <div class="fxrow" style="margin-top:6px"><span>USD</span><input id="fx-usd" inputmode="decimal" value="${(10/rate).toFixed(2)}"><span>${esc(CUR.USD)}</span></div>
    <p class="fxrate">1 ${esc(code)} = ${(1/rate).toFixed(3)} USD &middot; updated daily</p>
  </div>`;
  const u=$("#fx-usd"), l=$("#fx-loc");
  u.addEventListener("input",()=>{ const v=parseFloat(u.value); l.value=isNaN(v)?"":(v*rate).toFixed(2); });
  l.addEventListener("input",()=>{ const v=parseFloat(l.value); u.value=isNaN(v)?"":(v/rate).toFixed(2); });
}

function askLoc(){
  if(!navigator.geolocation){ toast("No location on this device"); return; }
  toast("Locating");
  navigator.geolocation.getCurrentPosition(
    (p)=>{ ME={lat:p.coords.latitude,lng:p.coords.longitude}; drawDay(); },
    ()=>toast("Location denied"),
    {enableHighAccuracy:false,timeout:8000,maximumAge:120000}
  );
}

  return `<div class="spot${isDone?" gone":""}">
    <a ${sp.url?`href="${esc(sp.url)}" target="_blank" rel="noopener"`:""}>
      <b>${esc(sp.name)}</b>
      ${sp.note?`<span class="note">${esc(sp.note)}</span>`:sp.url?`<span>Open in Maps</span>`:""}
    </a>

      <button data-seenflip="${city}|${i}" aria-label="${isDone?"Unhide":"Hide"}">${isDone?EYEOFF:EYE}</button>
    </span>

  opts=opts||{};
  const open=openPanel===id;
  return `<div class="pnl${open?" open":""}">
    <div class="ph">
      ${opts.lead||""}
      ${opts.flag?`<span class="flag ${opts.flag}"></span>`:""}
      <button class="phmain" data-pnl="${esc(id)}">
        <span class="lbl${opts.city?" city":""}">${label}</span>
        <span class="meta">${meta||""}</span>
      </button>
      <button class="tw" data-pnl="${esc(id)}">${open?"&minus;":"+"}</button>

function sections(x){
  const city=x.city, list=SPOTS[city]||[];
  return SECTIONS.map((sec)=>{
    const items=list.map((sp,i)=>({sp,i})).filter(({sp})=>sp.sec===sec);
    const live=items.filter(({sp})=>!sp.done), done=items.filter(({sp})=>sp.done);
    const open=openPanel==="sec:"+sec;
    const form=(pasting===sec)?`<div class="paste">
        <textarea id="s-paste" placeholder="Paste a Google Maps link" autocomplete="off" autocorrect="off" spellcheck="false"></textarea>
        <input id="s-name" placeholder="Name" autocomplete="off" autocorrect="off" spellcheck="false">
        <input id="s-note" placeholder="Note (optional)" autocomplete="off" autocorrect="off" spellcheck="false">
        <button class="save" id="s-save">Add to ${esc(sec)}</button>
        <button class="cancel" id="s-cancel">Cancel</button>
      </div>`:"";
    return panel("sec:"+sec,esc(sec),live.length||"",
      `${live.length?live.map(({sp,i})=>spotRow(sp,i,city)).join(""):`<p class="empty">Nothing yet.</p>`}
       ${done.length?`<button class="seenbar" data-seen="${esc(sec)}">${seenOpen.has(sec)?"&minus;":"+"} ${done.length} hidden</button>
         ${seenOpen.has(sec)?done.map(({sp,i})=>spotRow(sp,i,city,true)).join(""):""}`:""}
       ${form||`<button class="addrow" data-add="${esc(sec)}">+ Add a place</button>`}`);
  }).join("");
}

function wireSections(x){
  if($("#loc")) $("#loc").addEventListener("click",askLoc);
  $("#screen").querySelectorAll("[data-add]").forEach((b)=>b.addEventListener("click",()=>{
    pasting=b.dataset.add; drawDay(); $("#s-paste").focus();
  }));
  wireSpotActions(()=>drawDay());
  $("#screen").querySelectorAll("[data-seen]").forEach((b)=>b.addEventListener("click",()=>{
    const k=b.dataset.seen; seenOpen.has(k)?seenOpen.delete(k):seenOpen.add(k); drawDay();
  }));
  if(pasting){
    const fill=()=>{const p=parseSpot($("#s-paste").value); if(p.name&&!$("#s-name").value)$("#s-name").value=p.name;};
    $("#s-paste").addEventListener("input",fill);
    $("#s-paste").addEventListener("paste",()=>setTimeout(fill,0));
    $("#s-cancel").addEventListener("click",()=>{pasting=null;drawDay()});
    $("#s-save").addEventListener("click",()=>{
      const p=parseSpot($("#s-paste").value);
      const name=$("#s-name").value.trim()||p.name;
      if(!name){ toast("Needs a name"); return; }
      (SPOTS[x.city]=SPOTS[x.city]||[]).push({name,url:p.url,sec:pasting,lat:p.lat,lng:p.lng,note:($("#s-note").value||"").trim()});
      saveSpots(); pasting=null; drawDay(); push("spots:"+x.city); toast("Added");
    });
  }
}

const tabs=()=>`<div class="tabs">
    <button class="${calTab==="cal"?"on":""}" data-tab="cal">Calendar</button>
    <button class="${calTab==="places"?"on":""}" data-tab="places">All places</button>
  </div>`;

function cityList(){
  const out=[]; TRIP.stays.forEach((s)=>{if(!out.some((x)=>x.city===s.city))out.push(s)}); return out;
}

function placeRow(sp,i,city,date,hidden){
  return `<div class="spot${hidden?" gone":""}">
    <div class="sinfo">
      <b>${esc(sp.name)}</b>
      <span>${metaLine(sp,date)}</span>
    </div>
    <div class="sacts">
      ${links(sp)}
      <button class="eye" data-seenflip="${esc(city)}|${i}" aria-label="${hidden?"Unhide":"Hide"}">${hidden?EYEOFF:EYE}</button>
    </div>
  </div>`;
}

function drawPlaces(){
  const x=DAYS[cur];
  const cities=cityList();
  if(!pickCity) pickCity=x.city;

  const body=cities.map((c)=>{
    const list=SPOTS[c.city]||[];
    const live=list.map((sp,i)=>({sp,i})).filter(({sp})=>!sp.done);
    const hid=list.map((sp,i)=>({sp,i})).filter(({sp})=>sp.done);
    const id="city:"+c.city;
    const adding=pasting===id;
    const parsed=adding?parseSpot(pasteText):{sec:null};
    const inner=`
      ${live.length?live.map((o)=>placeRow(o.sp,o.i,c.city,x.date)).join(""):`<p class="empty">Nothing saved yet.</p>`}
      ${hid.length?`<button class="seenbar" data-seen="${esc(id)}">${seenOpen.has(id)?"&minus;":"+"} ${hid.length} hidden</button>
        ${seenOpen.has(id)?hid.map((o)=>placeRow(o.sp,o.i,c.city,x.date,true)).join(""):""}`:""}
      ${adding?`<div class="picker">
        <input id="s-paste" value="${esc(pasteText)}" placeholder="Paste a Google Maps link, or type a name" autocomplete="off" autocorrect="off" spellcheck="false">
        <div class="chips sec">${SECTIONS.map((k)=>`<button class="${(pick&&pick.sec||parsed.sec||SECTIONS[1])===k?"on":""}" data-psec="${esc(k)}">${esc(k)}</button>`).join("")}</div>
        <button class="save" id="s-save">Add to ${esc(c.city)}</button>
        <button class="cancel" id="s-cancel">Cancel</button>
      </div>`:`<button class="addrow" data-add="${esc(id)}">+ Add a place</button>`}`;
    return `<div style="--p1:${c.pop1};--p2:${c.pop2}">${panel(id,esc(c.city),live.length||"",inner,{flag:c.flag,city:1})}</div>`;
  }).join("");

  $("#screen").innerHTML=`<div style="--p1:${x.p1};--p2:${x.p2}">
    <button class="locbar${ME?" on":""}" id="loc">${LOC}${ME?"Distances on &middot; tap to refresh":"Show how far things are"}</button>
    ${body}
    ${tabs()}
  </div>`;

  wireTabs();
  if($("#loc")) $("#loc").addEventListener("click",askLoc);
  $("#screen").querySelectorAll("[data-pnl]").forEach((b)=>b.addEventListener("click",()=>{
    const k=b.dataset.pnl;
    openPanel=openPanel===k?null:k;
    if(pasting&&pasting!==k)pasting=null;
    draw();
  }));
  $("#screen").querySelectorAll("[data-seen]").forEach((b)=>b.addEventListener("click",()=>{
    const k=b.dataset.seen; seenOpen.has(k)?seenOpen.delete(k):seenOpen.add(k); draw();
  }));
  $("#screen").querySelectorAll("[data-add]").forEach((b)=>b.addEventListener("click",()=>{
    pasting=b.dataset.add; pasteText=""; pick={sec:null}; openPanel=b.dataset.add; draw();
  }));
  wireSpotActions(()=>draw());
  if(pasting&&pasting.indexOf("city:")===0){
    const city=pasting.slice(5);
    const inp=$("#s-paste");
    inp.addEventListener("input",()=>{ pasteText=inp.value; });
    inp.addEventListener("paste",()=>setTimeout(()=>{pasteText=inp.value;pick={sec:null};draw()},0));
    $("#s-cancel").addEventListener("click",()=>{pasting=null;pasteText="";draw()});
    $("#screen").querySelectorAll("[data-psec]").forEach((b)=>b.addEventListener("click",()=>{
      pasteText=$("#s-paste").value; pick={sec:b.dataset.psec}; draw();
    }));
    $("#s-save").addEventListener("click",()=>{
      const txt=$("#s-paste").value;
      const pr=parseSpot(txt);
      const name=pr.name||txt.trim();
      if(!name){ toast("Needs a name or a link"); return; }
      (SPOTS[city]=SPOTS[city]||[]).push({name,url:pr.url||"",sec:(pick&&pick.sec)||pr.sec,lat:pr.lat,lng:pr.lng});
      saveSpots(); pasting=null; pasteText=""; draw(); push("spots:"+city); toast("Added to "+city);
    });
  }
}

function wireTabs(){
  $("#screen").querySelectorAll("[data-tab]").forEach((b)=>b.addEventListener("click",()=>{calTab=b.dataset.tab;pasting=null;draw()}));
}

function drawDay(){
  const x=DAYS[cur],t=d(x.date);
  let html="";
  const def=x.flights.length?"fl0":"plans";
  if(openPanel===undefined) openPanel=def;
  if(x.flights.length){
    x.flights.forEach((f,i)=>{html+=flightHero(f,i)});
    if(x.arriving.length) html+=placeCard(x);
  }else{
    html+=placeCard(x);
  }
  html+=plansBlock(x);

  $("#screen").innerHTML=`
    <div class="nav" style="--p1:${x.p1};--p2:${x.p2}">
      <div class="navrow">
        <button class="arw" id="prev" ${cur===0?"disabled":""} aria-label="Previous day">&larr;</button>
        <button id="datebtn"><b>${DOW[t.getDay()]} ${t.getDate()} ${MON[t.getMonth()]}</b><span>${x.date<iso(new Date())?"DONE &middot; ":""}DAY ${cur+1} / ${DAYS.length} &middot; <u>CALENDAR</u></span></button>
        <button class="arw" id="next" ${cur===DAYS.length-1?"disabled":""} aria-label="Next day">&rarr;</button>
      </div>
      <div class="wxrow">${weatherBox(x)}</div>
    </div>
    <div class="${x.date<iso(new Date())?"past-day":""}" style="--p1:${x.p1};--p2:${x.p2}">${html}</div>`;

  $("#prev").addEventListener("click",()=>go(cur-1));
  $("#next").addEventListener("click",()=>go(cur+1));
  $("#datebtn").addEventListener("click",()=>{view="cal";draw()});
  $("#screen").querySelectorAll("[data-wx]").forEach((b)=>b.addEventListener("click",()=>{
    wxView=b.dataset.wx||null; drawDay();
  }));
  if($("#wx-units")) $("#wx-units").addEventListener("click",()=>{
    units=units==="C"?"F":"C"; try{localStorage.setItem(WKEY,units)}catch{} drawDay();
  });
  $("#screen").querySelectorAll("[data-pnl]").forEach((b)=>b.addEventListener("click",()=>{
    const k=b.dataset.pnl;
    openPanel=openPanel===k?null:k;
    if(k!=="plans")editing=null;
    if(!k.startsWith("sec:"))pasting=null;
    wxView=null; drawDay();
  }));
  if($("#loc")) $("#loc").addEventListener("click",askLoc);
  wireSections(x);
  wirePlans(x);
  $("#screen").querySelectorAll(".code[data-copy]").forEach((el)=>el.addEventListener("click",async()=>{
    try{
      await navigator.clipboard.writeText(el.dataset.copy);
      el.classList.add("done"); toast("Copied "+el.dataset.copy);
      setTimeout(()=>el.classList.remove("done"),600);
    }catch{ toast("Long-press to select"); }
  }));
}



const port=(code)=>`<a href="https://maps.google.com/?q=${encodeURIComponent(code+" airport")}" target="_blank" rel="noopener" style="--ac:${PORT[code]||"var(--fg)"}"><b>${esc(code)}</b></a>`;

function flightHero(f,idx){
  const seats=f.seats&&f.seats.length
    ? f.seats.map((s)=>`<span class="code info"><span class="l">${SEAT}${esc(s.who)}</span><span class="v">${esc(s.seat)}</span></span>`).join("")
    : `<span class="code info"><span class="l">${SEAT}Seats</span><span class="v">TBD</span></span>`;
  const body=`<div class="leg">
      <div>${port(f.from.code)}<span class="t">${esc(T(f.from.time))}</span><em>${esc(f.from.terminal||f.from.city)}</em></div>
      <div class="mid">
        <span class="air">${esc(f.airline)}<br>${esc(f.number)}</span>
        <i></i>
        <span class="dur">${esc(f.duration)}${f.stop?"<br>"+esc(f.stop):""}</span>
      </div>
      <div class="to">${port(f.to.code)}<span class="t">${esc(T(f.to.time))}${f.to.arrivesNextDay?` <em class="plus" style="background:${PORT[f.to.code]||"var(--p2)"}">+1</em>`:""}</span><em>${esc(f.to.city)}</em></div>
    </div>
    <div class="codes">${(f.codes||[]).map((c)=>`<button class="code" data-copy="${esc(c.value)}"><span class="l">${esc(c.label)}</span><span class="v">${esc(c.value)}</span></button>`).join("")}${seats}</div>
    ${notes(f.notes)}`;
  return panel("fl"+idx,"Flight",`${esc(f.from.code)} &rarr; ${esc(f.to.code)} &middot; ${esc(T(f.from.time))}`,body);
}

function byeLine(x){
  const s=x.arriving[0]||x.stay;
  const out=x.leaving.find((l)=>!s||l.name!==s.name);
  return out?`<p class="leave">Check out <b>${esc(out.name)}</b> by <b>${esc(T(out.checkOutTime))}</b></p>`:"";
}

function stayBody(s,arriving){
  const t=s.transfer;
  if(s.pending||s.informal) return `<p class="hotel">${esc(s.name)}</p><p class="sub">${esc(s.kind)}</p>`;
  return `<p class="hotel">${esc(s.name)}</p>
    ${arriving?`<p class="sub">${esc(s.room)}</p>
      <p class="checkin">Check in ${esc(T(s.checkInTime||"15:00"))}</p>
      ${t?`<div class="xfer"><span class="src">from ${esc(t.from)}</span><span>${CAR}${esc(t.car)}</span><span>${RAIL}${esc(t.transit)} ${esc(t.transitKind)}</span></div>`:""}
      ${codes(s.codes)}`:""}
    <div class="low">
      <span class="who">${esc(s.address||"")}</span>
      ${s.address?`<a class="ico" href="https://maps.google.com/?q=${encodeURIComponent(s.name+", "+s.address)}" target="_blank" rel="noopener" aria-label="Open in Maps">${PIN}</a>`:""}
      ${s.phone?`<a class="ico" href="tel:${esc(s.phone)}" aria-label="Call">${TEL}</a>`:""}
    </div>`;
}

function placeCard(x){
  const arriving=!!x.arriving.length;
  const s=x.arriving[0]||x.stay;
  if(!s) return panel("place",esc(x.city),esc(x.country),`<p class="sub">Travelling</p>`,{flag:x.flag,city:1});
  const tot=nights(s.checkIn,s.checkOut),n=arriving?1:nights(s.checkIn,x.date)+1;
  return panel("place",esc(s.city),`${MOON}${n} / ${tot}`,`${byeLine(x)}${stayBody(s,arriving)}`,{flag:s.flag,city:1});
}

function hoursFor(sp,date){
  if(!sp.hours||!sp.hours.some(Boolean)) return "";
  const h=sp.hours[d(date).getDay()];
  return h?Trange(h):"Closed today";
}

function metaLine(sp,date){
  const bits=[];
  if(sp.type) bits.push(esc(sp.type));
  if(ME&&sp.lat!=null) bits.push(fmtKm(km(ME.lat,ME.lng,sp.lat,sp.lng)));
  const h=hoursFor(sp,date);
  if(h) bits.push(esc(h));
  return bits.join(" &middot; ");
}

function links(sp){
  const out=[];
  if(sp.lat!=null) out.push(`<a class="lk" href="https://www.google.com/maps/dir/?api=1&destination=${sp.lat},${sp.lng}" target="_blank" rel="noopener">${PIN}Map</a>`);
  else if(sp.url) out.push(`<a class="lk" href="${esc(sp.url)}" target="_blank" rel="noopener">${PIN}Map</a>`);
  if(sp.phone) out.push(`<a class="lk" href="tel:${esc(sp.phone)}">${TEL}Call</a>`);
  return out.length?`<span class="lks">${out.join("")}</span>`:"";
}

function plannedMap(){
  const m={};
  Object.keys(PLANS).forEach((dt)=>PLANS[dt].forEach((p)=>{
    const k=(p.url||p.title||"").toLowerCase();
    if(k) m[k]=dt;
  }));
  return m;
}

function planRow(p,i,date){
  const t=p.time?(p.end?`${esc(T(p.time))} &ndash; ${esc(T(p.end))}`:esc(T(p.time))):"TBD";
  const head=p.what||p.where||"Plan";
  const sub=[];
  if(p.what&&p.where) sub.push(esc(p.where));
  const m=metaLine(p,date); if(m) sub.push(m);
  return `<div class="plan">
    <div class="ptop">
      <b>${esc(head)}</b>
      <button class="edit" data-editplan="${i}">Edit</button>
    </div>
    ${sub.length?`<p class="pmeta">${sub.join(" &middot; ")}</p>`:""}
    <div class="prow"><span class="tbox${p.time?"":" tbd"}">${t}</span>${links(p)}</div>
    ${p.note?`<p class="pnote">${esc(p.note)}</p>`:""}
    ${editing===i?planEditor(p,i):""}
  </div>`;
}

const fmtShort=(dt)=>{const t=new Date(dt+"T00:00:00");return DOW[t.getDay()]+" "+t.getDate();};

function picker(x){
  const q=(pick.q||"").trim();
  const parsed=parseSpot(pick.q);
  const isLink=!!parsed.url;
  const city=x.city;
  const done=plannedMap();
  let all=(SPOTS[city]||[]).map((sp,i)=>({sp,i})).filter(({sp})=>!sp.done);
  if(q) all=all.filter(({sp})=>(sp.name+" "+(sp.type||"")).toLowerCase().includes(q.toLowerCase()));
  const key=(sp)=>(sp.url||sp.name||"").toLowerCase();
  if(ME) all.sort((a,b)=>{
    const A=a.sp.lat!=null?km(ME.lat,ME.lng,a.sp.lat,a.sp.lng):1e9;
    const B=b.sp.lat!=null?km(ME.lat,ME.lng,b.sp.lat,b.sp.lng):1e9;
    return A-B;
  });
  const fresh=all.filter(({sp})=>!done[key(sp)]);
  const used=all.filter(({sp})=>done[key(sp)]);
  const exact=all.some(({sp})=>sp.name.toLowerCase()===q.toLowerCase());
  const row=(o,dim)=>`<button class="opt${dim?" dim":""}" data-pickspot="${o.i}">
      <b>${esc(o.sp.name)}</b>
      <span>${metaLine(o.sp,x.date)}${dim?" &middot; planned "+esc(fmtShort(done[key(o.sp)])):""}</span>
    </button>`;
  return `<div class="picker">
    <input id="pk-q" value="${esc(pick.q||"")}" placeholder="Search, type a new one, or paste a link" autocomplete="off" autocorrect="off" spellcheck="false">
    ${isLink?`<div class="chips sec">${SECTIONS.map((k)=>`<button class="${(pick.sec||parsed.sec)===k?"on":""}" data-psec="${esc(k)}">${esc(k)}</button>`).join("")}</div>`:""}
    <div class="two">
      <input id="pk-time" type="time" value="${esc(pick.time||"")}" autocomplete="off">
      <span>to</span>
      <input id="pk-end" type="time" value="${esc(pick.end||"")}" autocomplete="off">
    </div>
    ${isLink?`<button class="save" id="pk-new">Add ${esc(parsed.name||"this place")}</button>`
      :(q&&!exact?`<button class="save" id="pk-new">Add &ldquo;${esc(q)}&rdquo;</button>`:"")}
    <div class="opts">${fresh.map((o)=>row(o)).join("")}${used.map((o)=>row(o,true)).join("")}
      ${!fresh.length&&!used.length?`<p class="empty">${q?"Nothing matches.":"No saved places for "+esc(city)+" yet."}</p>`:""}</div>
    <button class="cancel" id="pk-cancel">Cancel</button>
  </div>`;
}

function planEditor(p,i){
  return `<div class="form">
    <div class="fld"><span class="k">What</span><input id="e-what" value="${esc(p.what||"")}" placeholder="Optional" autocomplete="off"></div>
    <div class="fld"><span class="k">Where</span><input id="e-where" value="${esc(p.where||"")}" placeholder="Place" autocomplete="off"></div>
    <div class="fld"><span class="k">When</span><div class="two">
      <input id="e-time" type="time" value="${esc(p.time||"")}"><span>to</span><input id="e-end" type="time" value="${esc(p.end||"")}">
    </div></div>
    <div class="fld"><span class="k">Note</span><input id="e-note" value="${esc(p.note||"")}" placeholder="Optional" autocomplete="off"></div>
    <button class="save" id="e-save">Save</button>
    <div class="row2"><button class="cancel" id="e-cancel">Cancel</button><button class="kill" id="e-kill">Delete</button></div>
  </div>`;
}

function plansBlock(x){
  const list=PLANS[x.date]||[];
  const timed=list.map((p,i)=>({p,i})).filter(({p})=>p.time).sort((a,b)=>a.p.time.localeCompare(b.p.time));
  const loose=list.map((p,i)=>({p,i})).filter(({p})=>!p.time);
  let body="";
  if(list.length){
    body=timed.map(({p,i})=>planRow(p,i,x.date)).join("");
    if(loose.length) body+=loose.map(({p,i})=>planRow(p,i,x.date)).join("");
  }
  if(pick) body+=picker(x);
  else if(editing===null) body+=`<button class="bigadd" id="p-add">+ New plan</button>`;
  return panel("plans","Plans",list.length||"",body,{lead:`<button class="locbtn${ME?" on":""}" id="loc" aria-label="Sync location">${LOC}</button>`});
}

function wirePlans(x){
  const add=$("#p-add");
  if(add) add.addEventListener("click",()=>{pick={q:"",time:"",end:"",sec:null};editing=null;drawDay()});

  $("#screen").querySelectorAll("[data-editplan]").forEach((b)=>b.addEventListener("click",()=>{
    editing=+b.dataset.editplan; pick=null; drawDay();
  }));

  if(pick){
    const q=$("#pk-q");
    const sync=()=>{ pick.q=q.value; pick.time=$("#pk-time").value; pick.end=$("#pk-end").value; };
    q.addEventListener("input",()=>{ const was=!!parseSpot(pick.q).url; pick.q=q.value;
      if(was!==!!parseSpot(pick.q).url){ pick.sec=null; drawDay(); $("#pk-q").focus(); } else drawDay2(); });
    q.addEventListener("paste",()=>setTimeout(()=>{pick.q=q.value;pick.sec=null;drawDay();$("#pk-q").focus();},0));
    $("#pk-cancel").addEventListener("click",()=>{pick=null;drawDay()});
    $("#screen").querySelectorAll("[data-psec]").forEach((b)=>b.addEventListener("click",()=>{sync();pick.sec=b.dataset.psec;drawDay()}));

    $("#screen").querySelectorAll("[data-pickspot]").forEach((b)=>b.addEventListener("click",()=>{
      sync();
      const sp=(SPOTS[x.city]||[])[+b.dataset.pickspot];
      addPlan(x,{where:sp.name,type:sp.type||"",url:sp.url,lat:sp.lat,lng:sp.lng,phone:sp.phone||"",hours:sp.hours||null});
    }));

    const nw=$("#pk-new");
    if(nw) nw.addEventListener("click",()=>{
      sync();
      const p=parseSpot(pick.q);
      const title=p.url?(p.name||"New place"):pick.q.trim();
      if(!title) return;
      if(p.url){
        const sec=pick.sec||p.sec;
        (SPOTS[x.city]=SPOTS[x.city]||[]).push({name:title,url:p.url,sec,lat:p.lat,lng:p.lng});
        saveSpots(); push("spots:"+x.city);
      }
      addPlan(x,{where:title,url:p.url||"",lat:p.lat,lng:p.lng});
    });
  }

  if(typeof editing==="number"){
    $("#e-cancel").addEventListener("click",()=>{editing=null;drawDay()});
    $("#e-kill").addEventListener("click",()=>{
      PLANS[x.date].splice(editing,1);
      if(!PLANS[x.date].length)delete PLANS[x.date];
      savePlans(); editing=null; drawDay(); push(x.date); toast("Deleted");
    });
    $("#e-save").addEventListener("click",()=>{
      const p=PLANS[x.date][editing];
      p.what=$("#e-what").value.trim();
      p.where=$("#e-where").value.trim()||p.where;
      p.time=$("#e-time").value; p.end=$("#e-end").value; p.note=$("#e-note").value.trim();
      savePlans(); editing=null; drawDay(); push(x.date); toast("Saved");
    });
  }
}

function addPlan(x,p){
  const list=PLANS[x.date]=PLANS[x.date]||[];
  list.push({what:"",...p,time:pick.time||"",end:pick.end||""});
  savePlans(); pick=null; editing=list.length-1; drawDay(); push(x.date);
}

function drawDay2(){
  const x=DAYS[cur];
  const el=$(".picker .opts"); if(!el){drawDay();return;}
  const tmp=document.createElement("div"); tmp.innerHTML=picker(x);
  el.innerHTML=tmp.querySelector(".opts").innerHTML;
  const nw=tmp.querySelector("#pk-new"), cur_=$("#pk-new");
  if(!!nw!==!!cur_){ const pos=$("#pk-q").selectionStart; drawDay(); $("#pk-q").focus(); try{$("#pk-q").setSelectionRange(pos,pos)}catch{} return; }
  if(nw&&cur_) cur_.innerHTML=nw.innerHTML;
  $("#screen").querySelectorAll("[data-pickspot]").forEach((b)=>b.addEventListener("click",()=>{
    pick.q=$("#pk-q").value; pick.time=$("#pk-time").value; pick.end=$("#pk-end").value;
    const sp=(SPOTS[x.city]||[])[+b.dataset.pickspot];
    addPlan(x,{where:sp.name,type:sp.type||"",url:sp.url,lat:sp.lat,lng:sp.lng,phone:sp.phone||"",hours:sp.hours||null});
  }));
  if(cur_) cur_.addEventListener("click",()=>$("#pk-new").click());
}

const codes=(l)=>!l?"":`<div class="codes">${l.map((c)=>
  `<button class="code" data-copy="${esc(c.value)}"><span class="l">${esc(c.label)}</span><span class="v">${esc(c.value)}</span></button>`).join("")}</div>`;
const notes=(l)=>!l||!l.length?"":`<div class="notes">${l.map((n)=>`<p>${esc(n)}</p>`).join("")}</div>`;

let tt;
function toast(m){const e=$("#toast");e.textContent=m;e.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>e.classList.remove("on"),1400)}

try{if(localStorage.getItem("eu26.light")==="1")document.body.classList.add("light")}catch{}
boot();
</script>
</body>
</html>
