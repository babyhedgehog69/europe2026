<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Europe 2026</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#12150F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Cormorant+Garamond:ital,wght@1,300;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#12150F;--fg:#F0E9D8;--mute:#8A8878;--wash:#1C201A;--edge:#F0E9D8;
  --p1:#F0E9D8;--p2:#F0E9D8;
  --dp:"Archivo",system-ui,sans-serif;
  --sr:"Cormorant Garamond",Georgia,serif;
  --mn:"Space Mono",ui-monospace,monospace;
}
body.light{--bg:#F0E9D8;--fg:#16190F;--mute:#7C7A6A;--wash:#E4DBC6;--edge:#16190F}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--fg);font-family:var(--dp);font-size:14px;line-height:1.45;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
}
a{color:inherit}
button,a,input,select{touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left;-webkit-user-select:none;user-select:none}
:focus-visible{outline:2px solid var(--p2);outline-offset:2px}
input,select{font:inherit;color:inherit;background:var(--wash);border:1.5px solid var(--edge);padding:10px;width:100%;font-family:var(--mn);font-size:15px;border-radius:0}
select{appearance:none}
input[type=time]{min-height:42px}
.phone{max-width:394px;margin:0 auto;padding:0 14px calc(26px + env(safe-area-inset-bottom))}
.lbl{font-family:var(--mn);font-size:9.5px;font-weight:700;letter-spacing:.15em;text-transform:uppercase}

.flag{display:block;background:var(--fg);box-shadow:0 0 0 1px var(--mute)}
.flag.es{background:linear-gradient(#C60B1E 0 25%,#FFC400 25% 75%,#C60B1E 75%)}
.flag.de{background:linear-gradient(#0F0F0F 0 33.4%,#DD0000 33.4% 66.7%,#FFCE00 66.7%)}
.flag.ie{background:linear-gradient(90deg,#169B62 0 33.4%,#FFF 33.4% 66.7%,#FF883E 66.7%)}
.flag.se{background-color:#006AA7;background-image:linear-gradient(90deg,transparent 0 30%,#FECC00 30% 46%,transparent 46%),linear-gradient(0deg,transparent 0 38%,#FECC00 38% 62%,transparent 62%)}
.flag.us{background:linear-gradient(#3C3B6E,#3C3B6E) 0 0/40% 54% no-repeat,repeating-linear-gradient(#B22234 0 7.7%,#FFF 7.7% 15.4%)}
.flag.xx{background:repeating-linear-gradient(45deg,var(--fg) 0 4px,var(--bg) 4px 8px)}

#lock{min-height:100dvh;display:flex;flex-direction:column;justify-content:center}
.lock-mark{font-family:var(--sr);font-style:italic;font-weight:300;font-size:clamp(52px,17vw,74px);line-height:.92;letter-spacing:-.01em}
.lock-sub{color:var(--mute);font-size:13.5px;margin-top:14px;max-width:30ch;border-top:1.5px solid var(--edge);padding-top:13px}
.lock-form{margin-top:24px;display:flex;flex-direction:column;gap:8px}
#pass{text-align:center;font-size:16px}
#unlock{padding:15px;background:var(--fg);color:var(--bg);font-weight:800;font-stretch:118%;font-size:14px;text-transform:uppercase;text-align:center;letter-spacing:.04em}
#unlock:disabled{opacity:.45}
.lock-msg{min-height:18px;font-family:var(--mn);font-size:11px;color:#FF6B60}

#app{display:none}
#app.on{display:block}

.mast{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 0 10px;border-bottom:1.5px solid var(--edge)}
.mast b{font-family:var(--sr);font-style:italic;font-weight:400;font-size:29px;line-height:1;letter-spacing:-.01em}
.mast .grp{display:flex;align-items:center;gap:9px;font-family:var(--mn);font-size:9.5px;color:var(--mute);letter-spacing:.04em}
#invert{width:23px;height:23px;flex:0 0 auto;border:1.5px solid var(--edge);border-radius:50%;background:linear-gradient(90deg,var(--fg) 0 50%,var(--bg) 50%)}

.cal{border:1.5px solid var(--edge);border-top:0}
.cal-head{display:flex;align-items:baseline;justify-content:space-between;padding:11px}
.cal-head b{font-size:16px;font-weight:800;font-stretch:112%;text-transform:uppercase;letter-spacing:-.02em}
.cal-head span{font-family:var(--mn);font-size:9.5px;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--edge)}
.dow{font-family:var(--mn);font-size:9px;color:var(--mute);text-align:center;padding:5px 0;border-right:1px solid var(--edge);border-bottom:1px solid var(--edge)}
.dow:nth-child(7n){border-right:0}
.cell{aspect-ratio:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-family:var(--mn);font-size:11.5px;color:var(--mute);border-right:1px solid var(--edge);border-bottom:1px solid var(--edge);background:var(--bg);position:relative}
.cell:nth-child(7n){border-right:0}
.cell.trip{color:var(--fg)}
.cell.out{color:color-mix(in srgb,var(--mute) 42%,var(--bg))}
.cell.past{color:color-mix(in srgb,var(--mute) 78%,var(--bg))}
.cell.past .flag{opacity:.3}
.cell .flag{width:13px;height:8px}
.cell.out .flag{visibility:hidden}
.cell.sel{background:var(--fg);color:var(--bg);font-weight:700}
.cell.past.sel{background:var(--mute);color:var(--bg)}
.cell.past.sel .flag{opacity:1}
.cell.dot::after{content:"";position:absolute;width:4px;height:4px;background:currentColor;border-radius:50%;top:4px;right:5px}
.cell.now{box-shadow:inset 0 0 0 2px var(--fg)}
.legend{display:flex;flex-wrap:wrap;gap:6px 11px;padding:10px 11px;border-top:1px solid var(--edge)}
.legend span{display:flex;align-items:center;gap:5px;font-family:var(--mn);font-size:9.5px;color:var(--mute)}
.legend i{width:13px;height:8px;display:block}

.nav{display:flex;align-items:center;gap:8px;border:1.5px solid var(--edge);border-top:0;padding:8px}
.nav .arw{width:34px;height:34px;flex:0 0 auto;font-size:14px;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--edge);border-radius:50%}
.nav .arw:disabled{opacity:.28}
#datebtn{flex:1 1 auto;text-align:center;padding:4px 2px}
#datebtn b{display:block;font-size:17px;font-weight:800;font-stretch:112%;text-transform:uppercase;letter-spacing:-.025em;line-height:1.1}
#datebtn span{display:block;font-family:var(--mn);font-size:9px;color:var(--mute);letter-spacing:.1em;margin-top:2px}
#datebtn u{text-decoration:none;color:var(--p2)}
.past-day{opacity:.52}



.place{border:1.5px solid var(--edge);border-top:0;padding:12px}
.place .top{display:flex;align-items:center;gap:9px}
.place .flag{width:26px;height:17px;flex:0 0 auto}
.place h2{flex:1 1 auto;min-width:0;line-height:1;color:var(--p1)}
.place .n{font-family:var(--mn);font-size:9.5px;color:var(--mute);white-space:nowrap;text-transform:uppercase}
.hotel{font-size:22px;font-weight:800;font-stretch:122%;text-transform:uppercase;letter-spacing:-.035em;line-height:1;color:var(--fg);margin-top:9px}
.place h2{font-size:19px;font-weight:800;font-stretch:122%;text-transform:uppercase;letter-spacing:-.03em}
.place .top .flags{display:flex;align-items:center;gap:5px;flex:0 0 auto}
.place .top .flags em{font-style:normal;font-family:var(--mn);font-size:10px;color:var(--mute)}


.hero,.card,.plans{border:1.5px solid var(--edge);border-top:0;padding:12px}
#screen>div>div:first-child{border-top:1.5px solid var(--edge)}
.hd{display:flex;align-items:center;gap:9px}
.hd .lbl{color:var(--p2);white-space:nowrap}
.hd .rule{flex:1 1 auto;height:1.5px;background:var(--edge)}
.hd .n{font-family:var(--mn);font-size:9.5px;color:var(--mute);white-space:nowrap}

.leg{display:flex;align-items:flex-end;gap:8px;margin-top:11px}
.leg b{display:block;font-size:27px;font-weight:800;font-stretch:122%;line-height:.85;letter-spacing:-.04em}
.leg a{text-decoration:none;display:block}
.leg a b{color:var(--ac)}
.leg .t{display:block;font-family:var(--mn);font-size:13px;font-weight:700;margin-top:5px}
.leg em{display:block;font-style:normal;font-family:var(--mn);font-size:9.5px;color:var(--mute);margin-top:2px;text-transform:uppercase}
.leg .to{text-align:right;margin-left:auto}
.leg .mid{flex:1 1 auto;padding-bottom:6px;text-align:center;min-width:60px}
.leg .mid .air{display:block;font-family:var(--mn);font-size:9.5px;color:var(--fg);margin-bottom:5px;line-height:1.3}
.leg .mid i{display:block;height:1.5px;background:var(--edge)}
.leg .mid .dur{display:block;font-family:var(--mn);font-size:9px;color:var(--mute);margin-top:5px;line-height:1.3}
.plus{display:inline!important;margin:0!important;font-size:10px!important;background:var(--p2);color:#12150F!important;padding:0 3px}

.title{font-size:19px;font-weight:800;font-stretch:118%;text-transform:uppercase;letter-spacing:-.03em;line-height:1;margin-top:9px}
.sub{font-family:var(--mn);font-size:10.5px;color:var(--mute);margin-top:5px;text-transform:uppercase}

.codes{display:flex;flex-wrap:wrap;gap:5px;margin-top:11px}
.code{border:1.5px solid var(--edge);padding:6px 9px;background:transparent}
.code .l{display:block;font-family:var(--mn);font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.code .v{display:block;font-family:var(--mn);font-size:14px;font-weight:700;margin-top:1px}
.code.info{border-color:var(--mute)}
.code.info .v{font-size:12.5px;font-weight:400}
.code.done{background:var(--p1);border-color:var(--p1);color:#12150F}
.code.done .l{color:rgba(0,0,0,.55)}




.low{display:flex;align-items:center;gap:7px;margin-top:10px;padding-top:10px;border-top:1px solid var(--edge)}
.low .who{flex:1 1 auto;min-width:0;font-family:var(--mn);font-size:11px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ico{width:34px;height:34px;flex:0 0 auto;border:1.5px solid var(--edge);border-radius:50%;display:flex;align-items:center;justify-content:center}
.ico svg{width:15px;height:15px;stroke:var(--fg);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg.mini{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-2px;margin-right:4px}
.leave{font-family:var(--mn);font-size:10px;color:var(--mute);text-transform:uppercase;letter-spacing:.08em;padding-bottom:9px;margin-bottom:10px;border-bottom:1px solid var(--edge)}
.leave b{color:var(--fg);font-weight:700}
.checkin{font-family:var(--mn);font-size:11px;color:var(--fg);margin-top:8px;letter-spacing:.06em}
.xfer{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.xfer span{font-family:var(--mn);font-size:10.5px;color:var(--fg);border:1.5px solid var(--mute);padding:5px 8px;display:inline-flex;align-items:center}
.xfer .src{border:0;color:var(--mute);padding-left:0}
.place h2 i{font-style:normal;color:var(--mute);font-weight:400;font-family:var(--mn);font-size:12px;text-transform:none;letter-spacing:.06em}
.notes{margin-top:11px;padding-top:10px;border-top:1px solid var(--edge);font-family:var(--mn);font-size:10.5px;color:var(--mute);line-height:1.6}
.notes p+p{margin-top:2px}

.plans .add{width:24px;height:24px;flex:0 0 auto;border:1.5px solid var(--p2);border-radius:50%;color:var(--p2);display:flex;align-items:center;justify-content:center;font-size:15px;line-height:1;padding-bottom:2px}
.plan{display:flex;gap:9px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--edge);width:100%}
.plan:last-of-type{border-bottom:0}
.plan .when{font-family:var(--mn);font-size:10px;color:var(--p2);width:44px;flex:0 0 auto;padding-top:2px;line-height:1.35}
.plan .what{flex:1 1 auto;min-width:0}
.plan .what b{display:block;font-size:15px;font-weight:800;font-stretch:112%;text-transform:uppercase;letter-spacing:-.02em;line-height:1.15}
.plan .what span{display:block;font-family:var(--mn);font-size:10.5px;color:var(--mute);margin-top:2px;line-height:1.5}
.plan .edit{flex:0 0 auto;font-family:var(--mn);font-size:8.5px;color:var(--mute);letter-spacing:.1em;padding-top:4px}
.empty{font-family:var(--mn);font-size:10.5px;color:var(--mute);padding:11px 0 2px}

.form{margin-top:11px;padding-top:11px;border-top:1.5px solid var(--edge);display:flex;flex-direction:column;gap:10px}
.fld .k{display:block;font-family:var(--mn);font-size:9px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--p2);margin-bottom:4px}
.fld .two{display:flex;align-items:center;gap:7px}
.fld .two span{font-family:var(--mn);font-size:11px;color:var(--mute)}
.form .save{background:var(--p2);color:#12150F;padding:12px;font-weight:800;font-stretch:112%;text-transform:uppercase;text-align:center;letter-spacing:.04em}
.form .row2{display:flex;gap:7px}
.form .cancel,.form .kill{flex:1 1 auto;padding:9px;text-align:center;font-family:var(--mn);font-size:10px;color:var(--mute);text-transform:uppercase;letter-spacing:.08em;border:1.5px solid var(--edge)}
.form .kill{color:#FF6B60;border-color:#FF6B60}

.foot{display:flex;justify-content:space-between;gap:10px;padding:11px 2px;font-family:var(--mn);font-size:9px;color:var(--mute);letter-spacing:.06em}
.foot button{font-family:var(--mn);font-size:9px;color:var(--mute);text-decoration:underline;letter-spacing:.06em}

#toast{position:fixed;left:50%;bottom:18px;transform:translate(-50%,12px);background:var(--fg);color:var(--bg);font-family:var(--mn);font-size:11px;font-weight:700;padding:10px 15px;opacity:0;pointer-events:none;transition:opacity .14s,transform .14s;z-index:10;text-transform:uppercase}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:no-preference){
  #screen{animation:snap .16s ease}
  @keyframes snap{from{opacity:0;transform:translateY(4px)}}
}
</style>
</head>
<body>

<div id="lock" class="phone" style="display:none">
  <p class="lock-mark">Europe<br>2026</p>
  <p class="lock-sub">Locked. Everything here is encrypted until you type the passphrase.</p>
  <div class="lock-form">
    <input id="pass" type="password" placeholder="PASSPHRASE" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false">
    <button id="unlock">Unlock</button>
    <p class="lock-msg" id="lockmsg"></p>
  </div>
</div>

<div id="app" class="phone"></div>
<div id="toast"></div>

<script>
const KEY="eu26.pass",PKEY="eu26.plans",$=(s)=>document.querySelector(s);
const MONTH=["January","February","March","April","May","June","July","August","September","October","November","December"];
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const KINDS=["Breakfast","Lunch","Dinner","Coffee","Drinks","Dancing","Tour","Beach","Show","Museum","Shopping","Other"];

const d=(s)=>{const[y,m,x]=s.split("-").map(Number);return new Date(y,m-1,x)};
const iso=(t)=>`${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}-${String(t.getDate()).padStart(2,"0")}`;
const esc=(s)=>String(s).replace(/[&<>"]/g,(c)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nights=(a,b)=>Math.round((d(b)-d(a))/864e5);

const PIN=`<svg viewBox="0 0 24 24"><path d="M12 21s7-5.5 7-11a7 7 0 1 0-14 0c0 5.5 7 11 7 11Z"/><circle cx="12" cy="10" r="2.5"/></svg>`;
const TEL=`<svg viewBox="0 0 24 24"><path d="M5 3h4l2 5-2.5 1.5a12 12 0 0 0 6 6L16 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 5a2 2 0 0 1 2-2Z"/></svg>`;
const SEAT=`<svg class="mini" viewBox="0 0 24 24"><path d="M7 4v9a3 3 0 0 0 3 3h7"/><path d="M17 16v4"/><path d="M4 20h13"/><path d="M7 8h4"/></svg>`;
const CAR=`<svg class="mini" viewBox="0 0 24 24"><path d="M4 15v-3l2-5h12l2 5v3"/><path d="M3 15h18v3H3z"/><circle cx="7.5" cy="18.5" r="1.5"/><circle cx="16.5" cy="18.5" r="1.5"/></svg>`;
const RAIL=`<svg class="mini" viewBox="0 0 24 24"><rect x="6" y="3" width="12" height="13" rx="2"/><path d="M6 10h12"/><path d="M9 20l-2 2M15 20l2 2"/><circle cx="9.5" cy="13" r=".8"/><circle cx="14.5" cy="13" r=".8"/></svg>`;

const b64=(s)=>Uint8Array.from(atob(s),(c)=>c.charCodeAt(0));
const tob64=(b)=>btoa(String.fromCharCode(...new Uint8Array(b)));
let CKEY=null;
async function decrypt(blob,pass){
  const bk=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]);
  const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(blob.salt),iterations:blob.iterations||250000,hash:"SHA-256"},bk,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
  const out=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(blob.iv)},k,b64(blob.data))));
  CKEY=k; return out;
}
async function seal(obj){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  return tob64(iv)+"."+tob64(await crypto.subtle.encrypt({name:"AES-GCM",iv},CKEY,new TextEncoder().encode(JSON.stringify(obj))));
}
async function open_(str){
  const [iv,ct]=str.split(".");
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(iv)},CKEY,b64(ct))));
}

let blob=null,TRIP=null,DAYS=[],cur=0,view="day",editing=null,PLANS={},SYNC=null,STATUS="local",PORT={},CITY={};

const loadPlans=()=>{try{PLANS=JSON.parse(localStorage.getItem(PKEY)||"{}")}catch{PLANS={}}};
const savePlans=()=>{try{localStorage.setItem(PKEY,JSON.stringify(PLANS))}catch{toast("Can't save plans here")}};

const api=(path,opts={})=>fetch(SYNC.url+"/rest/v1/"+path,{...opts,headers:{apikey:SYNC.key,Authorization:"Bearer "+SYNC.key,"Content-Type":"application/json",...(opts.headers||{})}});

async function pull(){
  if(!SYNC)return;
  try{
    const r=await api("plans?select=day,payload");
    if(!r.ok)throw 0;
    for(const row of await r.json()){
      try{ const l=await open_(row.payload); if(l&&l.length)PLANS[row.day]=l; else delete PLANS[row.day]; }catch{}
    }
    savePlans(); STATUS="synced";
  }catch{ STATUS="offline"; }
  paintStatus();
}
async function push(day){
  if(!SYNC){STATUS="local";paintStatus();return;}
  try{
    const r=await api("plans",{method:"POST",headers:{Prefer:"resolution=merge-duplicates"},body:JSON.stringify({day,payload:await seal(PLANS[day]||[]),updated_at:new Date().toISOString()})});
    if(!r.ok)throw 0;
    STATUS="synced";
  }catch{ STATUS="pending"; }
  paintStatus();
}
function paintStatus(){
  const el=$("#sync"); if(!el)return;
  el.textContent={synced:"SYNCED",offline:"OFFLINE",pending:"NOT SAVED",local:"THIS PHONE ONLY"}[STATUS]||"";
}

async function boot(){
  try{ blob=await(await fetch("trip.enc.json",{cache:"no-store"})).json(); }
  catch{ $("#lockmsg").textContent="Can't load trip.enc.json"; return; }
  let saved=null; try{saved=localStorage.getItem(KEY)}catch{}
  if(saved){ try{ start(await decrypt(blob,saved)); return; }catch{ try{localStorage.removeItem(KEY)}catch{} } }
  if($("#pass"))$("#pass").focus();
}
async function attempt(){
  const p=$("#pass").value; if(!p)return;
  const b=$("#unlock"); b.disabled=true; b.textContent="Unlocking"; $("#lockmsg").textContent="";
  try{ const t=await decrypt(blob,p); try{localStorage.setItem(KEY,p)}catch{} start(t); }
  catch{ $("#lockmsg").textContent="WRONG PASSPHRASE"; $("#pass").select(); }
  finally{ b.disabled=false; b.textContent="Unlock"; }
}
if($("#unlock"))$("#unlock").addEventListener("click",attempt);
if($("#pass"))$("#pass").addEventListener("keydown",(e)=>{if(e.key==="Enter")attempt()});

function build(trip){
  const out=[];
  const home=trip.meta.home||{city:"Home",country:"",flag:"xx",pop:"#4A6CF7"};
  for(let t=d(trip.meta.start);iso(t)<=trip.meta.end;t.setDate(t.getDate()+1)){
    const date=iso(t);
    const flights=trip.flights.filter((f)=>f.date===date);
    const stay=trip.stays.find((s)=>s.checkIn<=date&&date<s.checkOut);
    const arriving=trip.stays.filter((s)=>s.checkIn===date);
    const leaving=trip.stays.filter((s)=>s.checkOut===date&&s.checkOutTime);
    const src=stay||arriving[0]||null;
    out.push({date,flights,stay,arriving,leaving,
      city:src?src.city:home.city,country:src?src.country:home.country,
      flag:src?src.flag:home.flag,p1:src?src.pop1:home.pop,p2:src?src.pop2:home.pop});
  }
  return out;
}

function start(trip){
  TRIP=trip; DAYS=build(trip); loadPlans();
  PORT={}; CITY={};
  trip.stays.forEach((s)=>{if(s.arrCode){PORT[s.arrCode]=s.pop1;CITY[s.arrCode]={name:s.city,flag:s.flag}}});
  if(trip.meta.home&&trip.meta.home.code){PORT[trip.meta.home.code]=trip.meta.home.pop;CITY[trip.meta.home.code]={name:trip.meta.home.city,flag:trip.meta.home.flag}}
  if($("#lock"))$("#lock").style.display="none";
  $("#app").classList.add("on");
  const today=iso(new Date());
  const i=DAYS.findIndex((x)=>x.date===today);
  cur=i>=0?i:(today>TRIP.meta.end?DAYS.length-1:0);
  $("#app").innerHTML=`
    <div class="mast"><b>Europe 2026</b>
      <span class="grp">${countdown()}<button id="invert" aria-label="Invert colours"></button></span></div>
    <div id="screen"></div>
    <div class="foot"><span id="sync">…</span><button id="forget">LOCK THIS DEVICE</button></div>`;
  $("#forget").addEventListener("click",()=>{try{localStorage.removeItem(KEY)}catch{};location.reload()});
  $("#invert").addEventListener("click",()=>{
    const on=document.body.classList.toggle("light");
    try{localStorage.setItem("eu26.light",on?"1":"0")}catch{}
    document.querySelector('meta[name=theme-color]').setAttribute("content",on?"#F0E9D8":"#12150F");
  });
  document.addEventListener("keydown",(e)=>{
    if(view!=="day"||editing!==null)return;
    if(e.key==="ArrowLeft")go(cur-1);
    if(e.key==="ArrowRight")go(cur+1);
  });
  draw();
  SYNC=trip.sync&&trip.sync.url?trip.sync:null;
  STATUS=SYNC?"offline":"local"; paintStatus();
  if(SYNC){ pull().then(draw); document.addEventListener("visibilitychange",()=>{if(!document.hidden)pull().then(draw)}); }
}

function countdown(){
  const today=iso(new Date()), s=TRIP.meta.start, e=TRIP.meta.end;
  const days=(a,b)=>Math.round((d(b)-d(a))/864e5);
  if(today<s){ const n=days(today,s); return n===1?"1 DAY UNTIL THE TRIP":`${n} DAYS UNTIL THE TRIP`; }
  if(today>e) return "THAT WAS EUROPE";
  const n=days(today,e);
  return n===0?"LAST DAY":n===1?"1 DAY REMAINING":`${n} DAYS REMAINING`;
}

function go(i){
  if(i<0||i>=DAYS.length)return;
  cur=i; editing=null; view="day";
  history.replaceState(null,"","#d="+DAYS[cur].date);
  draw();
}
function draw(){ view==="cal"?drawCal():drawDay(); }

function drawCal(){
  const first=d(TRIP.meta.start),y=first.getFullYear(),m=first.getMonth();
  const lead=new Date(y,m,1).getDay(),len=new Date(y,m+1,0).getDate(),today=iso(new Date());
  let cells="";
  for(let i=0;i<lead;i++) cells+=`<div class="cell out"><span></span><span class="flag"></span></div>`;
  for(let n=1;n<=len;n++){
    const date=iso(new Date(y,m,n)),day=DAYS.find((x)=>x.date===date),cls=["cell"];
    if(day){cls.push("trip"); if(date<today)cls.push("past"); if((PLANS[date]||[]).length)cls.push("dot");} else cls.push("out");
    if(day&&DAYS[cur].date===date)cls.push("sel");
    if(date===today)cls.push("now");
    cells+=`<button class="${cls.join(" ")}" ${day?`data-go="${DAYS.indexOf(day)}"`:"disabled"} aria-label="${esc(date)}"><span>${n}</span><span class="flag ${day?day.flag:""}"></span></button>`;
  }
  const seen=[]; TRIP.stays.forEach((s)=>{if(!seen.some((x)=>x.city===s.city))seen.push(s)});
  $("#screen").innerHTML=`<div class="cal">
    <div class="cal-head"><b>${MONTH[m]} ${y}</b><span>TAP A DAY</span></div>
    <div class="grid">${DOW.map((x)=>`<div class="dow">${x[0]}</div>`).join("")}${cells}</div>
    <div class="legend">${seen.map((s)=>`<span><i class="flag ${s.flag}"></i>${esc(s.city)}</span>`).join("")}</div>
  </div>`;
  $("#screen").querySelectorAll("[data-go]").forEach((b)=>b.addEventListener("click",()=>go(+b.dataset.go)));
}

function drawDay(){
  const x=DAYS[cur],t=d(x.date);
  let html="";
  if(x.flights.length){
    x.flights.forEach((f)=>{html+=flightHero(f)});
    if(x.arriving.length) html+=placeCard(x);
  }else{
    html+=placeCard(x);
  }
  html+=plansBlock(x);

  $("#screen").innerHTML=`
    <div class="nav" style="--p1:${x.p1};--p2:${x.p2}">
      <button class="arw" id="prev" ${cur===0?"disabled":""} aria-label="Previous day">&larr;</button>
      <button id="datebtn"><b>${DOW[t.getDay()]} ${t.getDate()} ${MON[t.getMonth()]}</b><span>${x.date<iso(new Date())?"DONE &middot; ":""}DAY ${cur+1} / ${DAYS.length} &middot; <u>CALENDAR</u></span></button>
      <button class="arw" id="next" ${cur===DAYS.length-1?"disabled":""} aria-label="Next day">&rarr;</button>
    </div>
    <div class="${x.date<iso(new Date())?"past-day":""}" style="--p1:${x.p1};--p2:${x.p2}">${html}</div>`;

  $("#prev").addEventListener("click",()=>go(cur-1));
  $("#next").addEventListener("click",()=>go(cur+1));
  $("#datebtn").addEventListener("click",()=>{view="cal";draw()});
  wirePlans(x);
  $("#screen").querySelectorAll(".code[data-copy]").forEach((el)=>el.addEventListener("click",async()=>{
    try{
      await navigator.clipboard.writeText(el.dataset.copy);
      el.classList.add("done"); toast("Copied "+el.dataset.copy);
      setTimeout(()=>el.classList.remove("done"),600);
    }catch{ toast("Long-press to select"); }
  }));
}



const port=(code)=>`<a href="https://maps.google.com/?q=${encodeURIComponent(code+" airport")}" target="_blank" rel="noopener" style="--ac:${PORT[code]||"var(--fg)"}"><b>${esc(code)}</b></a>`;

function flightHero(f){
  const seats=f.seats&&f.seats.length
    ? f.seats.map((s)=>`<span class="code info"><span class="l">${SEAT}${esc(s.who)}</span><span class="v">${esc(s.seat)}</span></span>`).join("")
    : `<span class="code info"><span class="l">${SEAT}Seats</span><span class="v">TBD</span></span>`;
  return `<div class="hero">
    <div class="hd"><span class="lbl">Flight</span><span class="rule"></span></div>
    <div class="leg">
      <div>${port(f.from.code)}<span class="t">${esc(f.from.time)}</span><em>${esc(f.from.terminal||f.from.city)}</em></div>
      <div class="mid">
        <span class="air">${esc(f.airline)}<br>${esc(f.number)}</span>
        <i></i>
        <span class="dur">${esc(f.duration)}${f.stop?"<br>"+esc(f.stop):""}</span>
      </div>
      <div class="to">${port(f.to.code)}<span class="t">${esc(f.to.time)}${f.to.arrivesNextDay?` <em class="plus" style="background:${PORT[f.to.code]||"var(--p2)"}">+1</em>`:""}</span><em>${esc(f.to.city)}</em></div>
    </div>
    ${codes(f.codes)}
    <div class="codes">${seats}</div>
    ${notes(f.notes)}
  </div>`;
}

function byeLine(x){
  const s=x.arriving[0]||x.stay;
  const out=x.leaving.find((l)=>!s||l.name!==s.name);
  return out?`<p class="leave">Check out <b>${esc(out.name)}</b> by <b>${esc(out.checkOutTime)}</b></p>`:"";
}

function stayBody(s,arriving){
  const t=s.transfer;
  if(s.pending||s.informal) return `<p class="hotel">${esc(s.name)}</p><p class="sub">${esc(s.kind)}</p>`;
  return `<p class="hotel">${esc(s.name)}</p>
    ${arriving?`<p class="sub">${esc(s.room)}</p>
      <p class="checkin">Check in ${esc(s.checkInTime||"15:00")}</p>
      ${t?`<div class="xfer"><span class="src">from ${esc(t.from)}</span><span>${CAR}${esc(t.car)}</span><span>${RAIL}${esc(t.transit)} ${esc(t.transitKind)}</span></div>`:""}
      ${codes(s.codes)}`:""}
    <div class="low">
      <span class="who">${esc(s.address||"")}</span>
      ${s.address?`<a class="ico" href="https://maps.google.com/?q=${encodeURIComponent(s.name+", "+s.address)}" target="_blank" rel="noopener" aria-label="Open in Maps">${PIN}</a>`:""}
      ${s.phone?`<a class="ico" href="tel:${esc(s.phone)}" aria-label="Call">${TEL}</a>`:""}
    </div>`;
}

function placeCard(x){
  const arriving=!!x.arriving.length;
  const s=x.arriving[0]||x.stay;
  if(!s) return `<div class="place">${byeLine(x)}<div class="top"><span class="flag ${x.flag}"></span><h2>${esc(x.city)}</h2><span class="n">${esc(x.country)}</span></div></div>`;
  const tot=nights(s.checkIn,s.checkOut),n=arriving?1:nights(s.checkIn,x.date)+1;
  return `<div class="place">${byeLine(x)}
    <div class="top"><span class="flag ${s.flag}"></span><h2>${esc(s.city)}</h2><span class="n">Night ${n} / ${tot}</span></div>
    ${stayBody(s,arriving)}</div>`;
}

function planTime(p){
  if(!p.time)return "&mdash;";
  return p.end?`${esc(p.time)}<br>${esc(p.end)}`:esc(p.time);
}

function plansBlock(x){
  const list=PLANS[x.date]||[];
  const rows=list.length?list.map((p,i)=>`
    <button class="plan" data-edit="${i}">
      <span class="when">${planTime(p)}</span>
      <span class="what">
        <b>${esc(p.kind)}</b>
        <span>${p.where?esc(p.where):""}${p.where&&p.who?"<br>":""}${p.who?"with "+esc(p.who):""}</span>
      </span>
      <span class="edit">EDIT</span>
    </button>`).join("")
    : `<p class="empty">Nothing planned. Tap + to add.</p>`;

  let form="";
  if(editing!==null){
    const p=editing==="new"?{kind:"Dinner",time:"",end:"",where:"",who:""}:list[editing];
    form=`
    <div class="form">
      <div class="fld"><span class="k">What</span>
        <select id="f-kind" autocomplete="off">${KINDS.map((k)=>`<option${k===p.kind?" selected":""}>${k}</option>`).join("")}</select></div>
      <div class="fld"><span class="k">When</span>
        <div class="two">
          <input id="f-time" type="time" value="${esc(p.time||"")}" autocomplete="off">
          <span>to</span>
          <input id="f-end" type="time" value="${esc(p.end||"")}" autocomplete="off">
        </div></div>
      <div class="fld"><span class="k">Where</span>
        <input id="f-where" value="${esc(p.where||"")}" placeholder="Place" autocomplete="off" autocorrect="off" spellcheck="false"></div>
      <div class="fld"><span class="k">Who</span>
        <input id="f-who" value="${esc(p.who||"")}" placeholder="Optional" autocomplete="off" autocorrect="off" spellcheck="false"></div>
      <button class="save" id="f-save">${editing==="new"?"Add plan":"Save changes"}</button>
      <div class="row2">
        <button class="cancel" id="f-cancel">Cancel</button>
        ${editing==="new"?"":'<button class="kill" id="f-kill">Delete</button>'}
      </div>
    </div>`;
  }

  return `<div class="plans">
    <div class="hd"><span class="lbl">Plans</span><span class="rule"></span><button class="add" id="p-add" aria-label="Add a plan">+</button></div>
    ${rows}${form}
  </div>`;
}

function wirePlans(x){
  const add=$("#p-add");
  if(add) add.addEventListener("click",()=>{editing=editing==="new"?null:"new";drawDay()});
  $("#screen").querySelectorAll("[data-edit]").forEach((b)=>b.addEventListener("click",()=>{
    editing=editing===+b.dataset.edit?null:+b.dataset.edit; drawDay();
  }));
  const cancel=$("#f-cancel");
  if(cancel) cancel.addEventListener("click",()=>{editing=null;drawDay()});
  const kill=$("#f-kill");
  if(kill) kill.addEventListener("click",()=>{
    PLANS[x.date].splice(editing,1);
    if(!PLANS[x.date].length)delete PLANS[x.date];
    savePlans(); editing=null; drawDay(); push(x.date); toast("Deleted");
  });
  const save=$("#f-save");
  if(save) save.addEventListener("click",()=>{
    const p={kind:$("#f-kind").value,time:$("#f-time").value,end:$("#f-end").value,where:$("#f-where").value.trim(),who:$("#f-who").value.trim()};
    if(!p.where&&!p.time){ toast("Add a time or a place"); return; }
    const list=PLANS[x.date]=PLANS[x.date]||[];
    if(editing==="new")list.push(p); else list[editing]=p;
    list.sort((a,b)=>(a.time||"99").localeCompare(b.time||"99"));
    savePlans(); editing=null; drawDay(); push(x.date); toast("Saved");
  });
}

const codes=(l)=>!l?"":`<div class="codes">${l.map((c)=>
  `<button class="code" data-copy="${esc(c.value)}"><span class="l">${esc(c.label)}</span><span class="v">${esc(c.value)}</span></button>`).join("")}</div>`;
const notes=(l)=>!l||!l.length?"":`<div class="notes">${l.map((n)=>`<p>${esc(n)}</p>`).join("")}</div>`;
