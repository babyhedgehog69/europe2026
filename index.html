<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Europe 2026</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#12150F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Europe 2026">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Cormorant+Garamond:ital,wght@1,300;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   EUROPE 2026  ·  v1.0
   ------------------------------------------------------------
   1  tokens          8  panels
   2  reset + base    9  cards
   3  primitives     10  rows
   4  lock           11  plans
   5  chrome         12  picker
   6  calendar       13  editor
   7  day nav        14  places
                     15  map + travel
   ============================================================ */

/* 1 ── TOKENS ─────────────────────────────────────────────── */
:root{
  /* colour: ink for all type, borders, controls.
     fill for the one primary action in a view.
     accent for identity only. red only inside a swipe drawer. */
  --bg:#12150F; --fg:#F0E9D8; --mute:#8A8878; --wash:#1C201A; --edge:#F0E9D8;
  --p1:#F0E9D8; --p2:#F0E9D8;
  --red:#FF6B60; --red-fill:#C8402F;
  --rule:color-mix(in srgb,var(--edge) 34%,transparent);

  /* space: one scale, nothing between the steps */
  --s0:2px; --s1:4px; --s2:6px; --s3:8px; --s4:12px;
  --s5:16px; --s6:20px; --s7:24px; --s8:32px;
  --pad:16px; --lead:32px; --gap:12px;

  /* line: 1.5 edge = structure. 1 rule = division between rows. */
  --edge-w:1.5px; --rule-w:1px;

  /* type */
  --dp:"Archivo",system-ui,sans-serif;
  --sr:"Cormorant Garamond",Georgia,serif;
  --mn:"Space Mono",ui-monospace,monospace;
  --t1:26px; --t2:22px; --t3:19px; --t4:17px; --t5:15px; --t6:13px; --t7:11.5px;
  --wide:112%; --wider:118%; --widest:122%;
  --tight:-.03em;   /* display tier: 26 / 22 */
  --snug:-.025em;   /* heading tier: 19 / 17 */
  --ls-lbl:.12em;   /* uppercase mono label */
  --ls-cap:.06em;   /* uppercase mono, running text */

  /* icons + hit targets: three sizes, nothing between */
  --ic-sm:16px; --ic-md:20px; --ic-lg:24px;
  --hit-sm:34px; --hit-md:40px; --hit-lg:44px;
  --stroke:1.8;

  /* swipe drawer: MUST match SA_W in the script */
  --sa-w:56px;
}
html.light,body.light{
  --bg:#F0E9D8; --fg:#16190F; --mute:#696758; --wash:#E4DBC6;
  --edge:#16190F; --p1:#16190F; --p2:#16190F;
}
/* the city colours are picked for a dark ground. on cream they vanish,
   so blend them toward the ink: same hue, readable at display size. */
body.light .mast b{color:color-mix(in srgb,var(--mc,var(--fg)) 55%,var(--fg))}
body.light .pnl>.ph .lbl.city{color:color-mix(in srgb,var(--p1) 55%,var(--fg))}
body.light .leg a b{color:color-mix(in srgb,var(--ac,var(--fg)) 55%,var(--fg))}

/* 2 ── RESET + BASE ───────────────────────────────────────── */
*{box-sizing:border-box;margin:0;padding:0}
/* both, so the canvas behind the body is painted too. a host that
   injects its own body background can no longer show through white. */
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{
  background:var(--bg);color:var(--fg);min-height:100dvh;
  font-family:var(--dp);font-size:var(--t4);line-height:1.5;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
}
a{color:inherit}
button,a{-webkit-tap-highlight-color:transparent}
button,a,input,select{touch-action:manipulation}
::selection{background:var(--fg);color:var(--bg)}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.phone{max-width:520px;margin:0 auto;padding:0 var(--pad) calc(var(--s8) + env(safe-area-inset-bottom))}

/* 3 ── PRIMITIVES ─────────────────────────────────────────── */
button{
  font:inherit;color:inherit;background:none;border:0;
  cursor:pointer;text-align:left;-webkit-user-select:none;user-select:none;
}
input,select,textarea{font-family:var(--mn);font-size:var(--t5)}
input,select{
  font:inherit;color:inherit;background:var(--wash);
  border:var(--edge-w) solid var(--edge);border-radius:0;
  padding:var(--s4);width:100%;
  font-family:var(--mn);font-size:var(--t4);
}
select{appearance:none}
input[type=time]{min-height:var(--hit-md)}

/* icons: one stroke weight, three sizes */
svg.i{
  width:var(--ic-md);height:var(--ic-md);display:block;
  stroke:currentColor;fill:none;stroke-width:var(--stroke);
  stroke-linecap:round;stroke-linejoin:round;
}
.pnl>.ph .meta svg,.rtype svg,.cat.near svg,.trav svg{width:var(--ic-sm);height:var(--ic-sm)}
.nav .arw svg{width:var(--ic-lg);height:var(--ic-lg)}

/* hit targets */
.mast .grp>*{width:var(--hit-sm);height:var(--hit-sm);flex:0 0 var(--hit-sm)}
.hbtn,.lk,.goq,.grip,.cback{
  width:var(--hit-md);height:var(--hit-md);flex:0 0 var(--hit-md);
}
.nav .arw,.ico{width:var(--hit-lg);height:var(--hit-lg);flex:0 0 var(--hit-lg)}

/* THE CIRCLE. every control in the app is one of these: same ring, same
   centring, three diameters off the hit scale. nothing is a square. */
.mast .grp>*,.hbtn,.nav .arw,.ico,.cback,.lk,.goq,.grip{
  border:var(--edge-w) solid var(--edge);border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  color:var(--fg);padding:0;text-decoration:none;line-height:1;
}
/* what sits inside a circle: an icon at one size, or type at one size */
.mast .grp>* svg.i{width:var(--ic-sm);height:var(--ic-sm)}
.mast .grp>*,.hbtn,.cback,.nav .arw{
  font-family:var(--mn);font-size:var(--t5);font-weight:400;
}
.lbl{
  font-family:var(--mn);font-size:var(--t6);font-weight:700;
  letter-spacing:var(--ls-lbl);text-transform:uppercase;
}

/* flags */
.flag{display:block;background:var(--fg);box-shadow:0 0 0 1px var(--mute)}
.flag.es{background:linear-gradient(#C60B1E 0 25%,#FFC400 25% 75%,#C60B1E 75%)}
.flag.de{background:linear-gradient(#0F0F0F 0 33.4%,#DD0000 33.4% 66.7%,#FFCE00 66.7%)}
.flag.ie{background:linear-gradient(90deg,#169B62 0 33.4%,#FFF 33.4% 66.7%,#FF883E 66.7%)}
.flag.se{background-color:#006AA7;background-image:linear-gradient(90deg,transparent 0 30%,#FECC00 30% 46%,transparent 46%),linear-gradient(0deg,transparent 0 38%,#FECC00 38% 62%,transparent 62%)}
.flag.us{background:linear-gradient(#3C3B6E,#3C3B6E) 0 0/40% 54% no-repeat,repeating-linear-gradient(#B22234 0 7.7%,#FFF 7.7% 15.4%)}
.flag.xx{background:repeating-linear-gradient(45deg,var(--fg) 0 4px,var(--bg) 4px 8px)}

/* the filled button: one per view */
#unlock,.bigadd,.form .save,.picker .save{
  width:100%;background:var(--fg);color:var(--bg);
  padding:var(--s5);text-align:center;
  font-weight:800;font-stretch:var(--wider);font-size:var(--t5);
  text-transform:uppercase;letter-spacing:var(--ls-cap);
}
/* the outline button */
.form .cancel,.form .kill,.picker .cancel{
  width:100%;padding:var(--s4);text-align:center;
  font-family:var(--mn);font-size:var(--t6);color:var(--mute);
  text-transform:uppercase;letter-spacing:var(--ls-cap);
  border:var(--edge-w) solid var(--edge);
}
.form .kill{color:var(--red);border-color:var(--red)}

/* 4 ── LOCK ───────────────────────────────────────────────── */
#lock{min-height:100dvh;display:flex;flex-direction:column;justify-content:center}
.lock-mark{
  font-family:var(--sr);font-style:italic;font-weight:300;
  font-size:clamp(52px,17vw,74px);line-height:.92;letter-spacing:-.01em;
}
.lock-sub{
  color:var(--mute);font-size:var(--t5);max-width:30ch;
  margin-top:var(--s4);padding-top:var(--s4);
  border-top:var(--edge-w) solid var(--edge);
}
.lock-form{margin-top:var(--s7);display:flex;flex-direction:column;gap:var(--s3)}
#pass{text-align:center;font-size:var(--t4)}
#unlock:disabled{opacity:.45}
.lock-msg{min-height:var(--s6);font-family:var(--mn);font-size:var(--t6);color:var(--red)}

/* 5 ── CHROME ─────────────────────────────────────────────── */
#app{display:none}
#app.on{display:block}

.mast{
  display:flex;align-items:center;justify-content:space-between;gap:var(--s3);
  padding:var(--s6) 0 var(--s4);border-bottom:var(--edge-w) solid var(--edge);
}
.mast b{
  flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-size:var(--t1);font-weight:800;font-stretch:var(--widest);
  letter-spacing:var(--tight);text-transform:uppercase;line-height:1;
  color:var(--mc,var(--fg));
}
.mast b.long{font-size:var(--t2)}
.mast .grp{
  flex:0 0 auto;display:flex;align-items:center;gap:var(--s2);line-height:1;
  font-family:var(--mn);font-size:var(--t6);color:var(--mute);
}
#home.off{opacity:.35;pointer-events:none}
#clk.on,#fx.on{background:var(--fg);color:var(--bg)}
#invert{background:linear-gradient(90deg,var(--fg) 0 50%,var(--bg) 50%)}

.fxpanel{border:var(--edge-w) solid var(--edge);border-top:0;padding:var(--s4) var(--pad)}
.fxrow{display:flex;align-items:center;gap:var(--s2)}
.fxrow input{flex:1 1 0;text-align:right;font-size:var(--t4);padding:var(--s3)}
.fxrow span{font-family:var(--mn);font-size:var(--t6);color:var(--mute);width:var(--hit-sm)}
.fxrate{
  font-family:var(--mn);font-size:var(--t6);color:var(--mute);
  margin-top:var(--s3);letter-spacing:var(--ls-cap);
}

.foot{
  display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;
  gap:var(--s3) var(--s3);padding:var(--s5) 0;
  font-family:var(--mn);font-size:var(--t6);
  color:var(--mute);letter-spacing:var(--ls-cap);
}
.foot .fmeta,.foot .fbtns{display:flex;align-items:center}
.foot .fmeta{gap:var(--s2)}
.foot .fbtns{gap:var(--s4)}
.foot button{
  font-family:var(--mn);font-size:var(--t6);color:var(--mute);
  letter-spacing:var(--ls-cap);
  padding:var(--s2) 0;margin:calc(var(--s2) * -1) 0;
}
.foot .fbtns button{text-decoration:underline}
.foot button.arm{
  color:var(--red);text-decoration:none;
  border:var(--edge-w) solid var(--red);padding:var(--s1) var(--s3);
}
#sync{white-space:nowrap}
#ver{opacity:.5;letter-spacing:var(--ls-cap)}

#toast{
  position:fixed;left:50%;bottom:var(--s5);transform:translate(-50%,var(--s4));
  background:var(--fg);color:var(--bg);
  font-family:var(--mn);font-size:var(--t6);font-weight:700;
  padding:var(--s3) var(--s5);text-transform:uppercase;
  opacity:0;pointer-events:none;z-index:10;
  transition:opacity .14s ease,transform .14s ease;
}
#toast.on{opacity:1;transform:translate(-50%,0)}

#screen{animation:snap .16s ease}
@keyframes snap{from{opacity:0;transform:translateY(4px)}}
@media (prefers-reduced-motion:reduce){
  #screen{animation:none}
  #toast{transition:none}
}

/* 6 ── CALENDAR ───────────────────────────────────────────── */
.cal{border:var(--edge-w) solid var(--edge);border-top:0}
.cal-head{display:flex;align-items:baseline;justify-content:space-between;padding:var(--s5) var(--pad)}
.cal-head b{font-size:var(--t4);font-weight:800;font-stretch:var(--wide);text-transform:uppercase;letter-spacing:var(--snug)}
.cal-head span{font-family:var(--mn);font-size:var(--t6);color:var(--mute)}

.grid{display:grid;grid-template-columns:repeat(7,1fr);border-top:var(--rule-w) solid var(--rule)}
.dow{
  font-family:var(--mn);font-size:var(--t7);color:var(--mute);text-align:center;
  padding:var(--s3) 0;border-right:var(--rule-w) solid var(--rule);border-bottom:var(--rule-w) solid var(--rule);
}
.dow:nth-child(7n),.cell:nth-child(7n){border-right:0}
/* the number owns the top, the temperature owns the bottom. they are laid
   out, not stacked, so they cannot crowd each other at any cell size. */
.cell{
  aspect-ratio:1/1;position:relative;background:transparent;
  padding:var(--s1) var(--s2);
  display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;
  border-right:var(--rule-w) solid var(--rule);border-bottom:var(--rule-w) solid var(--rule);
}
.cell.trip{background:color-mix(in srgb,var(--cc) 82%,var(--bg));color:var(--ink,var(--fg))}
.cell.trip.split{background:linear-gradient(135deg,color-mix(in srgb,var(--cc) 82%,var(--bg)) 0 50%,color-mix(in srgb,var(--cc2) 82%,var(--bg)) 50% 100%)}
.cell.past.trip{background:color-mix(in srgb,var(--cc) 32%,var(--bg));color:var(--ink,var(--fg));opacity:.72}
.cell.past.trip.split{background:linear-gradient(135deg,color-mix(in srgb,var(--cc) 32%,var(--bg)) 0 50%,color-mix(in srgb,var(--cc2) 32%,var(--bg)) 50% 100%)}
.cell.out{color:color-mix(in srgb,var(--mute) 42%,var(--bg))}
/* a travel day split against the neutral has a dark half and a light half.
   no single ink reads on both, so the temperature steps aside there. */
.cell.out .ctmp,.cell.neut.split .ctmp{display:none}
.cell.sel{box-shadow:inset 0 0 0 3px var(--fg)}
.cell.now::before{content:"";position:absolute;top:var(--s2);left:var(--s2);width:5px;height:5px;border-radius:50%;background:currentColor}
.cnum{font-family:var(--mn);font-size:var(--t5);line-height:1;opacity:.8}
.cell.trip .cnum{opacity:1}
.ctmp{
  font-style:normal;font-family:var(--dp);font-weight:800;font-stretch:var(--wide);
  font-size:var(--t6);line-height:1;letter-spacing:var(--snug);color:inherit;
}

.tabs{display:flex;border:var(--edge-w) solid var(--edge);border-top:0}
.tabs button{
  flex:1 1 0;padding:var(--s5);text-align:center;
  font-family:var(--mn);font-size:var(--t6);letter-spacing:var(--ls-lbl);
  text-transform:uppercase;color:var(--mute);
  border-right:var(--edge-w) solid var(--edge);
}
.tabs button:last-child{border-right:0}
.tabs button.on{background:var(--fg);color:var(--bg)}

.chips{display:flex;flex-wrap:wrap;gap:var(--s2);padding:var(--s4) var(--pad);border:var(--edge-w) solid var(--edge);border-top:0}
.chips button{
  display:flex;align-items:center;gap:var(--s2);
  font-family:var(--mn);font-size:var(--t6);text-transform:uppercase;
  letter-spacing:var(--ls-cap);color:var(--mute);
  border:var(--edge-w) solid var(--edge);padding:var(--s2) var(--s3);
}
.chips button.on{background:var(--fg);color:var(--bg)}
.chips .flag{width:var(--s5);height:var(--s3)}

.legend{
  display:flex;flex-wrap:wrap;justify-content:center;gap:var(--s3) var(--s5);
  padding:var(--s4) var(--pad);border-top:var(--rule-w) solid var(--rule);
}
.legend span{display:flex;align-items:center;gap:var(--s1);font-family:var(--mn);font-size:var(--t6);color:var(--mute)}
.legend i{display:block;flex:0 0 auto;width:var(--s5);height:5px;border-radius:2px}

/* 7 ── DAY NAV + WEATHER ──────────────────────────────────── */
.nav{border:var(--edge-w) solid var(--edge);border-top:0}
.navrow{display:flex;align-items:center;gap:var(--gap);padding:var(--s4) var(--pad)}
.nav .arw:disabled{opacity:.28}
#datebtn{flex:1 1 auto;min-width:0;text-align:center;padding:var(--s0) 0}
#datebtn b{display:block;font-size:var(--t3);font-weight:800;font-stretch:var(--wide);text-transform:uppercase;letter-spacing:var(--snug);line-height:1.1}
#datebtn span{display:block;font-family:var(--mn);font-size:var(--t6);color:var(--mute);letter-spacing:var(--ls-lbl);margin-top:var(--s0)}
#datebtn u{text-decoration:none;color:var(--fg)}
.past-day{opacity:.52}

.wxrow{padding:0 var(--pad) var(--s5)}
.wxrow2{display:flex;align-items:center;justify-content:center;gap:var(--s4);padding:var(--s1) 0 var(--s0)}
.tlo,.thi{flex:0 0 auto;font-size:var(--t2);font-weight:800;font-stretch:var(--widest);letter-spacing:var(--tight);line-height:1}
.tlo{color:var(--mute)}
.tbar{flex:0 0 104px;position:relative;height:5px;border-radius:3px;overflow:hidden;background:color-mix(in srgb,var(--mute) 28%,transparent)}
.tbar i{position:absolute;top:0;bottom:0;border-radius:2px;background:linear-gradient(90deg,#4FA3D1,#E8C64A,#E2703A)}
.wxload{font-family:var(--mn);font-size:var(--t6);color:var(--mute);letter-spacing:var(--ls-cap);text-transform:uppercase}

/* 8 ── PANELS ─────────────────────────────────────────────── */
.pnl{border:var(--edge-w) solid var(--edge);border-top:0}
#screen>div>div:first-child{border-top:var(--edge-w) solid var(--edge)}
.pnl>.ph{display:flex;align-items:center;gap:var(--s2);padding:var(--s4) var(--pad);width:100%;min-height:var(--hit-lg)}
.pnl.open>.ph{position:sticky;top:0;z-index:5;background:var(--bg);box-shadow:0 1px 0 var(--rule)}
.pnl>.ph .phmain{
  flex:1 1 auto;min-width:0;align-self:stretch;
  display:flex;align-items:center;gap:var(--gap);
  padding:var(--s4) 0;margin:calc(var(--s4) * -1) var(--s1) calc(var(--s4) * -1) 0;
}
.pnl>.ph .flag{flex:0 0 var(--lead);width:var(--lead);height:20px}
.pnl>.ph .lbl{
  flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-family:var(--dp);font-size:var(--t3);font-weight:800;font-stretch:var(--widest);
  letter-spacing:var(--tight);text-transform:uppercase;color:var(--fg);line-height:1;
}
.pnl>.ph .lbl.city{color:var(--p1)}
.pnl>.ph .meta{display:flex;align-items:center;font-family:var(--mn);font-size:var(--t6);color:var(--mute);white-space:nowrap}
.pnl>.pb{padding:0 var(--pad) var(--s5)}
.pnl.open>.pb{padding-top:0}

.hbtn{border-color:var(--mute);color:var(--mute)}
.hbtn.on{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.hbtn.off{opacity:.28;pointer-events:none}

/* 9 ── CARDS ──────────────────────────────────────────────── */
.leg{display:flex;align-items:flex-start;gap:var(--s3);margin-top:var(--s4)}
.leg a{display:block;text-decoration:none}
.leg b{display:block;font-size:var(--t1);font-weight:800;font-stretch:var(--widest);line-height:.85;letter-spacing:var(--tight)}
.leg a b{color:var(--ac)}
.leg .t{display:block;font-family:var(--mn);font-size:var(--t5);font-weight:700;margin-top:var(--s1)}
.leg .end{flex:1 1 0;min-width:0}
.leg .to{text-align:right}
.leg .mid{flex:1.5 1 0;min-width:0;padding-top:var(--s0);text-align:center}
.leg .mid i{display:block;height:var(--edge-w);background:var(--edge)}
.leg .mid .air{
  display:block;font-family:var(--mn);font-size:var(--t6);color:var(--fg);
  margin-bottom:var(--s2);line-height:1.3;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.leg .mid .dur{display:block;font-family:var(--mn);font-size:var(--t6);color:var(--mute);margin-top:var(--s1);line-height:1.3}
.plus{display:inline!important;margin:0!important;font-size:var(--t6)!important;background:var(--p2);color:#12150F!important;padding:0 3px}

.perf{border-top:var(--rule-w) dashed var(--rule);margin-top:var(--s5)}
.stubs{display:flex;gap:var(--s3);padding-top:var(--s4)}
.stub{flex:1 1 0;min-width:0}
.stub em{display:block;font-style:normal;font-family:var(--mn);font-size:var(--t7);letter-spacing:var(--ls-lbl);text-transform:uppercase;color:var(--mute)}
.stub b{display:block;font-family:var(--mn);font-size:var(--t6);margin-top:var(--s1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.codes{display:flex;flex-wrap:wrap;gap:var(--s2);margin-top:var(--s4)}
.code{border:var(--edge-w) solid var(--edge);padding:var(--s3) var(--s4);background:transparent}
.code .l{display:block;font-family:var(--mn);font-size:var(--t6);letter-spacing:var(--ls-lbl);text-transform:uppercase;color:var(--mute)}
.code .v{display:block;font-family:var(--mn);font-size:var(--t5);font-weight:700;margin-top:var(--s0)}

  return tob64(iv)+"."+tob64(await crypto.subtle.encrypt({name:"AES-GCM",iv},CKEY,new TextEncoder().encode(JSON.stringify(obj))));
}
async function open_(str){
  const [iv,ct]=str.split(".");
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(iv)},CKEY,b64(ct))));
}

function guessSec(url,name){
  let hay="";
  const m=(url||"").match(/!15s([^!?]+)/);
  if(m){ try{ const b=m[1].replace(/-/g,"+").replace(/_/g,"/"); hay=atob(b+"=".repeat((4-b.length%4)%4)); }catch{} }
  hay+=" "+(name||"");
  for(const [re,sec] of CATMAP) if(re.test(hay)) return sec;
  return "Food & Drink";
}

function parseSpot(text){
  text=(text||"").trim();
  const url=(text.match(/https?:\/\/\S+/)||[])[0]||"";
  let name="";
  const m=url.match(/\/maps\/place\/([^\/@?]+)/);
  if(m){ try{ name=decodeURIComponent(m[1].replace(/\+/g," ")); }catch{ name=m[1].replace(/\+/g," "); } }
  if(!name){
    const lines=text.split(/\n+/).map((l)=>l.trim()).filter((l)=>l&&!/^https?:/i.test(l));
    if(lines.length) name=lines[0];
  }
  name=name.replace(/\s*[·|]\s*[\d.]+\s*★.*$/,"").replace(/^["'“]|["'”]$/g,"").trim();
  let lat=null,lng=null;
  const c=url.match(/!3d(-?[\d.]+)!4d(-?[\d.]+)/)||url.match(/@(-?[\d.]+),(-?[\d.]+)/);
  if(c){ lat=parseFloat(c[1]); lng=parseFloat(c[2]); }
  return {name,url,lat,lng,sec:guessSec(url,name)};
}

const api=(path,opts={})=>fetch(SYNC.url+"/rest/v1/"+path,{...opts,headers:{apikey:SYNC.key,Authorization:"Bearer "+SYNC.key,"Content-Type":"application/json",...(opts.headers||{})}});

/* outbox: every edit is queued to disk before it goes to the wire.
   nothing leaves the queue until the server has taken it, so a failed
   push survives a reload, a dead signal, or the app being killed.      */
const OKEY="eu26.outbox";
let OUT=new Set();
try{ OUT=new Set(JSON.parse(localStorage.getItem(OKEY)||"[]")) }catch{}
const saveOut=()=>{try{localStorage.setItem(OKEY,JSON.stringify([...OUT]))}catch{}};
const payloadFor=(day)=>day.startsWith("spots:")?(SPOTS[day.slice(6)]||[]):(PLANS[day]||[]);

let flushing=null;
function flush(){
  if(!SYNC){ STATUS="local"; paintStatus(); return Promise.resolve(); }
  if(flushing) return flushing;
  if(!OUT.size){ STATUS="synced"; paintStatus(); return Promise.resolve(); }
  flushing=(async()=>{
    for(const day of [...OUT]){
      try{
        const r=await api("plans",{method:"POST",headers:{Prefer:"resolution=merge-duplicates"},
          body:JSON.stringify({day,payload:await seal(payloadFor(day)),updated_at:new Date().toISOString()})});
        if(!r.ok)throw 0;
        OUT.delete(day); saveOut();
      }catch{ break; }
    }
    STATUS=OUT.size?"pending":"synced"; paintStatus();
  })().finally(()=>{flushing=null});
  return flushing;
}

function push(day){
  OUT.add(day); saveOut();
  STATUS="pending"; paintStatus();
  return flush();
}

async function pull(){
  if(!SYNC)return;
  try{
    const r=await api("plans?select=day,payload");
    if(!r.ok)throw 0;
    for(const row of await r.json()){
      const k=row.day;
      if(OUT.has(k)) continue;              // unsent local edit wins
      try{
        const l=await open_(row.payload);
        if(k.startsWith("spots:")){ const c=k.slice(6); if(l&&l.length)SPOTS[c]=l; else delete SPOTS[c]; }
        else if(l&&l.length)PLANS[k]=l; else delete PLANS[k];
      }catch{}
    }
    savePlans(); saveSpots();
    STATUS=OUT.size?"pending":"synced";
  }catch{ STATUS=OUT.size?"pending":"offline"; }
  paintStatus();
}

function paintStatus(){
  const el=$("#sync"); if(!el)return;
  el.textContent=STATUS==="pending"?"NOT SYNCED \u00B7 "+OUT.size
    :{synced:"SYNCED",offline:"OFFLINE",local:"LOCAL ONLY"}[STATUS]||"";
}

function build(trip){
  const out=[];
  const home=trip.meta.home||{city:"Home",country:"",flag:"xx",pop:"#4A6CF7"};
  for(let t=d(trip.meta.start);iso(t)<=trip.meta.end;t.setDate(t.getDate()+1)){
    const date=iso(t);
    const flights=trip.flights.filter((f)=>f.date===date);
    const stay=trip.stays.find((s)=>s.checkIn<=date&&date<s.checkOut);
    const arriving=trip.stays.filter((s)=>s.checkIn===date);
    const leaving=trip.stays.filter((s)=>s.checkOut===date&&s.checkOutTime);
    const cars=(trip.cars||[]).map((c)=>{
      if(c.pickup&&c.pickup.date===date) return {...c,leg:"pickup"};
      if(c.dropoff&&c.dropoff.date===date) return {...c,leg:"dropoff"};
      return null;
    }).filter(Boolean);
    const src=stay||arriving[0]||null;
    out.push({date,flights,stay,arriving,leaving,cars,
      city:src?src.city:home.city,country:src?src.country:home.country,
      flag:src?src.flag:home.flag,p1:src?src.pop1:home.pop,p2:src?src.pop2:home.pop});
  }
  return out;
}

function countdown(){
  const today=iso(new Date()), s=TRIP.meta.start, e=TRIP.meta.end;
  const days=(a,b)=>Math.round((d(b)-d(a))/864e5);
  if(today<s){ const n=days(today,s); return n===1?"1 DAY UNTIL THE TRIP":`${n} DAYS UNTIL THE TRIP`; }
  if(today>e) return "THAT WAS EUROPE";
  const n=days(today,e);
  return n===0?"LAST DAY":n===1?"1 DAY REMAINING":`${n} DAYS REMAINING`;
}

async function loadCalWx(){
  if(wxdLoaded) return; wxdLoaded=true;
  const groups={};
  DAYS.forEach((x)=>{
    const g=geoFor(x); if(!g)return;
    const k=g.lat+","+g.lng;
    if(!groups[k]) groups[k]={lat:g.lat,lng:g.lng,from:x.date,to:x.date};
    if(x.date<groups[k].from)groups[k].from=x.date;
    if(x.date>groups[k].to)groups[k].to=x.date;
  });
  await Promise.all(Object.values(groups).map(async(g)=>{
    try{
      const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${g.lat}&longitude=${g.lng}`
        +`&daily=temperature_2m_max&timezone=auto&start_date=${g.from}&end_date=${g.to}`);
      if(!r.ok)return;
      const j=await r.json();
      (j.daily.time||[]).forEach((t,i)=>{
        const v=j.daily.temperature_2m_max[i];
        if(v!=null) WXD[t]=v;
      });
    }catch{}
  }));
  if(view==="cal"&&calTab==="cal") drawCal();
}

const hex2rgb=(h)=>{h=(h||"").trim().replace("#","");
  if(h.length===3) h=h.split("").map((c)=>c+c).join("");
  return [parseInt(h.slice(0,2),16)||0,parseInt(h.slice(2,4),16)||0,parseInt(h.slice(4,6),16)||0];};

const REL=(rgb)=>{
  const f=(v)=>{v/=255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4)};
  return 0.2126*f(rgb[0])+0.7152*f(rgb[1])+0.0722*f(rgb[2]);
};
const RATIO=(a,b)=>{const x=REL(a),y=REL(b);return (Math.max(x,y)+0.05)/(Math.min(x,y)+0.05)};
function inkOn(colors,pct){
  const bgv=getComputedStyle(document.body).getPropertyValue("--bg").trim();
  const bg=hex2rgb(bgv.startsWith("#")?bgv:"#12150F");
  const mix=colors.map((c)=>hex2rgb(c).map((v,i)=>v*pct+bg[i]*(1-pct)));
  const avg=[0,1,2].map((i)=>mix.reduce((a,m)=>a+m[i],0)/mix.length);
  const dark="#12150F", light="#F7F3E8";
  return RATIO(avg,hex2rgb(dark))>=RATIO(avg,hex2rgb(light))?dark:light;
}

/* one ink for the whole grid rather than one per tile: pick whichever reads
   better against the WORST city colour in the trip, so no single day can
   flip out of step with its neighbours over a rounding difference. days
   coloured with the neutral (travel) are the deliberate exception. */
function inkFor(palette,pct){
  const bgv=getComputedStyle(document.body).getPropertyValue("--bg").trim();
  const bg=hex2rgb(bgv.startsWith("#")?bgv:"#12150F");
  const dark=hex2rgb("#12150F"), light=hex2rgb("#F7F3E8");
  let wd=99, wl=99;
  palette.forEach((c)=>{
    const m=hex2rgb(c).map((v,i)=>v*pct+bg[i]*(1-pct));
    wd=Math.min(wd,RATIO(m,dark)); wl=Math.min(wl,RATIO(m,light));
  });
  return wd>=wl?"#12150F":"#F7F3E8";
}

const fgHex=()=>{
  const v=getComputedStyle(document.body).getPropertyValue("--fg").trim();
  return v.startsWith("#")?v:"#F0E9D8";
};

function drawCal(){
  const PALETTE=[...new Set(DAYS.map((d)=>d.p1).filter(Boolean))];
  loadCalWx();
  const first=d(TRIP.meta.start),y=first.getFullYear(),m=first.getMonth();
  const lead=new Date(y,m,1).getDay(),len=new Date(y,m+1,0).getDate(),today=iso(new Date());
  let cells="";
  for(let i=0;i<lead;i++) cells+=`<div class="cell out"><span class="cnum"></span><em class="ctmp"></em></div>`;
  for(let n=1;n<=len;n++){
    const date=iso(new Date(y,m,n)),day=DAYS.find((x)=>x.date===date),cls=["cell"];
    if(day){cls.push("trip"); if(date<today)cls.push("past");} else cls.push("out");
    if(day&&DAYS[cur].date===date)cls.push("sel");
    if(date===today)cls.push("now");
    const tmp=day&&WXD[date]!=null?tC(WXD[date]):"";
    const NEUT=fgHex();
    let c1=day?(day.p1||NEUT):null,c2=c1;
    if(day&&day.flights.length){
      c1=PORT[day.flights[0].from.code]||day.p1||NEUT;
      c2=PORT[day.flights[day.flights.length-1].to.code]||day.p1||NEUT;
    }
    const neut=c1===NEUT||c2===NEUT;
    if(neut&&day)cls.push("neut");
    const pct=cls.includes("past")?0.32:0.82;
    const ink=neut?inkOn(c1===c2?[c1]:[c1,c2],pct):inkFor(PALETTE,pct);
    const bg=day?`--cc:${c1};--cc2:${c2};--ink:${ink}`:"";
    cells+=`<button class="${cls.join(" ")}${day&&day.flights.length&&c1!==c2?" split":""}" style="${bg}" ${day?`data-go="${DAYS.indexOf(day)}"`:"disabled"} aria-label="${esc(date)}"><span class="cnum">${n}</span><em class="ctmp">${tmp}</em></button>`;
  }
  const seen=[]; TRIP.stays.forEach((s)=>{if(!seen.some((x)=>x.city===s.city))seen.push(s)});
  $("#screen").innerHTML=`<div class="cal">
    <div class="cal-head"><b>${MONTH[m]} ${y}</b><span>TAP A DAY</span></div>
    <div class="grid">${DOW.map((x)=>`<div class="dow">${x[0]}</div>`).join("")}${cells}</div>
    <div class="legend">${seen.map((s)=>`<span><i style="background:${s.pop1}"></i>${esc(s.city)}</span>`).join("")}<span><i style="background:var(--fg)"></i>Travel</span></div>
  </div>
  ${tabs()}`;
  $("#screen").querySelectorAll("[data-go]").forEach((b)=>b.addEventListener("click",()=>go(+b.dataset.go)));
  wireTabs();
}

const R=6371;
function km(a,b,c,d){
  const t=(v)=>v*Math.PI/180, dLat=t(c-a), dLon=t(d-b);
  const h=Math.sin(dLat/2)**2+Math.cos(t(a))*Math.cos(t(c))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
const fmtKm=(k)=>k<1?Math.round(k*1000)+" m":k.toFixed(k<10?1:0)+" km";
const driveMin=(k)=>Math.max(2,Math.round(k*1.3/28*60));
const walkMin=(k)=>Math.round(k*1.25/4.8*60);
const hasCar=(date)=>(TRIP&&TRIP.cars||[]).some((c)=>
  c.pickup&&c.dropoff&&c.pickup.date<=date&&date<=c.dropoff.date);
const nearMin=(date,k)=>hasCar(date)?driveMin(k):walkMin(k);
const nearWord=(date)=>hasCar(date)?"drive":"walk";

function far(sp){
  if(!ME||sp.lat==null) return "";
  const k=km(ME.lat,ME.lng,sp.lat,sp.lng);
  const dir=`https://www.google.com/maps/dir/?api=1&destination=${sp.lat},${sp.lng}`;
  const legs=k<=2
    ? `${WALK}~${walkMin(k)} min`
    : `${CAR}~${driveMin(k)} min`;
  return `<a class="far" href="${dir}" target="_blank" rel="noopener"><span>${fmtKm(k)}</span><span>${legs}</span></a>`;
}

function T(t){
  if(!clock12||!t) return t||"";
  const m=String(t).match(/^(\d{1,2}):(\d{2})/);
  if(!m) return t;
  let h=+m[1]; const mi=m[2], ap=h>=12&&h<24?"pm":"am";
  h=h%12; if(h===0)h=12;
  return h+":"+mi+" "+ap;
}
const Trange=(str)=>String(str).replace(/(\d{1,2}:\d{2})/g,(m)=>T(m));
const tC=(c)=>units==="C"?Math.round(c)+"\u00B0":Math.round(c*9/5+32)+"\u00B0";

function geoFor(x){
  const s=x.arriving[0]||x.stay;
  if(s&&s.lat!=null) return {lat:s.lat,lng:s.lng,city:s.city};
  const i=DAYS.indexOf(x);
  for(let j=i+1;j<DAYS.length;j++){
    const n=DAYS[j].arriving[0]||DAYS[j].stay;
    if(n&&n.lat!=null) return {lat:n.lat,lng:n.lng,city:n.city};
  }
  return null;
}

async function getWx(x){
  const g=geoFor(x); if(!g)return;
  const key=g.city+"|"+x.date;
  if(WX[key]!==undefined) return;
  WX[key]=null;
  try{
    const u=`https://api.open-meteo.com/v1/forecast?latitude=${g.lat}&longitude=${g.lng}`
      +`&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,weather_code`
      +`&daily=weather_code&hourly=temperature_2m,precipitation_probability,uv_index&timezone=auto`
      +`&start_date=${x.date}&end_date=${x.date}`;
    const r=await fetch(u);
    if(!r.ok)throw 0;
    const j=await r.json();
    if(!j.daily||j.daily.time.length===0)throw 0;
    const hrs=j.hourly.time.map((t,i)=>({h:t.slice(11,16),temp:j.hourly.temperature_2m[i],pop:j.hourly.precipitation_probability[i],uv:j.hourly.uv_index[i]}))
      .filter((z)=>z.temp!=null);
    if(!hrs.length) throw 0;
    const temps=hrs.map((z)=>z.temp);
    const hi=j.daily.temperature_2m_max[0]!=null?j.daily.temperature_2m_max[0]:Math.max(...temps);
    const lo=j.daily.temperature_2m_min[0]!=null?j.daily.temperature_2m_min[0]:Math.min(...temps);
    const near=(v)=>hrs.reduce((a,b)=>Math.abs(b.temp-v)<Math.abs(a.temp-v)?b:a).h;
    const over=hrs.filter((z)=>z.uv>2);
    WX[key]={
      hi,lo,
      hiAt:near(hi),loAt:near(lo),
      pop:j.daily.precipitation_probability_max[0]||0,
      code:(j.daily.weather_code||[])[0],
      uvMax:Math.max(0,...hrs.map((z)=>z.uv||0)),
      uvFrom:over.length?over[0].h:null, uvTo:over.length?over[over.length-1].h:null,
      hrs
    };
  }catch{ WX[key]=false; }
  drawDay();
}


function wxSummary(x){
  const g=geoFor(x); if(!g) return "";
  const w=WX[g.city+"|"+x.date];
  if(w===undefined||w===false||w==null) return "";
  const c=condIcon(w.code).t;
  return w.pop>=25?`${c}, ${w.pop}%`:c;
}

function condIcon(c){
  if(c==null) return {i:SUN,t:"Clear"};
  if(c===0) return {i:SUN,t:"Clear"};
  if(c<=3) return {i:CLOUD,t:c===1?"Mostly clear":c===2?"Partly cloudy":"Cloudy"};
  if(c<=48) return {i:CLOUD,t:"Fog"};
  if(c<=67||(c>=80&&c<=82)) return {i:RAINY,t:"Rain"};
  if(c<=77) return {i:CLOUD,t:"Snow"};
  return {i:RAINY,t:"Storms"};
}



function weatherBox(x){
  const g=geoFor(x); if(!g) return "";
  const w=WX[g.city+"|"+x.date];
  if(w===undefined){ getWx(x); return `<p class="wxload">Loading weather</p>`; }
  if(w===false||w==null) return `<p class="wxload">Forecast opens up about two weeks out</p>`;


  const SC=units==="C"?{min:0,max:42}:{min:32,max:108};
  const val=(c)=>units==="C"?c:c*9/5+32;
  const pos=(c)=>Math.max(0,Math.min(100,(val(c)-SC.min)/(SC.max-SC.min)*100));
  const L=pos(w.lo), R=pos(w.hi);
  const cond=condIcon(w.code);
  return `<div class="wxin">
    <div class="wxrow2">
      <span class="tlo">${tC(w.lo)}</span>
      <span class="tbar"><i style="left:${pos(w.lo)}%;width:${Math.max(4,pos(w.hi)-pos(w.lo))}%;background:linear-gradient(90deg,#4FA3D1,#E8C64A,#E2703A)"></i></span>
      <span class="thi">${tC(w.hi)}</span>
    </div>
  </div>`;
}

function localCur(x){
  const s=x.arriving[0]||x.stay;

  if(x.flights.length){
    const to=x.flights[x.flights.length-1].to.code;

    if(d&&d.currency) return d.currency;
  }
  return (TRIP.meta.home&&TRIP.meta.home.currency)||"USD";
}
async function getFX(){
  try{
    const c=JSON.parse(localStorage.getItem("eu26.fx")||"null");
    if(c&&Date.now()-c.t<864e5){ FX=c.r; return; }
  }catch{}
  try{
    const r=await fetch("https://open.er-api.com/v6/latest/USD");
    const j=await r.json();
    if(j&&j.rates){ FX=j.rates; try{localStorage.setItem("eu26.fx",JSON.stringify({t:Date.now(),r:FX}))}catch{} }
  }catch{ FX=null; }
  drawFx();
}
function drawFx(){
  const el=$("#fxbox"); if(!el)return;
  if(!fxOpen){ el.innerHTML=""; return; }
  const x=DAYS[cur], code=localCur(x);
  if(!FX){ el.innerHTML=`<div class="fxpanel"><p class="fxrate">Fetching rates</p></div>`; getFX(); return; }
  const rate=FX[code]||1;
  el.innerHTML=`<div class="fxpanel">
    <div class="fxrow"><span>${esc(code)}</span><input id="fx-loc" inputmode="decimal" value="10"><span>${esc(CUR[code]||code)}</span></div>
    <div class="fxrow" style="margin-top:6px"><span>USD</span><input id="fx-usd" inputmode="decimal" value="${(10/rate).toFixed(2)}"><span>${esc(CUR.USD)}</span></div>
    <p class="fxrate">1 ${esc(code)} = ${(1/rate).toFixed(3)} USD &middot; updated daily</p>
  </div>`;
  const u=$("#fx-usd"), l=$("#fx-loc");
  u.addEventListener("input",()=>{ const v=parseFloat(u.value); l.value=isNaN(v)?"":(v*rate).toFixed(2); });
  l.addEventListener("input",()=>{ const v=parseFloat(l.value); u.value=isNaN(v)?"":(v/rate).toFixed(2); });
}

/* opening a category: the row you tapped IS the header you land on, so move
   it there rather than cutting. measured in document coordinates, because a
   smooth scroll runs alongside this and would otherwise skew the maths.
   the DOM is already in its final state throughout; we only draw things
   back to where they came from and then release them.                    */
const REDUCE=()=>{try{return matchMedia("(prefers-reduced-motion: reduce)").matches}catch{return false}};
const dRect=(el)=>{const r=el.getBoundingClientRect();
  return {top:r.top+window.scrollY,left:r.left+window.scrollX,w:r.width}};

/* one clock for the whole move, in ms. nothing scales, and nothing arrives
   before the row it belongs to has: that is what stops things popping in. */
const A={ease:"cubic-bezier(.22,.72,.3,1)",fade:"cubic-bezier(.33,0,.2,1)",
  travel:260, curtain:300, curtainIn:60,
  row:230, rowIn:110, rowStep:26, rowLift:8,
  ctrl:220, ctrlIn:175, ctrlStep:40};

let catFlip=null;
function armCatFlip(el,dir,key){
  catFlip=null;
  if(!el||REDUCE())return;
  const t=el.querySelector("b")||el, q=$("#pk-q");
  catFlip={dir,key,title:dRect(t),qw:q?dRect(q).w:0};
}

function playCatFlip(){
  const f=catFlip; catFlip=null;
  if(!f)return;
  const sc=$("#screen"); if(!sc)return;

  let head=null;
  if(f.dir==="open") head=sc.querySelector(".pnl.open>.ph .lbl");
  else sc.querySelectorAll(".cats .cat").forEach((c)=>{if(c.dataset.cat===f.key)head=c});
  if(!head)return;

  const set=(el,p)=>{if(el)Object.assign(el.style,p)};
  const clean=[];
  const ti=head.querySelector("b")||head;
  const at=dRect(ti);
  const dy=Math.round(f.title.top-at.top);
  const dx=Math.round(f.title.left-at.left);

  /* the field changes width as the arrow comes and goes: carry it across
     rather than letting it snap */
  const q=$("#pk-q"), qTo=q?dRect(q).w:0;
  const dq=!!(q&&f.qw&&Math.abs(f.qw-qTo)>1);

  /* everything that has to arrive after the row has landed */
  /* the header controls stay put across the move, so only what genuinely
     appears is faded in: the back arrow and the count */
  const late=f.dir==="open"
    ? [sc.querySelector("#pk-back"),sc.querySelector(".pnl.open>.ph .meta")].filter(Boolean)
    : [...sc.querySelectorAll(".cats .cat")].filter((c)=>c!==head);

  const grow=f.dir==="open"?sc.querySelector(".picker .opts"):null;
  const full=grow?grow.scrollHeight:0;
  const H=grow?Math.min(full,Math.max(240,
    Math.round(window.innerHeight-grow.getBoundingClientRect().top+80))):0;
  const rows=grow?[...grow.children].slice(0,10):[];

  set(head,{transition:"none",transform:"translateY("+dy+"px)",willChange:"transform"});
  clean.push(head);
  if(dx&&ti!==head){ set(ti,{transition:"none",transform:"translateX("+dx+"px)"}); clean.push(ti); }
  if(dq){ set(q,{transition:"none",flex:"0 0 auto",width:f.qw+"px"}); clean.push(q); }
  late.forEach((e)=>{ set(e,{transition:"none",opacity:"0",
    transform:"translate"+(f.dir==="open"?"X(-6px)":"Y(8px)")}); clean.push(e); });
  if(grow){ set(grow,{transition:"none",overflow:"hidden",height:"0px"}); clean.push(grow);
    rows.forEach((r)=>{ set(r,{transition:"none",opacity:"0",
      transform:"translateY("+A.rowLift+"px)"}); clean.push(r); }); }

  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    set(head,{transition:"transform "+A.travel+"ms "+A.ease,transform:"translateY(0)"});
    if(dx&&ti!==head)set(ti,{transition:"transform "+A.travel+"ms "+A.ease,transform:"translateX(0)"});
    if(dq)set(q,{transition:"width "+A.travel+"ms "+A.ease,width:qTo+"px"});
    late.forEach((e,i)=>set(e,{
      transition:"opacity "+A.ctrl+"ms "+A.fade+" "+(A.ctrlIn+i*A.ctrlStep)+"ms, "
                +"transform "+A.ctrl+"ms "+A.ease+" "+(A.ctrlIn+i*A.ctrlStep)+"ms",
      opacity:"1",transform:"none"}));
    if(grow){
      set(grow,{transition:"height "+A.curtain+"ms "+A.ease+" "+A.curtainIn+"ms",height:H+"px"});
      rows.forEach((r,i)=>set(r,{
        transition:"opacity "+A.row+"ms "+A.fade+" "+(A.rowIn+i*A.rowStep)+"ms, "
                  +"transform "+A.row+"ms "+A.ease+" "+(A.rowIn+i*A.rowStep)+"ms",
        opacity:"1",transform:"none"}));
    }
  }));

  /* release the curtain to auto the instant it lands, so a long list is
     never left clipped at one screenful */
  if(grow){
    const rel=(ev)=>{ if(ev.target!==grow||ev.propertyName!=="height")return;
      grow.removeEventListener("transitionend",rel);
      grow.style.height=""; grow.style.overflow=""; grow.style.transition=""; };
    grow.addEventListener("transitionend",rel);
  }
  clearTimeout(playCatFlip.t);
  playCatFlip.t=setTimeout(()=>{
    clean.forEach((e)=>{ if(!e)return;
      ["transition","transform","opacity","height","overflow","willChange","width","flex"]
        .forEach((k)=>{e.style[k]=""}); });
  },A.rowIn+rows.length*A.rowStep+A.row+120);
}

function applySnap(){
  if(!snapTo) return;
  const sel=snapTo; snapTo=null;
  const run=()=>{
    const el=document.querySelector(sel); if(!el) return;
    const hdr=document.querySelector(".pnl.open>.ph");
    const inside=hdr&&hdr.contains(el)?0:(el.closest(".pnl.open")&&hdr?hdr.offsetHeight:0);
    const y=el.getBoundingClientRect().top+window.scrollY-inside-14;
    try{ window.scrollTo({top:Math.max(0,y),behavior:"smooth"}); }catch{ window.scrollTo(0,Math.max(0,y)); }
  };
  if(typeof requestAnimationFrame==="function") requestAnimationFrame(run); else setTimeout(run,0);
}

    try{

function flightHero(f,idx){

    <div class="codes">${(f.codes||[]).map((c)=>`<button class="code" data-copy="${esc(c.value)}"><span class="l">${esc(c.label)}</span><span class="v">${esc(c.value)}</span></button>`).join("")}${seats}</div>
    ${notes(f.notes)}`;
  return panel("fl"+idx,"Flight",`${esc(f.from.code)} &rarr; ${esc(f.to.code)} &middot; ${esc(T(f.from.time))}`,body);
}

function byeLine(x){
  const s=x.arriving[0]||x.stay;
  const out=x.leaving.find((l)=>!s||l.name!==s.name);
  return out?`<p class="leave">Check out <b>${esc(out.name)}</b> by <b>${esc(T(out.checkOutTime))}</b></p>`:"";
}

function stayBody(s,arriving){

  if(s.pending||s.informal) return `<p class="hotel">${esc(s.name)}</p><p class="sub">${esc(s.kind)}</p>`;
  return `<p class="hotel">${esc(s.name)}</p>
    ${arriving?`<p class="sub">${esc(s.room)}</p>
      <p class="checkin">Check in ${esc(T(s.checkInTime||"15:00"))}</p>
      ${t?`<div class="xfer"><span class="src">from ${esc(t.from)}</span><span>${CAR}${esc(t.car)}</span><span>${RAIL}${esc(t.transit)} ${esc(t.transitKind)}</span></div>`:""}
      ${codes(s.codes)}`:""}
    <div class="low">
      <span class="who">${esc(s.address||"")}</span>
      ${s.address?`<a class="ico" href="https://maps.google.com/?q=${encodeURIComponent(s.name+", "+s.address)}" target="_blank" rel="noopener" aria-label="Open in Maps">${PIN}</a>`:""}
      ${s.phone?`<a class="ico" href="tel:${esc(s.phone)}" aria-label="Call">${TEL}</a>`:""}
    </div>

}

function carCard(c,i){

     ${codes(c.codes)}
     <div class="low">
       <span class="who">${pick?"Back":"Collected"} ${esc(fmtShort(other.date))} ${esc(T(other.time))}</span>

     </div>`);
}

function checkoutCard(x){
  const line=byeLine(x);
  if(!line||x.arriving.length) return "";
  const out=x.leaving.find((l)=>l.checkOutTime);
  return panel("out","Check out",`${esc(T(out.checkOutTime))}`,

     <div class="low">
       <span class="who">${esc(out.address||"")}</span>
       ${out.address?`<a class="ico" href="https://maps.google.com/?q=${encodeURIComponent(out.name+", "+out.address)}" target="_blank" rel="noopener" aria-label="Open in Maps">${PIN}</a>`:""}
       ${out.phone?`<a class="ico" href="tel:${esc(out.phone)}" aria-label="Call">${TEL}</a>`:""}
     </div>`);

function placeCard(x){
  const arriving=!!x.arriving.length;
  const s=x.arriving[0]||x.stay;
  if(!s) return panel("place","Hotel",esc(x.country),`<p class="sub">Travelling</p>`);
  const tot=nights(s.checkIn,s.checkOut),n=arriving?1:nights(s.checkIn,x.date)+1;
  return panel("place","Hotel",`${MOON}${n} / ${tot}`,`${byeLine(x)}${stayBody(s,arriving)}`);
}

function hoursFor(sp,date){
  if(!sp.hours||!sp.hours.some(Boolean)) return "";
  const h=sp.hours[d(date).getDay()];
  return h?(h==="Open 24h"?h:Trange(h)):"Closed today";
}

function closedDays(sp){
  if(!sp.hours||!sp.hours.some(Boolean)) return "";
  const on=sp.hours.map((h,i)=>h?DOW[i]:null).filter(Boolean);
  const off=sp.hours.map((h,i)=>h?null:DOW[i]).filter(Boolean);
  if(!off.length) return "";
  return on.length<=2?on.join(" and ")+" only":"closed "+off.join(", ");
}

function travelRow(sp){
  if(sp.lat==null||!ME) return "";
  const k=km(ME.lat,ME.lng,sp.lat,sp.lng);
  const dir=(m)=>`https://www.google.com/maps/dir/?api=1&destination=${sp.lat},${sp.lng}&travelmode=${m}`;
  return `<div class="trav">
    <a href="${dir("walking")}" target="_blank" rel="noopener">${WALK}${walkMin(k)} min</a>
    <a href="${dir("transit")}" target="_blank" rel="noopener">${RAIL}Transit</a>
    <a href="${dir("driving")}" target="_blank" rel="noopener">${CAR}${driveMin(k)} min</a>
  </div>`;
}

function links(sp){
  const out=[];
  const dest=sp.lat!=null?`https://www.google.com/maps/dir/?api=1&destination=${sp.lat},${sp.lng}`:sp.url;
  if(dest) out.push(`<a class="lk" href="${esc(dest)}" target="_blank" rel="noopener" aria-label="Map">${PIN}</a>`);
  const wq=sp.web||("https://www.google.com/search?q="+encodeURIComponent((sp.where||sp.name||"")+" "+(sp.cityHint||DAYS[cur].city||"")));
  const ig=/instagram\.com/.test(sp.web||"");
  if(sp.where||sp.name) out.push(`<a class="lk" href="${esc(wq)}" target="_blank" rel="noopener" aria-label="${ig?"Instagram":sp.web?"Website":"Search"}">${ig?INSTA:GLOBE}</a>`);
  if(sp.phone) out.push(`<a class="lk" href="tel:${esc(sp.phone)}" aria-label="Call">${TEL}</a>`);
  return out.join("");
}

function plannedToday(date){
  const set=new Set();
  (PLANS[date]||[]).forEach((p)=>{ const k=(p.url||p.where||"").toLowerCase(); if(k) set.add(k); });
  return set;
}

function plannedMap(){
  const m={};
  Object.keys(PLANS).forEach((dt)=>PLANS[dt].forEach((p)=>{
    const k=(p.url||p.where||"").toLowerCase();
    if(k) m[k]=dt;
  }));
  return m;
}

function openNow(sp,date){
  if(!sp.hours||!sp.hours.some(Boolean)) return null;
  const h=hoursFor(sp,date);
  const today=date===iso(new Date());
  if(h==="Open 24h") return {open:true,label:""};
  if(!today) return {open:true,label:h==="Closed today"?"Closed":Trange(h)};
  if(h==="Closed today"){
    const d=new Date(date+"T00:00:00");
    for(let i=1;i<=7;i++){
      const n=new Date(d); n.setDate(d.getDate()+i);
      if(sp.hours[n.getDay()]) return {open:false,label:"Closed until "+DOW[n.getDay()]};
    }
    return {open:false,label:"Closed"};
  }
  const now=new Date(), mins=now.getHours()*60+now.getMinutes();
  let next=null;
  for(const part of h.split(",").map((z)=>z.trim())){
    const m=part.match(/(\d{1,2}):(\d{2})\D+(\d{1,2}):(\d{2})/); if(!m) continue;
    const a=+m[1]*60+ +m[2]; let b=+m[3]*60+ +m[4];
    if(b<=a) b+=1440;
    if(mins>=a&&mins<b) return {open:true,label:Trange(part)};
    if(a>mins&&(next===null||a<next)) next=a;
  }
  if(next!=null){
    const hh=String(Math.floor(next/60)).padStart(2,"0"), mm=String(next%60).padStart(2,"0");
    return {open:false,label:"Closed until "+T(hh+":"+mm)};
  }
  return {open:false,label:"Closed"};
}

function infoLine(sp,date){
  const out=[];
  const c=closedDays(sp); if(c) out.push(esc(c));
  if(sp.facil) out.push(esc(sp.facil));
  else if(sp.meals) out.push(esc(sp.meals));
  if(sp.note) out.push(esc(sp.note));
  return out.join(" &middot; ");
}

function rowHead(sp,date,acts,sub){
  const st=openNow(sp,date);
  const shut=st&&!st.open;
  const line=[sp.type?esc(sp.type):"",st&&st.label?`<em class="rwin${shut?" shut":""}">${st.label}</em>`:""].filter(Boolean);
  /* the controls float, so copy wraps around them and then reclaims the
     full width once it is below them. it can never run underneath. */
  return {shut,html:`<div class="rname">
    ${acts?`<span class="racts">${acts}</span>`:""}
    <b>${esc(sp.name||sp.where||"")}</b>
    ${line.length?`<p class="rtype">${line.join(" &middot; ")}</p>`:""}
    ${sub?`<p class="pmeta">${sub}</p>`:""}
  </div>`};
}

function enrich(p,city){
  const list=SPOTS[city]||[];
  const k=nkey({name:p.where||""});
  if(!k) return p;
  const m=list.find((sp)=>nkey(sp)===k);
  if(!m) return p;
  return {...p,type:m.type||p.type,meals:m.meals||p.meals,facil:m.facil||p.facil,
    note:(p.note!==undefined&&p.note!=="")?p.note:m.note,hours:m.hours||p.hours,web:m.web||p.web,
    phone:m.phone||p.phone,lat:p.lat!=null?p.lat:m.lat,lng:p.lng!=null?p.lng:m.lng};
}

function planRow(p0,i,date){
  const p=enrich(p0,(DAYS[cur]||{}).city||"");
  const t=p.time?(p.end?`${esc(T(p.time))} &ndash; ${esc(T(p.end))}`:esc(T(p.time))):"";
  const head=p.where||p.what||"Plan";
  const acts=links(p)+((ME&&p.lat!=null)?`<button class="goq" data-trav="${i}">${NEAR}</button>`:"")
    +(editing===i?"":`<button class="grip" data-grip data-dragh="${i}" aria-label="Actions, drag to reorder">${GRIP}</button>`);
  const sub=infoLine(p,date);
  const hd=rowHead({...p,name:head},date,acts,sub);
  return `<div class="swipe${p.done?" arch":""}${hd.shut?" shut":""}" id="plan-${i}">
    <div class="swipe-actions">
      <button class="sa" data-sw-edit="${i}" aria-label="Edit">${PENCIL}</button>
      <button class="sa" data-sw-arch="${i}" aria-label="Archive">${ARCH}</button>
      <button class="sa del" data-sw-del="${i}" aria-label="Delete">${XMARK}</button>
    </div>
    <div class="swipe-body"><div class="plan">
    <button class="ptime${p.time?"":" tbd"}${editing===i?" on":""}" data-time="${i}" aria-label="${p.time?"Time":"Set a time"}"><span>${t||"--:--"}</span><i></i></button>
    ${hd.html}
    ${travOpen===i?travelRow(p):""}
    ${editing===i?planEditor(p,i):""}
  </div></div></div>`;
}

const fmtShort=(dt)=>{const t=new Date(dt+"T00:00:00");return DOW[t.getDay()]+" "+t.getDate();};

let pickHead={label:"Add a plan",meta:""};
function picker(x){
  pickHead={label:"Add a plan",meta:""};
  const q=(pick.q||"").trim();
  const parsed=parseSpot(pick.q);
  const isLink=!!parsed.url;
  const city=x.city;
  const done=plannedMap();
  const today=plannedToday(x.date);
  const key=(sp)=>(sp.url||sp.name||"").toLowerCase();
  const pool=(SPOTS[city]||[]).map((sp,i)=>({sp,i})).filter(({sp})=>!sp.done&&!today.has(key(sp)));

  const row=(o,dim)=>`<div class="optwrap${openNow(o.sp,x.date)&&!openNow(o.sp,x.date).open?" shut":""}">
      <button class="opt${dim?" dim":""}" data-pickspot="${o.i}">
        ${rowHead(o.sp,x.date,"",infoLine(o.sp,x.date)+(dim?" &middot; planned "+esc(fmtShort(done[key(o.sp)])):"")).html}
      </button>
      ${(ME&&o.sp.lat!=null)?`<button class="goq opt-go" data-travspot="${o.i}">${NEAR}</button>`:""}
      ${travOpen==="s"+o.i?travelRow(o.sp):""}
    </div>`;

  const listOf=(arr)=>{
    const a=sortList(arr,(o)=>o.sp);
    const fresh=a.filter(({sp})=>!done[key(sp)]);
    const used=a.filter(({sp})=>done[key(sp)]);
    return fresh.map((o)=>row(o)).join("")+used.map((o)=>row(o,true)).join("");
  };

  let body;
  if(isLink){
    body=`<div class="chips sec">${SECTIONS.map((k)=>`<button class="${(pick.sec||parsed.sec)===k?"on":""}" data-psec="${esc(k)}">${esc(k)}</button>`).join("")}</div>
      <button class="save" id="pk-new">Add ${esc(parsed.name||"this place")}</button>`;
  }else if(q){
    const hits=pool.filter(({sp})=>(sp.name+" "+(sp.type||"")).toLowerCase().includes(q.toLowerCase()));
    const exact=pool.some(({sp})=>sp.name.toLowerCase()===q.toLowerCase());
    body=`${exact?"":`<button class="save" id="pk-new">Add &ldquo;${esc(q)}&rdquo;</button>`}
      <div class="opts">${hits.length?listOf(hits):`<p class="empty">Nothing matches.</p>`}</div>`;
  }else if(pick.cat){
    pickHead={label:pick.cat==="__near"?"Nearby":pick.cat,meta:""};
    const items=pick.cat==="__near"
      ? pool.filter(({sp})=>sp.lat!=null&&ME&&nearMin(x.date,km(ME.lat,ME.lng,sp.lat,sp.lng))<=15)
      : pool.filter(({sp})=>sp.sec===pick.cat);
    pickHead.meta=String(items.length);
    body=`<div class="opts">${items.length?listOf(items):`<p class="empty">${pick.cat==="__near"?(ME?`Nothing within a 15 minute ${nearWord(x.date)}.`:"Turn on location to see what is close."):"Nothing here yet."}</p>`}</div>`;
  }else{
    const near=ME?pool.filter(({sp})=>sp.lat!=null&&nearMin(x.date,km(ME.lat,ME.lng,sp.lat,sp.lng))<=15).length:null;
    body=`<div class="cats">
      <button class="cat near" data-cat="__near"><b>Nearby</b><span>${near==null?`15 min ${nearWord(x.date)}`:near}</span></button>
      ${SECTIONS.map((sec)=>{
        const n=pool.filter(({sp})=>sp.sec===sec).length;
        if(!n) return "";
        return `<button class="cat" data-cat="${esc(sec)}"><b>${esc(sec)}</b><span>${n}</span></button>`;
      }).join("")}</div>`;
  }

  return `<div class="picker">
    <div class="pkq">
      ${pick.cat?`<button class="cback" id="pk-back" aria-label="Back to categories">&larr;</button>`:""}
      <input id="pk-q" value="${esc(pick.q||"")}" placeholder="Search, type a new one, or paste a link" autocomplete="off" autocorrect="off" spellcheck="false">
    </div>
    ${body}
    <button class="cancel" id="pk-cancel">Cancel</button>
  </div>`;
}

function planEditor(p,i){
  return `<div class="form">
    <div class="fld"><span class="k">When</span><div class="two">
      <input id="e-time" type="time" value="${esc(p.time||"")}"><span>to</span><input id="e-end" type="time" value="${esc(p.end||"")}">
    </div></div>
    <div class="fld"><span class="k">Note</span><input id="e-note" value="${esc(p.note||"")}" placeholder="Optional" autocomplete="off"></div>
    <button class="save" id="e-save">Save</button>
    <div class="row2"><button class="cancel" id="e-cancel">Cancel</button><button class="kill" id="e-kill">Delete</button></div>
  </div>`;
}

const distOf=(o)=>(ME&&o.lat!=null)?km(ME.lat,ME.lng,o.lat,o.lng):Infinity;
const nameOf=(o)=>(o.where||o.name||"").toLowerCase();

function sortList(arr,getter){
  const a=arr.slice();
  if(sortMode==="ABC") a.sort((x,y)=>nameOf(getter(x)).localeCompare(nameOf(getter(y))));
  else if(sortMode==="KM") a.sort((x,y)=>distOf(getter(x))-distOf(getter(y)));
  return a;
}

/* two toggles, both circles, mutually exclusive. neither one on means the
   natural order: by time for plans, in the order added for places. */
const SORTCYC=["ABC","123","KM"];
const SORTWORD={ABC:"name","123":"time",KM:"distance"};
const sortBtn=()=>{
  const cur=SORTCYC.includes(sortMode)?sortMode:"123";
  const next=SORTCYC[(SORTCYC.indexOf(cur)+1)%SORTCYC.length];
  return `<button class="hbtn${cur==="123"?"":" on"}" data-sort="${next}"
    aria-label="Sorted by ${SORTWORD[cur]}, tap to sort by ${SORTWORD[next]}"
    >${cur==="KM"?LOC:cur}</button>`;
};

const SKIP=new Set(["the","a","an","of","de","du","la","le","el","and","at","in","on","d","der","das","den"]);
function abbr(str){
  const w=(str||"").replace(/[^\p{L}\p{N} ]/gu," ").trim().split(/\s+/).filter(Boolean);
  const keep=w.filter((t,i)=>i===0?!SKIP.has(t.toLowerCase())||w.length===1:!SKIP.has(t.toLowerCase()));
  const use=keep.length?keep:w;
  if(!use.length) return "?";
  if(use.length===1) return use[0].slice(0,3).toUpperCase();
  return (use[0][0]+use[1][0]).toUpperCase();
}

function geoPlans(x){
  const list=PLANS[x.date]||[];
  const rows=list.map((p,i)=>({p,i})).filter(({p})=>p.lat!=null&&!p.done);
  rows.sort((a,b)=>(a.p.time||"99").localeCompare(b.p.time||"99"));
  return rows.map((o)=>o.p);
}

function routeUrl(x){
  const g=geoPlans(x);
  if(!g.length) return "";
  const pt=(p)=>`${p.lat},${p.lng}`;
  const dest=g[g.length-1], mids=g.slice(0,-1);
  let u=`https://www.google.com/maps/dir/?api=1&destination=${pt(dest)}&travelmode=walking`;
  if(ME) u+=`&origin=${ME.lat},${ME.lng}`;
  if(mids.length) u+=`&waypoints=${mids.map(pt).join("|")}`;
  return u;
}

function miniMap(x){
  const g=geoPlans(x);
  const noLoc=(PLANS[x.date]||[]).filter((p)=>p.lat==null&&!p.done).length;
  if(!g.length) return `<div class="mapwrap"><p class="empty">No plans with a location yet.</p></div>`;
  const pts=g.map((p)=>({x:p.lng*Math.cos(p.lat*Math.PI/180),y:-p.lat,p}));
  if(ME) pts.push({x:ME.lng*Math.cos(ME.lat*Math.PI/180),y:-ME.lat,me:1});
  const xs=pts.map((q)=>q.x),ys=pts.map((q)=>q.y);
  const W=320,H=170,PAD=26;
  let x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  let dx=x1-x0,dy=y1-y0;
  const span=Math.max(dx,dy,0.0008);
  const cx=(x0+x1)/2, cy=(y0+y1)/2;
  x0=cx-span/2; x1=cx+span/2; y0=cy-span/2; y1=cy+span/2;
  const sx=(v)=>PAD+((v-x0)/(x1-x0))*(W-2*PAD);
  const sy=(v)=>PAD+((v-y0)/(y1-y0))*(H-2*PAD);
  const path=g.map((p,i)=>{const q=pts[i];return `${i?"L":"M"}${sx(q.x).toFixed(1)} ${sy(q.y).toFixed(1)}`;}).join(" ");
  const kmPerDeg=111.32*Math.cos((-cy)*Math.PI/180);
  const barKm=(()=>{const total=span*kmPerDeg;const nice=[0.2,0.5,1,2,5,10,20,50,100];return nice.find((n)=>n>=total/3)||100;})();
  const barPx=(barKm/(span*kmPerDeg))*(W-2*PAD);
  return `<div class="mapwrap">
    <svg viewBox="0 0 ${W} ${H}" class="mmap" aria-hidden="true">
      ${g.length>1?`<path d="${path}" fill="none" stroke="var(--mute)" stroke-width="1.4" stroke-dasharray="4 3"/>`:""}
      ${ME?`<circle cx="${sx(pts[pts.length-1].x).toFixed(1)}" cy="${sy(pts[pts.length-1].y).toFixed(1)}" r="5" fill="none" stroke="var(--fg)" stroke-width="1.6"/>`:""}
      ${g.map((p,i)=>{
        const q=pts[i], lbl=abbr(p.where||p.name), w=lbl.length*8+14, cxp=sx(q.x), cyp=sy(q.y);
        return `<g><rect x="${(cxp-w/2).toFixed(1)}" y="${(cyp-9).toFixed(1)}" width="${w}" height="18" rx="9" fill="var(--fg)"/><text x="${cxp.toFixed(1)}" y="${(cyp+3.8).toFixed(1)}" text-anchor="middle" font-size="10.5" font-family="monospace" fill="var(--bg)">${esc(lbl)}</text></g>`;
      }).join("")}
      <line x1="${PAD}" y1="${H-10}" x2="${PAD+barPx.toFixed(1)}" y2="${H-10}" stroke="var(--mute)" stroke-width="1.4"/>
      <text x="${PAD+barPx/2}" y="${H-15}" text-anchor="middle" font-size="9" font-family="monospace" fill="var(--mute)">${barKm<1?barKm*1000+" m":barKm+" km"}</text>
    </svg>
    <p class="mapkey">${g.map((p)=>`<b>${esc(abbr(p.where||p.name))}</b> ${esc(p.where||p.name||"")}`).join("  &middot;  ")}${noLoc?`  &middot;  ${noLoc} without a location`:""}</p>
  </div>`;
}

function plansBlock(x){
  const list=PLANS[x.date]||[];
  let rows=list.map((p,i)=>({p,i}));
  if(sortMode==="123"){
    const timed=rows.filter(({p})=>p.time).sort((a,b)=>a.p.time.localeCompare(b.p.time));
    rows=timed.concat(rows.filter(({p})=>!p.time));
  }else{
    rows=sortList(rows,(o)=>o.p);
  }
  rows=rows.filter(({p})=>!p.done).concat(rows.filter(({p})=>p.done));
  let body="";
  if(list.length) body=rows.map(({p,i})=>planRow(p,i,x.date)).join("");
  const lead="";
  const gp=geoPlans(x), ru=routeUrl(x);
  const tail=sortBtn()
    +`<button class="hbtn${mapOpen?" on":""}${gp.length?"":" off"}" id="mapbtn" aria-label="Map">${MAPICON}</button>`
    +(ru?`<a class="hbtn" href="${esc(ru)}" target="_blank" rel="noopener" aria-label="Route">${ROUTE}</a>`
        :`<span class="hbtn off" aria-hidden="true">${ROUTE}</span>`);
  if(pick){ const pb=picker(x);
    return panel("plans",esc(pickHead.label),pickHead.meta,pb,{tail}); }
  if(editing===null) body+=`<button class="bigadd" id="p-add">+ New plan</button>`;
  return panel("plans","Plans","",(mapOpen?miniMap(x):"")+body,{tail});
}

function wirePlans(x){
  const add=$("#p-add");
  if(add) add.addEventListener("click",()=>{pick={q:"",sec:null,cat:null};editing=null;snapTo=".pnl.open>.ph";drawDay()});

  $("#screen").querySelectorAll("[data-trav]").forEach((b)=>b.addEventListener("click",(e)=>{
    e.stopPropagation();
    travOpen=travOpen===+b.dataset.trav?null:+b.dataset.trav; drawDay();
  }));
  if($("#mapbtn")) $("#mapbtn").addEventListener("click",(e)=>{e.stopPropagation();mapOpen=!mapOpen;drawDay();});
  wireSwipe(x);
  wireDrag(x);
  applySnap();
  $("#screen").querySelectorAll("[data-editplan]").forEach((b)=>b.addEventListener("click",()=>{
    editing=+b.dataset.editplan; pick=null; drawDay();
  }));

  if(pick){
    const q=$("#pk-q");
    const sync=()=>{ pick.q=q.value; };
    q.addEventListener("input",()=>{
      const caret=q.selectionStart, wasLink=!!parseSpot(pick.q).url;
      pick.q=q.value;
      if(wasLink!==!!parseSpot(pick.q).url) pick.sec=null;
      drawDay();
      const n=$("#pk-q"); if(n){ n.focus(); try{n.setSelectionRange(caret,caret)}catch{} }
    });
    q.addEventListener("paste",()=>setTimeout(()=>{pick.q=q.value;pick.sec=null;drawDay();$("#pk-q").focus();},0));
    $("#pk-cancel").addEventListener("click",()=>{pick=null;drawDay()});
    $("#screen").querySelectorAll("[data-travspot]").forEach((b)=>b.addEventListener("click",(e)=>{
      e.stopPropagation();
      const k="s"+b.dataset.travspot;
      travOpen=travOpen===k?null:k; drawDay();
    }));
    $("#screen").querySelectorAll("[data-cat]").forEach((b)=>b.addEventListener("click",()=>{
      pick.cat=b.dataset.cat;
      if(b.dataset.cat==="__near"&&!ME){ askLoc(); return; }
      armCatFlip(b,"open",b.dataset.cat);
      snapTo=".pnl.open>.ph"; drawDay(); playCatFlip();
    }));
    if($("#pk-back")) $("#pk-back").addEventListener("click",()=>{
      armCatFlip($("#screen .pnl.open>.ph .lbl"),"close",pick.cat);
      pick.cat=null; drawDay(); playCatFlip();
    });
    $("#screen").querySelectorAll("[data-psec]").forEach((b)=>b.addEventListener("click",()=>{sync();pick.sec=b.dataset.psec;drawDay()}));

    $("#screen").querySelectorAll("[data-pickspot]").forEach((b)=>b.addEventListener("click",()=>{
      sync();
      const sp=(SPOTS[x.city]||[])[+b.dataset.pickspot];
      addPlan(x,{where:sp.name,type:sp.type||"",meals:sp.meals||"",facil:sp.facil||"",note:sp.note||"",web:sp.web||"",url:sp.url,lat:sp.lat,lng:sp.lng,phone:sp.phone||"",hours:sp.hours||null});
    }));

    const nw=$("#pk-new");
    if(nw) nw.addEventListener("click",()=>{
      sync();
      const p=parseSpot(pick.q);
      const title=p.url?(p.name||"New place"):pick.q.trim();
      if(!title) return;
      if(p.url){
        const sec=pick.sec||p.sec;
        (SPOTS[x.city]=SPOTS[x.city]||[]).push({name:title,url:p.url,sec,lat:p.lat,lng:p.lng});
        saveSpots(); push("spots:"+x.city);
      }
      addPlan(x,{where:title,url:p.url||"",lat:p.lat,lng:p.lng});
    });
  }

  if(typeof editing==="number"){
    $("#e-cancel").addEventListener("click",()=>{editing=null;drawDay()});
    $("#e-kill").addEventListener("click",()=>{
      PLANS[x.date].splice(editing,1);
      if(!PLANS[x.date].length)delete PLANS[x.date];
      savePlans(); editing=null; drawDay(); push(x.date); toast("Deleted");
    });
    $("#e-save").addEventListener("click",()=>{
      const p=PLANS[x.date][editing];
      p.time=$("#e-time").value; p.end=$("#e-end").value; p.note=$("#e-note").value.trim();
      savePlans(); editing=null; drawDay(); push(x.date); toast("Saved");
    });
  }
}

function wireSwipe(x){
  $("#screen").querySelectorAll(".swipe").forEach((el)=>{
    const body=el.querySelector(".swipe-body");
    const W=el.querySelector(".swipe-actions").children.length*SA_W;
    let x0=null,y0=null,dx=0,lock=null,open=el.classList.contains("open");
    const set=(v)=>{body.style.transform=`translateX(${v}px)`;};
    el.addEventListener("touchstart",(e)=>{const t=e.touches[0];x0=t.clientX;y0=t.clientY;lock=null;dx=open?-W:0;body.style.transition="";},{passive:true});
    el.addEventListener("touchmove",(e)=>{
      if(x0==null)return; const t=e.touches[0];
      const ax=t.clientX-x0, ay=t.clientY-y0;
      if(lock===null) lock=Math.abs(ax)>Math.abs(ay)+6?"x":"y";
      if(lock!=="x")return;
      dx=Math.max(-W,Math.min(0,(open?-W:0)+ax));
      set(dx);
    },{passive:true});
    el.addEventListener("touchend",()=>{
      if(lock!=="x"){x0=null;return;}
      body.style.transition="transform .2s ease";
      open=dx<-W/2;
      set(open?-W:0);
      el.classList.toggle("open",open);
      x0=null;
    });
  });

  $("#screen").querySelectorAll("[data-time]").forEach((b)=>b.addEventListener("click",(e)=>{
    e.stopPropagation();
    const k=+b.dataset.time;
    editing=editing===k?null:k;
    if(editing!==null) snapTo="#plan-"+k;
    drawDay();
  }));
  $("#screen").querySelectorAll("[data-grip]").forEach((b)=>b.addEventListener("click",(e)=>{
    e.stopPropagation();
    const el=b.closest(".swipe"), body=el.querySelector(".swipe-body");
    const W=el.querySelector(".swipe-actions").children.length*SA_W;
    const open=!el.classList.contains("open");
    body.style.transition="transform .2s ease";
    body.style.transform=open?`translateX(${-W}px)`:"";
    el.classList.toggle("open",open);
  }));
  $("#screen").querySelectorAll("[data-sw-edit]").forEach((b)=>b.addEventListener("click",()=>{
    editing=+b.dataset.swEdit; pick=null; snapTo="#plan-"+editing; drawDay();
  }));
  $("#screen").querySelectorAll("[data-sw-arch]").forEach((b)=>b.addEventListener("click",()=>{
    const p=PLANS[x.date][+b.dataset.swArch]; p.done=!p.done;
    savePlans(); drawDay(); push(x.date);
  }));
  $("#screen").querySelectorAll("[data-sw-del]").forEach((b)=>b.addEventListener("click",()=>{
    PLANS[x.date].splice(+b.dataset.swDel,1);
    if(!PLANS[x.date].length)delete PLANS[x.date];
    savePlans(); editing=null; drawDay(); push(x.date); toast("Deleted");
  }));
  $("#screen").querySelectorAll("[data-sw-sarch]").forEach((b)=>b.addEventListener("click",()=>{
    const [c,i]=b.dataset.swSarch.split("|");
    SPOTS[c][+i].done=!SPOTS[c][+i].done; saveSpots(); draw(); push("spots:"+c);
  }));
  $("#screen").querySelectorAll("[data-sw-sdel]").forEach((b)=>b.addEventListener("click",()=>{
    const [c,i]=b.dataset.swSdel.split("|");
    SPOTS[c].splice(+i,1); if(!SPOTS[c].length)delete SPOTS[c];
    saveSpots(); draw(); push("spots:"+c); toast("Removed");
  }));
}

function wireDrag(x){
  const rows=[...document.querySelectorAll('.swipe[id^="plan-"]')];
  if(rows.length<2) return;
  rows.forEach((row)=>{
    const h=row.querySelector('[data-dragh]'); if(!h) return;
    let dragging=false,startY=0,curOrder=rows.map((r)=>+r.id.slice(5)),homeY=0;
    const H=row.offsetHeight;
    const others=()=>rows.filter((r)=>r!==row);
    const settle=()=>{
      rows.forEach((r)=>{ r.style.transition='transform .16s ease'; r.style.transform=''; });
      dragging=false;
      setTimeout(()=>rows.forEach((r)=>{ r.style.transition=''; }),180);
    };
    h.addEventListener('pointerdown',(e)=>{
      e.preventDefault();
      dragging=true; startY=e.clientY; homeY=row.getBoundingClientRect().top;
      row.classList.add('drag'); row.style.zIndex=20; row.style.transition='';
      try{ h.setPointerCapture(e.pointerId); }catch{}
    });
    h.addEventListener('pointermove',(e)=>{
      if(!dragging) return;
      const dy=e.clientY-startY;
      row.style.transform=`translateY(${dy}px)`;
      const myIdx=curOrder.indexOf(+row.id.slice(5));
      others().forEach((o)=>{
        const oIdx=curOrder.indexOf(+o.id.slice(5));
        const oHome=rows.indexOf(o)*H;
        const dragCenter=rows.indexOf(row)*H+dy+H/2;
        const shouldShiftUp = oIdx>myIdx && dragCenter < oHome+H/2;
        const shouldShiftDown = oIdx<myIdx && dragCenter > oHome+H/2;
        if(shouldShiftUp){ o.style.transform=`translateY(${-H}px)`; }
        else if(shouldShiftDown){ o.style.transform=`translateY(${H}px)`; }
        else{ o.style.transform=''; }
      });
    });
    const finish=()=>{
      if(!dragging) return;
      const dy=parseFloat((row.style.transform.match(/-?\d+\.?\d*/)||[0])[0])||0;
      const shiftedUp=others().filter((o)=>o.style.transform.includes('-'+H)).length;
      const shiftedDown=others().filter((o)=>{const m=o.style.transform.match(/\d+/); return m&&+m[0]===H&&!o.style.transform.includes('-');}).length;
      const from=+row.id.slice(5);
      const origPos=rows.indexOf(row);
      let newPos=origPos+shiftedDown-shiftedUp;
      newPos=Math.max(0,Math.min(rows.length-1,newPos));
      row.classList.remove('drag'); row.style.zIndex='';
      settle();
      if(newPos!==origPos){
        const list=PLANS[x.date];
        const [moved]=list.splice(from,1);
        const np=Math.max(0,Math.min(list.length,newPos));
        list.splice(np,0,moved);
        savePlans(); sortMode='123'; try{localStorage.setItem('eu26.sort','123')}catch{};
        drawDay(); push(x.date);
      }
    };
    h.addEventListener('pointerup',finish);
    h.addEventListener('pointercancel',finish);
  });
}

function addPlan(x,p){
  const list=PLANS[x.date]=PLANS[x.date]||[];
  list.push({...p,time:"",end:""});
  savePlans(); pick=null; editing=list.length-1; snapTo="#plan-"+(list.length-1); drawDay(); push(x.date);
}


const codes=(l)=>!l?"":`<div class="codes">${l.map((c)=>
  `<button class="code" data-copy="${esc(c.value)}"><span class="l">${esc(c.label)}</span><span class="v">${esc(c.value)}</span></button>`).join("")}</div>`;
const notes=(l)=>!l||!l.length?"":`<div class="notes">${l.map((n)=>`<p>${esc(n)}</p>`).join("")}</div>`;

let tt;
function toast(m){const e=$("#toast");e.textContent=m;e.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>e.classList.remove("on"),1400)}

try{setTheme(localStorage.getItem("eu26.light")==="1")}catch{}

if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})});
}
boot();
